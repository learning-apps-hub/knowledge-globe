# This workflow ships in BOTH repos: it lives on `main` in the private repo and
# is carried into the public repo by scripts/publish_public.sh, which derives
# the public branch from `main`. Only the public repo can actually serve Pages
# (GitHub does not host free Pages from a private repo), so the jobs are gated
# on the repository name. Without that gate every push to the private `main`
# produced a failed run, and a permanently red X hides real failures.
#
# Do not "fix" this by deleting the file — publish_public.sh would then strip it
# from the public repo and the live site would stop deploying.

name: Deploy production to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # Skipped in the private repo, which cannot serve Pages. `deploy` needs
    # this job, so it skips with it.
    if: github.repository == 'learning-apps-hub/knowledge-globe'
    runs-on: ubuntu-latest
    steps:
      - name: Check out production
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build static production site
        run: python3 scripts/build_pages.py --output _site
      - name: Verify production artifact
        run: python3 tests/pages_build_test.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
