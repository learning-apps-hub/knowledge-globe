name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conventions:
    name: Conventions (docs match code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      # Stdlib only, no server, no network — the cheap guard against the
      # written constraints drifting away from the code again.
      - run: python3 tests/conventions_test.py

  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - run: pip install flake8
      - run: flake8 app/ --max-line-length=120

  security:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - run: pip install bandit
      - run: bandit -r app/ -ll --exclude app/static
