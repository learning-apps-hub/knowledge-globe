<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knowledge Globe — Explore preview</title>
<!--
  PREVIEW, not the viewer. One graph of points, nine questions, one centre. Earth view only so far.
  Design: working files/ONE_GRAPH_DESIGN.md (vault). Served only by the LAN app
  at /explore; the Pages build does not copy this file.
-->
<style>
  @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap");

  :root {
    color-scheme: dark;
    --night: #061017;
    --glass: rgba(9, 23, 31, .78);
    --glass-strong: rgba(10, 25, 34, .95);
    --line: rgba(190, 225, 235, .14);
    --line-strong: rgba(190, 225, 235, .28);
    --ink: #f3f7f7;
    --ink-soft: #b7c9ce;
    --ink-dim: #789098;
    --aqua: #55e4d1;
    --gold: #ffd57a;
    --panel: 372px;
    --move: .8s cubic-bezier(.22, .8, .24, 1);
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--ink);
    font: 14px/1.5 "DM Sans", system-ui, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--aqua); outline-offset: 3px; }

  .app {
    position: fixed;
    inset: 0 0 auto 0;
    /* --app-h is the height the browser really shows (set from visualViewport). */
    height: var(--app-h, 100dvh);
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--panel);
    grid-template-rows: 58px 40px minmax(0, 1fr);
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(20, 70, 84, .34), transparent 62%),
      var(--night);
  }
  #globe { grid-column: 1; grid-row: 1 / -1; width: 100%; height: 100%; min-width: 0; min-height: 0; }

  .top {
    grid-column: 1; grid-row: 1;
    z-index: 3;
    display: flex; align-items: center; gap: 10px;
    padding: 0 16px;
  }
  .brand { font: 700 15px/1 "Manrope", sans-serif; letter-spacing: -.01em; white-space: nowrap; }
  .brand small {
    margin-left: 8px; padding: 3px 7px; border-radius: 99px;
    border: 1px solid color-mix(in srgb, var(--gold) 50%, transparent);
    color: var(--gold); font: 700 9px/1 "DM Sans", sans-serif; letter-spacing: .12em; text-transform: uppercase;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    height: 36px; padding: 0 13px;
    border: 1px solid var(--line-strong); border-radius: 99px;
    background: var(--glass); backdrop-filter: blur(10px);
    white-space: nowrap; text-decoration: none; color: var(--ink);
  }
  .pill svg { width: 15px; height: 15px; flex: none; }
  .pill small { color: var(--ink-dim); font-size: 12px; }
  .search { position: relative; flex: 1; min-width: 0; max-width: 380px; margin-left: auto; }
  .search input {
    width: 100%; height: 36px; padding: 0 14px;
    border: 1px solid var(--line-strong); border-radius: 99px;
    background: var(--glass); backdrop-filter: blur(10px);
  }
  .search input::placeholder { color: var(--ink-dim); }
  .results {
    position: absolute; left: 0; right: 0; top: 42px; z-index: 6;
    display: none; max-height: 56vh; overflow: auto; padding: 6px;
    border: 1px solid var(--line-strong); border-radius: 14px;
    background: var(--glass-strong); box-shadow: 0 22px 70px rgba(0, 0, 0, .5);
  }
  .results.open { display: block; }
  .results h4 { margin: 6px 8px 4px; color: var(--ink-dim); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
  .results button {
    display: block; width: 100%; padding: 8px 10px; border: 0; border-radius: 9px;
    background: none; text-align: left;
  }
  .results button:hover, .results button:focus-visible { background: rgba(85, 228, 209, .12); }
  .results button small { display: block; color: var(--ink-dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .trail {
    grid-column: 1; grid-row: 2;
    z-index: 2;
    display: flex; align-items: center; gap: 4px;
    padding: 0 16px; overflow: hidden; white-space: nowrap;
    color: var(--ink-dim); font-size: 12px;
  }
  .trail button {
    flex: none; max-width: 150px; height: 26px; padding: 0 10px;
    border: 1px solid var(--line); border-radius: 99px; background: rgba(9, 23, 31, .6);
    color: var(--ink-soft); font-size: 12px; overflow: hidden; text-overflow: ellipsis;
  }
  .trail button.here { border-color: color-mix(in srgb, var(--aqua) 60%, transparent); color: var(--ink); }
  .trail i { flex: none; font-style: normal; opacity: .6; }

  #stage { grid-column: 1; grid-row: 3; position: relative; z-index: 1; min-width: 0; min-height: 0; overflow: hidden; }
  #links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* Pins are placed by place() every frame from their spot on the globe, so
     only their size eases here. */
  .tok {
    --accent: var(--aqua);
    position: absolute; left: 0; top: 0;
    will-change: transform, opacity;
    transition: width var(--move), height var(--move);
  }
  /* The pin's footprint on the globe: flattened toward the rim like a disc
     lying on a ball, so the pin reads as sitting on the surface. */
  .base {
    position: absolute; left: 50%; top: 50%; width: 138%; height: 138%;
    border-radius: 50%; pointer-events: none;
    transform: translate(-50%, -50%) rotate(var(--tilt, 0rad)) scaleX(var(--squash, 1));
    background: radial-gradient(closest-side, rgba(1, 10, 16, .75) 56%, color-mix(in srgb, var(--accent) 55%, transparent) 70%, color-mix(in srgb, var(--accent) 12%, transparent) 84%, transparent 100%);
  }
  .face {
    position: absolute; inset: 0;
    display: block; padding: 0; overflow: hidden;
    border: 2px solid color-mix(in srgb, var(--accent) 70%, transparent);
    border-radius: 50%;
    background: linear-gradient(162deg, color-mix(in srgb, var(--accent) 30%, #0a1017) 0%, #0a2735 60%, #06161f 100%);
    box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 24%, transparent), 0 2px 5px rgba(0, 0, 0, .6);
    transition: border-radius var(--move), box-shadow .3s ease, transform .2s ease;
  }
  .tok.dot .face:hover { transform: scale(1.06); }
  .tok.peeked .face { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 45%, transparent), 0 0 34px var(--accent); }
  .tok.centre .face {
    border-width: 3px;
    box-shadow: 0 0 0 6px rgba(85, 228, 209, .16), 0 0 46px rgba(85, 228, 209, .45), 0 3px 8px rgba(0, 0, 0, .6);
  }
  .face img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0; transition: opacity .4s ease;
  }
  .tok.has-photo .face img { opacity: 1; }
  .init {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: color-mix(in srgb, var(--accent) 80%, white);
    font: 700 20px/1 "Manrope", sans-serif; letter-spacing: .02em;
  }
  .tok.has-photo .init { display: none; }
  .tok.centre .init { font-size: 34px; }
  .cap {
    position: absolute; left: 50%; top: 100%;
    width: var(--capw, 150px); margin-top: 5px; transform: translateX(-50%);
    text-align: center; pointer-events: none;
  }
  .cap strong {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    font: 600 12.5px/1.25 "Manrope", sans-serif;
    text-shadow: 0 1px 8px #000, 0 0 14px #000;
  }
  .cap small { display: none; }
  .tok.centre .cap strong { font-size: 16px; }

  .q {
    position: absolute; left: 0; top: 0;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 0 2px 5px; text-align: center;
    color: color-mix(in srgb, var(--accent) 72%, white);
    font: 700 11.5px/1.2 "DM Sans", sans-serif;
    text-shadow: 0 1px 8px #000, 0 0 14px #000;
    pointer-events: none;
  }
  .more {
    position: absolute; left: 0; top: 0; z-index: 2;
    min-width: 30px; height: 24px; padding: 0 7px;
    border: 1px solid color-mix(in srgb, var(--accent) 70%, transparent); border-radius: 99px;
    background: #0a1c26; color: var(--ink);
    font: 700 11px/1 "DM Sans", sans-serif;
  }
  /* A bigger finger target than the chip looks. */
  .more::before { content: ""; position: absolute; inset: -10px; }

  .panel {
    grid-column: 2; grid-row: 1 / -1;
    z-index: 4;
    display: flex; flex-direction: column; min-height: 0;
    border-left: 1px solid var(--line);
    background: var(--glass-strong);
  }
  .panel-grip { display: none; }
  .panel-body { flex: 1; min-height: 0; overflow: auto; padding: 18px 20px 22px; }
  .panel-kicker { margin: 0 0 8px; color: var(--ink-dim); font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  .panel h2 { margin: 0 0 8px; font: 700 23px/1.15 "Manrope", sans-serif; letter-spacing: -.02em; }
  .panel p { margin: 0 0 12px; color: var(--ink-soft); }
  .panel .lead { color: var(--ink); font-size: 15.5px; line-height: 1.45; }
  .shot {
    position: relative; margin: 0 0 14px; aspect-ratio: 16 / 10; overflow: hidden;
    border: 1px solid var(--line); border-radius: 12px; background: #0a2735;
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot figcaption {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 10px 6px;
    background: linear-gradient(180deg, transparent, rgba(4, 12, 18, .92) 55%);
    color: var(--ink); font-size: 10.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .shot a { color: inherit; }
  .why {
    margin: 0 0 14px; padding: 10px 12px;
    border-left: 3px solid var(--accent, var(--aqua)); border-radius: 0 10px 10px 0;
    background: rgba(255, 255, 255, .05);
  }
  .why b { display: block; margin-bottom: 2px; color: color-mix(in srgb, var(--accent, var(--aqua)) 72%, white); font-size: 12px; }
  .fact { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
  .fact b { display: block; color: var(--gold); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 16px; }
  .btn {
    min-height: 44px; padding: 0 18px;
    border: 1px solid var(--line-strong); border-radius: 99px; background: rgba(255, 255, 255, .05);
    font-weight: 600;
  }
  .btn.go { border-color: transparent; background: var(--aqua); color: #04222a; }
  .rows { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .rows button {
    display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 11px; align-items: center;
    width: 100%; min-height: 54px; padding: 7px 10px;
    border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, .03); text-align: left;
  }
  .rows button:hover { border-color: var(--line-strong); }
  .rows .disc {
    display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid color-mix(in srgb, var(--accent, var(--aqua)) 60%, transparent);
    color: color-mix(in srgb, var(--accent, var(--aqua)) 80%, white); font: 700 13px/1 "Manrope", sans-serif;
  }
  .rows strong { display: block; font-weight: 600; }
  .rows small { display: block; color: var(--ink-dim); font-size: 12px; line-height: 1.3; }
  .sources { margin: 14px 0 0; padding: 0; list-style: none; font-size: 12px; }
  .sources a { color: var(--ink-soft); }
  .hint { color: var(--ink-dim); font-size: 12px; }
  .close { display: none; }

  @media (max-width: 1040px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .panel {
      position: absolute; left: 0; right: 0; bottom: 0; grid-column: auto; grid-row: auto;
      background: #0a1922;
      max-height: 68%; border: 1px solid var(--line-strong); border-bottom: 0; border-radius: 18px 18px 0 0;
      box-shadow: 0 -22px 70px rgba(0, 0, 0, .55);
      transform: translateY(105%); transition: transform .35s cubic-bezier(.22, .8, .24, 1);
    }
    .panel.open { transform: none; }
    .panel-grip { display: block; flex: none; width: 44px; height: 4px; margin: 9px auto 0; border-radius: 9px; background: var(--line-strong); }
    .panel-body { padding: 12px 16px calc(18px + env(safe-area-inset-bottom)); }
    .close {
      display: grid; place-items: center; position: absolute; right: 8px; top: 8px;
      width: 44px; height: 44px; border: 0; border-radius: 50%; background: none; color: var(--ink-soft); font-size: 22px;
      /* Above the card body: its scroll fade (a mask) makes it a layer of its own. */
      z-index: 2;
    }
    .shot { aspect-ratio: 16 / 8; }
  }
  .panel-body.more-below { -webkit-mask-image: linear-gradient(#000 calc(100% - 44px), transparent); mask-image: linear-gradient(#000 calc(100% - 44px), transparent); }
  .tap-hint { display: none; }
  @media (max-width: 680px) {
    /* A low, compact sheet: the globe above stays free to tap. */
    .panel { max-height: 31%; }
    /* Choosing from a list needs the room more than the globe does. */
    .panel.tall { max-height: 62%; }
    .panel-body { padding: 8px 16px calc(12px + env(safe-area-inset-bottom)); }
    .panel-kicker { margin: 0 44px 6px 0; font-size: 9.5px; }
    .shot { float: left; width: 76px; aspect-ratio: 1; margin: 0 12px 6px 0; border-radius: 10px; }
    .shot figcaption { display: none; }
    .panel h2 { font-size: 18px; margin-bottom: 3px; }
    .panel .lead { font-size: 13.5px; line-height: 1.35; margin-bottom: 8px; }
    .why { clear: both; margin-bottom: 8px; padding: 7px 10px; font-size: 13px; }
    .actions .go { display: none; }
    .tap-hint { display: block; clear: both; margin: 0 0 6px; }
    .actions { margin: 0 0 8px; }
    .actions .btn { min-height: 40px; }
  }
  @media (max-width: 680px) {
    .app { grid-template-rows: 54px 34px minmax(0, 1fr); }
    .top { padding: 0 16px; gap: 8px; }
    .brand { display: none; }
    .pill { padding: 0 11px; }
    .pill .wide { display: none; }
    /* The home pill gives way first (its name shortens); the search box keeps
       room for its words. */
    #home { flex: 0 1 auto; min-width: 0; }
    #home-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    #home-steps { flex: none; }
    .search { flex: 1 0 128px; max-width: none; }
    /* 16px stops iPhone Safari zooming the whole page in when the box is tapped. */
    .search input { font-size: 16px; padding: 0 12px; }
    /* Suggestions use the full width and hide the globe's labels behind them. */
    .results { position: fixed; left: 12px; right: 12px; top: 50px; max-height: 60vh; background: #0a1922; }
    .trail button { max-width: 104px; }
    .q { font-size: 10.5px; }
    .cap strong { font-size: 11.5px; }
    .tok.centre .cap strong { font-size: 14px; }
    .tok.centre .init { font-size: 26px; }
    .init { font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --move: 0s; }
    .tok, .panel { transition: none; }
  }
</style>
</head>
<body>
<div class="app">
  <canvas id="globe" aria-hidden="true"></canvas>

  <header class="top">
    <div class="brand">Knowledge Globe<small>Explore preview</small></div>
    <button class="pill" id="home" type="button" aria-label="Back to my topic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span id="home-name">Home</span><small id="home-steps"></small>
    </button>
    <div class="search">
      <input id="search" type="search" placeholder="Find a point…" autocomplete="off" aria-label="Find a point">
      <div class="results" id="results"></div>
    </div>
    <a class="pill" href="./" aria-label="Back to the globe viewer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.500 0 18M12 3c-3 3.500-3 14.500 0 18"/></svg>
      <span class="wide">Globe</span>
    </a>
  </header>

  <nav class="trail" id="trail" aria-label="The way you came"></nav>

  <main id="stage">
    <svg id="links" aria-hidden="true"></svg>
  </main>

  <aside class="panel" id="panel" aria-live="polite">
    <span class="panel-grip"></span>
    <button class="close" id="close" type="button" aria-label="Close">×</button>
    <div class="panel-body" id="panel-body"></div>
  </aside>
</div>

<script type="module">
import * as THREE from "./static/vendor/three.module.min.js";

// The nine link kinds. Each is one question from each end; `out` is asked on
// the link's `from` point and `back` on its `to` point (see app/graph.py).
const KIND_COLOR = {
  time: "#bd86ff", inside: "#55e4d1", place: "#38bdf8", need: "#64a8ff", effect: "#ff8b62",
  like: "#a9bcc6", kind: "#ffd57a", who: "#ffad5d", happened: "#65e696",
};
// Every question has a fixed home. Up = bigger things, down = smaller things,
// left = what comes before or feeds it, right = what follows from it.
const HOMES = [
  { key: "place.out", side: "up" },
  { key: "inside.back", side: "up" },
  { key: "kind.out", side: "up" },
  { key: "time.back", side: "left" },
  { key: "need.out", side: "left" },
  { key: "effect.back", side: "left" },
  { key: "who.out", side: "left" },
  { key: "happened.back", side: "left" },
  { key: "time.out", side: "right" },
  { key: "need.back", side: "right" },
  { key: "effect.out", side: "right" },
  { key: "who.back", side: "right" },
  { key: "happened.out", side: "right" },
  { key: "place.back", side: "down" },
  { key: "inside.out", side: "down" },
  { key: "kind.back", side: "down" },
  { key: "like.out", side: "down" },
];
// Earth view: the centre and its answers are pins on the globe's surface.
// Each side of the centre owns a stretch of one ring around it; `turn` is the
// direction the side's homes are listed in (-1 = clockwise on screen).
const SIDES = {
  up: { axis: 90, turn: -1 },
  right: { axis: 0, turn: -1 },
  down: { axis: 270, turn: 1 },
  left: { axis: 180, turn: 1 },
};
const RING = 54;        // degrees from the centre pin to the ring of answers

const $ = (id) => document.getElementById(id);
const stage = $("stage");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

const state = {
  kinds: {},
  points: new Map(),
  answers: new Map(), // point id → Map(question key → [{ id, why, mark }])
  starts: [],
  centre: null,
  cameFrom: null,
  home: null,
  trail: [],
  peek: null,        // { id, key } or { list: key }
  blocks: [],        // one per question on the ring: label, chip, line
  spots: new Map(),  // point id → its spot on the globe, once it has been the centre
  restQ: null,       // the globe's resting turn for the current centre
  lastTouch: performance.now(),
  spin: 0,           // 0..1, the resting spin easing in
  spun: false,       // the globe has spun off its resting turn
};
const toks = new Map(); // slot ("centre" or a question key) → element
const pins = new Set(); // every pin element still on the stage, leaving ones too
const IDLE_MS = 7000;   // quiet time on the home point before the globe starts its resting spin
const SPIN = .055;      // radians a second: the old viewer's resting spin

/* ---------- data ---------- */

async function boot() {
  const response = await fetch("./api/graph");
  if (!response.ok) throw new Error("Could not load the graph");
  const graph = await response.json();
  state.kinds = graph.kinds;
  state.starts = graph.starts;
  for (const point of graph.points) {
    state.points.set(point.id, point);
    state.answers.set(point.id, new Map());
  }
  const put = (owner, key, other, link) => {
    const map = state.answers.get(owner);
    if (!map.has(key)) map.set(key, []);
    if (!map.get(key).some((a) => a.id === other)) map.get(key).push({ id: other, why: link.why, mark: link.mark });
  };
  for (const link of graph.links) {
    if (link.kind === "like") {
      put(link.from, "like.out", link.to, link);
      put(link.to, "like.out", link.from, link);
    } else {
      put(link.from, `${link.kind}.out`, link.to, link);
      put(link.to, `${link.kind}.back`, link.from, link);
    }
  }
  initGlobe();
  bindUI();
  const wanted = decodeURIComponent(location.hash.slice(1));
  const first = state.points.has(wanted) ? wanted : state.starts[0];
  state.home = first;
  go(first, { fresh: true });
}

function question(key) {
  const [kind, end] = key.split(".");
  return state.kinds[kind][end];
}
function kindOf(key) { return key.split(".")[0]; }
function initials(name) {
  const words = name.replace(/[^\p{L}\p{N} ]/gu, " ").split(/\s+/).filter(Boolean);
  return (words.length > 1 ? words[0][0] + words[1][0] : name.slice(0, 2)).toUpperCase();
}

/* ---------- pictures: pinned on the point, else one Commons search ---------- */

const visuals = new Map();
let running = 0;
const waiting = [];
function queued(task) {
  return new Promise((resolve) => {
    const run = async () => {
      running += 1;
      try { resolve(await task()); } catch { resolve(null); }
      running -= 1;
      waiting.shift()?.();
    };
    if (running < 4) run(); else waiting.push(run);
  });
}
function plain(value) {
  const box = document.createElement("div");
  box.innerHTML = value || "";
  return box.textContent.trim();
}
function visualFor(point) {
  if (point.visual?.src) return Promise.resolve(point.visual);
  if (visuals.has(point.id)) return visuals.get(point.id);
  const task = queued(async () => {
    try {
      const saved = sessionStorage.getItem(`kg-visual:${point.id}`);
      if (saved) return JSON.parse(saved);
    } catch { /* storage may be unavailable; search instead */ }
    const params = new URLSearchParams({
      action: "query", generator: "search", gsrsearch: `${point.visual_query || point.name} filetype:bitmap`,
      gsrnamespace: "6", gsrlimit: "3", gsrsort: "relevance", prop: "imageinfo",
      iiprop: "url|extmetadata", iiurlwidth: "640", format: "json", origin: "*",
    });
    const response = await fetch(`https://commons.wikimedia.org/w/api.php?${params}`);
    if (!response.ok) return null;
    const payload = await response.json();
    const pages = Object.values(payload.query?.pages || {}).sort((a, b) => (a.index || 99) - (b.index || 99));
    const page = pages.find((item) => item.imageinfo?.[0]?.thumburl);
    if (!page) return null;
    const info = page.imageinfo[0];
    const meta = info.extmetadata || {};
    const visual = {
      src: info.thumburl,
      page: info.descriptionurl,
      credit: (plain(meta.Artist?.value) || "Wikimedia Commons contributor").slice(0, 48),
      licence: plain(meta.LicenseShortName?.value) || "see source",
    };
    try { sessionStorage.setItem(`kg-visual:${point.id}`, JSON.stringify(visual)); } catch { /* fine */ }
    return visual;
  });
  visuals.set(point.id, task);
  return task;
}

/* ---------- the centre and its ring ---------- */

function go(id, { fresh = false, back = false } = {}) {
  if (!state.points.has(id)) return;
  const from = state.centre;
  if (id === from && !fresh) return showCard(id);
  // The new centre stays where it sits on the globe: the pin just tapped keeps
  // its own spot, a point met before goes back to its spot, a new one gets one.
  const pin = [...toks.values()].find((el) => el.dataset.id === id);
  const spot = pin?.anchor?.clone() || state.spots.get(id) || homeSpot(id);
  state.spots.set(id, spot);
  state.cameFrom = from;
  state.centre = id;
  if (!back) {
    const at = state.trail.indexOf(id);
    if (at >= 0) state.trail.length = at;
    state.trail.push(id);
  }
  state.peek = null;
  history.replaceState(null, "", `#${encodeURIComponent(id)}`);
  turnGlobe(spot, fresh);
  drawTrail();
  layout();
  // The card always comes with the point, on a phone too: at rest, after a
  // double-tap, after a search or a trail step.
  showCard(id);
}

// Which answer shows as the dot at a home. The point just left is put first,
// so the way back is always in view.
function headline(list) {
  return list.find((a) => a.id === state.cameFrom) || list[0];
}

function makeTok(point) {
  const el = document.createElement("div");
  el.className = "tok";
  el.dataset.id = point.id;
  el.innerHTML = `<span class="base"></span><button class="face" type="button"><span class="init"></span><img alt="" decoding="async" referrerpolicy="no-referrer"></button>
    <span class="cap"><strong></strong><small></small></span>`;
  el.querySelector(".init").textContent = initials(point.name);
  el.querySelector(".cap strong").textContent = point.name;
  el.querySelector(".cap small").textContent = point.line || "";
  el.querySelector(".face").addEventListener("click", () => {
    if (el.dataset.slot === "centre") showCard(point.id);
    else peekAt(point.id, el.dataset.slot);
  });
  el.querySelector(".face").addEventListener("dblclick", () => {
    if (el.dataset.slot === "centre") return;
    go(point.id);
  });
  const img = el.querySelector("img");
  visualFor(point).then((visual) => {
    if (!visual) return;
    img.addEventListener("load", () => el.classList.add("has-photo"), { once: true });
    img.src = visual.src;
  });
  el.style.opacity = "0";
  stage.append(el);
  pins.add(el);
  return el;
}

// A spot on the globe, `far` degrees from the front in the screen direction
// `az` (0 = right, 90 = up), with the globe at rest on the centre.
function frontVec(az, far) {
  const a = THREE.MathUtils.degToRad(az);
  const f = THREE.MathUtils.degToRad(far);
  return new THREE.Vector3(Math.sin(f) * Math.cos(a), Math.sin(f) * Math.sin(a), Math.cos(f));
}

// Neighbours on the ring are eased apart until no question label sits on
// another pin's name or picture (measured at rest, on the screen).
const meter = document.createElement("canvas").getContext("2d");
function textBox(text, font, max, lineH) {
  meter.font = font;
  const w = meter.measureText(text).width;
  const lines = Math.min(2, Math.ceil(w / max));
  return { w: Math.min(w, max), h: lines * lineH };
}
function restScreen(v) {
  if (!renderer) {
    const frame = globeFrame();
    return { x: frame.x + frame.r * v.x, y: frame.y - frame.r * v.y };
  }
  scratch.copy(v).add(world.position).project(camera);
  return { x: (scratch.x + 1) / 2 * view.w + view.x, y: (1 - scratch.y) / 2 * view.h + view.y };
}
function ease(spots, { phone, D, blockW, answers }) {
  if (spots.length < 2) return;
  const W = stage.clientWidth;
  for (const spot of spots) {
    const name = state.points.get(headline(answers.get(spot.home.key)).id).name;
    spot.q = textBox(question(spot.home.key), `700 ${phone ? 10.5 : 11.5}px "DM Sans"`, blockW - 4, phone ? 13 : 14);
    spot.cap = textBox(name, `600 ${phone ? 11.5 : 12.5}px Manrope`, blockW, phone ? 14.5 : 16);
  }
  const boxes = (spot) => {
    const at = restScreen(frontVec(spot.az, RING));
    const qx = clamp(at.x, blockW / 2 + 4, W - blockW / 2 - 4);
    return [
      { x0: qx - spot.q.w / 2, x1: qx + spot.q.w / 2, y0: at.y - D / 2 - 5 - spot.q.h, y1: at.y - D / 2 - 3 },
      { x0: at.x - D / 2, x1: at.x + D / 2, y0: at.y - D / 2, y1: at.y + D / 2 },
      { x0: at.x - spot.cap.w / 2, x1: at.x + spot.cap.w / 2, y0: at.y + D / 2 + 4, y1: at.y + D / 2 + 6 + spot.cap.h },
    ];
  };
  const pad = 4; // breathing room between one pin's words and the next
  const hit = (a, b) => a.some((p) => b.some((q) => p.x0 < q.x1 + pad && q.x0 < p.x1 + pad && p.y0 < q.y1 + pad && q.y0 < p.y1 + pad));
  for (let pass = 0; pass < 60; pass += 1) {
    let moved = false;
    for (let i = 0; i < spots.length; i += 1) {
      const a = spots[i];
      const b = spots[(i + 1) % spots.length];
      if (a === b || !hit(boxes(a), boxes(b))) continue;
      a.az -= 1.5;
      b.az += 1.5;
      moved = true;
    }
    if (!moved) break;
  }
}

// Works out every pin's spot ON the globe (in the globe's own frame), its
// size and its label. Where it shows on the screen is worked out every frame
// by place(), so a pin rides the globe wherever the globe turns.
function layout() {
  const W = stage.clientWidth;
  const H = stage.clientHeight;
  if (!W || !H || !state.centre || !state.restQ) return;
  const phone = W <= 680;
  const answers = state.answers.get(state.centre);
  const shown = HOMES.filter((home) => answers.has(home.key));

  const R = globeFrame().r;
  const cd = clamp(R * (phone ? .46 : .42), 80, 190);
  const D = clamp(R * (phone ? .27 : .22), 44, 84);
  const blockW = phone ? 104 : 168;
  const gap = phone ? 42 : 32; // degrees between neighbours on the ring

  // Each home's own direction first, then neighbours are eased apart until
  // their labels have room. The order around the centre never changes.
  const spots = [];
  for (const [side, { axis, turn: way }] of Object.entries(SIDES)) {
    const homes = shown.filter((home) => home.side === side);
    const step = homes.length > 1 ? Math.min(gap, 84 / (homes.length - 1)) : 0;
    homes.forEach((home, i) => {
      spots.push({ home, az: (axis + way * (i - (homes.length - 1) / 2) * step + 360) % 360 });
    });
  }
  spots.sort((a, b) => a.az - b.az);
  const room = Math.min(gap, 360 / Math.max(1, spots.length));
  for (let pass = 0; pass < 40 && spots.length > 1; pass += 1) {
    for (let i = 0; i < spots.length; i += 1) {
      const a = spots[i];
      const b = spots[(i + 1) % spots.length];
      const apart = (b.az - a.az + 360) % 360 || 360;
      if (apart < room) {
        a.az -= (room - apart) / 2;
        b.az += (room - apart) / 2;
      }
    }
  }

  ease(spots, { phone, D, blockW, labelH: phone ? 28 : 32, answers });

  const now = performance.now();
  // New pins wait until the globe has nearly finished turning to the centre.
  const delay = turn ? turn.duration * .55 : 0;
  const toGlobe = state.restQ.clone().invert();
  const want = [{ slot: "centre", id: state.centre, size: cd, anchor: state.spots.get(state.centre), restFace: 1 }];
  const blocks = [];
  for (const { home, az } of spots) {
    const list = answers.get(home.key);
    const answer = headline(list);
    const block = { slot: home.key, count: list.length, width: blockW, born: now + delay };
    blocks.push(block);
    want.push({
      slot: home.key, id: answer.id, width: blockW, size: D,
      anchor: frontVec(az, RING).applyQuaternion(toGlobe), restFace: Math.cos(THREE.MathUtils.degToRad(RING)),
    });
  }

  // Reuse the pin already showing a point: it slides along the surface to its
  // new spot while the globe turns, instead of popping out and back in.
  const spare = [...toks.values()];
  toks.clear();
  for (const item of want) {
    const at = spare.findIndex((el) => el.dataset.id === item.id);
    const el = at >= 0 ? spare.splice(at, 1)[0] : makeTok(state.points.get(item.id));
    if (!el.anchor) {
      el.anchor = item.anchor.clone();
      el.born = now + delay;
    } else if (turn) {
      el.slide = { from: el.anchor.clone(), to: item.anchor.clone(), started: turn.started, duration: turn.duration };
    } else {
      el.anchor = item.anchor.clone();
      el.slide = null;
    }
    const isCentre = item.slot === "centre";
    el.dataset.slot = item.slot;
    el.restFace = item.restFace;
    el.classList.toggle("centre", isCentre);
    el.classList.toggle("dot", !isCentre);
    el.classList.remove("peeked");
    el.style.zIndex = isCentre ? "1" : "2";
    el.style.width = `${item.size}px`;
    el.style.height = `${item.size}px`;
    el.size = item.size;
    el.style.setProperty("--capw", `${item.width || 190}px`);
    el.style.setProperty("--accent", isCentre ? "#55e4d1" : KIND_COLOR[kindOf(item.slot)]);
    const point = state.points.get(item.id);
    el.querySelector(".face").setAttribute("aria-label", isCentre ? `${point.name}. Open its card.` : `${question(item.slot)} ${point.name}`);
    toks.set(item.slot, el);
  }
  for (const el of spare) {
    el.dying = now;
    el.dataset.slot = "";
    el.style.zIndex = "0";
  }

  // Question labels, "+N" chips and the link lines are rebuilt, then ride
  // their pin every frame like the pin does.
  for (const block of state.blocks) {
    block.label.remove();
    block.more?.remove();
  }
  const svg = $("links");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.replaceChildren();
  const labelH = phone ? 28 : 32;
  for (const block of blocks) {
    const color = KIND_COLOR[kindOf(block.slot)];
    block.labelH = labelH;
    block.label = node("div", "q", question(block.slot));
    block.label.style.setProperty("--accent", color);
    Object.assign(block.label.style, { width: `${block.width}px`, height: `${labelH}px`, opacity: "0" });
    stage.append(block.label);
    if (block.count > 1) {
      block.more = node("button", "more", `+${block.count - 1}`);
      block.more.type = "button";
      block.more.style.setProperty("--accent", color);
      block.more.style.opacity = "0";
      block.more.setAttribute("aria-label", `${question(block.slot)} ${block.count} answers. Show all.`);
      block.more.addEventListener("click", () => showList(block.slot));
      stage.append(block.more);
    }
    block.line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    block.line.setAttribute("stroke", color);
    block.line.setAttribute("stroke-width", "1.5");
    block.line.setAttribute("stroke-dasharray", "2 5");
    block.line.setAttribute("stroke-linecap", "round");
    block.line.setAttribute("stroke-opacity", "0");
    svg.append(block.line);
  }
  state.blocks = blocks;
  place(now);
}
/* ---------- the card: peek before go ---------- */

function openPanel() {
  $("panel").classList.add("open");
  if (!state.peek?.list) $("panel").classList.remove("tall");
  requestAnimationFrame(moreBelow);
}
// A fade at the sheet's foot while there is more to scroll.
function moreBelow() {
  const body = $("panel-body");
  body.classList.toggle("more-below", body.scrollHeight - body.scrollTop - body.clientHeight > 6);
}
function closePanel() {
  $("panel").classList.remove("open");
  for (const el of toks.values()) el.classList.remove("peeked");
  state.peek = null;
}

function node(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined) el.textContent = text;
  return el;
}

function cardInto(body, point) {
  const figure = node("figure", "shot");
  figure.hidden = true;
  const img = node("img");
  img.alt = `Photograph of ${point.name}`;
  img.referrerPolicy = "no-referrer";
  const credit = node("figcaption");
  figure.append(img, credit);
  body.append(figure);
  visualFor(point).then((visual) => {
    if (!visual || !figure.isConnected) return;
    img.addEventListener("load", () => { figure.hidden = false; }, { once: true });
    img.src = visual.src;
    credit.append(`Photo: ${visual.credit || visual.artist || "source contributor"} · `);
    const link = node("a", "", visual.licence || "source");
    link.href = visual.page;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    credit.append(link);
  });
  body.append(node("h2", "", point.name));
  if (point.line) body.append(node("p", "lead", point.line));
  if (point.stub) body.append(node("p", "hint", "Only a name so far. This point is waiting for its own answers."));
}

function showCard(id) {
  const point = state.points.get(id);
  const body = $("panel-body");
  body.replaceChildren(node("p", "panel-kicker", "What is it?"));
  cardInto(body, point);
  if (point.fact) {
    const fact = node("p", "fact");
    fact.append(node("b", "", "Did you know"), point.fact);
    body.append(fact);
  }
  if (point.more) body.append(node("p", "", point.more));
  const actions = node("div", "actions");
  if (state.home !== id) {
    const pin = node("button", "btn", "Make this my topic");
    pin.type = "button";
    pin.addEventListener("click", () => {
      state.home = id;
      state.trail = [id];
      drawTrail();
      showCard(id);
    });
    actions.append(pin);
  }
  if (actions.children.length) body.append(actions);
  if (point.sources?.length) {
    const list = node("ul", "sources");
    for (const source of point.sources) {
      const item = node("li");
      const link = node("a", "", source.title);
      link.href = source.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      item.append("Source: ", link);
      list.append(item);
    }
    body.append(list);
  }
  body.scrollTop = 0;
  for (const el of toks.values()) el.classList.remove("peeked");
  state.peek = null;
  openPanel();
}

function peekAt(id, key) {
  const point = state.points.get(id);
  const centre = state.points.get(state.centre);
  const answer = state.answers.get(state.centre).get(key)?.find((a) => a.id === id);
  const color = KIND_COLOR[kindOf(key)];
  const body = $("panel-body");
  body.replaceChildren(node("p", "panel-kicker", `${centre.name} · ${question(key)}`));
  cardInto(body, point);
  if (answer?.why) {
    const why = node("p", "why");
    why.style.setProperty("--accent", color);
    const mark = answer.mark === "helps" ? "It helps, because" : answer.mark === "harms" ? "It harms, because" : "Because";
    why.append(node("b", "", mark), answer.why);
    body.append(why);
  }
  const actions = node("div", "actions");
  body.append(node("p", "hint tap-hint", "Double-tap the pin to go there."));
  const goBtn = node("button", "btn go", "Go there");
  goBtn.type = "button";
  goBtn.addEventListener("click", () => go(id));
  actions.append(goBtn);
  const list = state.answers.get(state.centre).get(key) || [];
  if (list.length > 1) {
    const all = node("button", "btn", `All ${list.length} answers`);
    all.type = "button";
    all.addEventListener("click", () => showList(key));
    actions.append(all);
  }
  body.append(actions);
  if (point.fact) {
    const fact = node("p", "fact");
    fact.append(node("b", "", "Did you know"), point.fact);
    body.append(fact);
  }
  body.scrollTop = 0;
  for (const [slot, el] of toks) el.classList.toggle("peeked", slot === key && el.dataset.id === id);
  state.peek = { id, key };
  openPanel();
}

function showList(key) {
  const centre = state.points.get(state.centre);
  const list = state.answers.get(state.centre).get(key) || [];
  const color = KIND_COLOR[kindOf(key)];
  const body = $("panel-body");
  body.replaceChildren(
    node("p", "panel-kicker", centre.name),
    node("h2", "", question(key)),
    node("p", "hint", `${list.length} answers. Tap one to look at it without leaving ${centre.name}.`),
  );
  const rows = node("ul", "rows");
  for (const answer of list) {
    const point = state.points.get(answer.id);
    const item = node("li");
    const button = node("button");
    button.type = "button";
    const disc = node("span", "disc", initials(point.name));
    disc.style.setProperty("--accent", color);
    const text = node("span");
    text.append(node("strong", "", point.name));
    if (answer.why || point.line) text.append(node("small", "", answer.why || point.line));
    button.append(disc, text);
    button.addEventListener("click", () => peekAt(answer.id, key));
    item.append(button);
    rows.append(item);
  }
  body.append(rows);
  body.scrollTop = 0;
  $("panel").classList.add("tall");
  for (const el of toks.values()) el.classList.remove("peeked");
  state.peek = { list: key };
  openPanel();
}

/* ---------- trail, home, search ---------- */

function drawTrail() {
  const box = $("trail");
  const room = stage.clientWidth <= 680 ? 3 : 7;
  const cut = Math.max(0, state.trail.length - room);
  const parts = [];
  if (cut) parts.push(node("i", "", "…"));
  state.trail.slice(cut).forEach((id, i) => {
    if (i || cut) parts.push(node("i", "", "›"));
    const button = node("button", id === state.centre ? "here" : "", state.points.get(id).name);
    button.type = "button";
    button.addEventListener("click", () => go(id));
    parts.push(button);
  });
  box.replaceChildren(...parts);
  const steps = state.trail.length - 1;
  const atHome = state.centre === state.home;
  $("home-name").textContent = state.points.get(state.home).name;
  const away = room === 3 ? "" : " away"; // phones: the trail below already shows the way back
  $("home-steps").textContent = atHome ? "" : `${steps} step${steps === 1 ? "" : "s"}${away}`;
  $("home").setAttribute("aria-label", `Back to my topic, ${state.points.get(state.home).name}`);
}

function drawResults(term) {
  const box = $("results");
  const text = term.trim().toLowerCase();
  let title = "Good places to start";
  let ids = state.starts;
  if (text) {
    title = "Points";
    ids = [...state.points.values()]
      .filter((point) => point.name.toLowerCase().includes(text))
      .sort((a, b) => a.name.toLowerCase().indexOf(text) - b.name.toLowerCase().indexOf(text) || a.name.localeCompare(b.name))
      .slice(0, 12)
      .map((point) => point.id);
  }
  const parts = [node("h4", "", ids.length ? title : "Nothing by that name yet")];
  for (const id of ids) {
    const point = state.points.get(id);
    const button = node("button");
    button.type = "button";
    button.append(point.name);
    if (point.line) button.append(node("small", "", point.line));
    button.addEventListener("click", () => {
      $("search").value = "";
      box.classList.remove("open");
      closePanel();
      go(id);
    });
    parts.push(button);
  }
  box.replaceChildren(...parts);
  box.classList.add("open");
}

function bindUI() {
  $("home").addEventListener("click", () => { closePanel(); go(state.home); });
  $("close").addEventListener("click", closePanel);
  $("panel-body").addEventListener("scroll", moreBelow, { passive: true });
  const search = $("search");
  search.addEventListener("focus", () => drawResults(search.value));
  search.addEventListener("input", () => drawResults(search.value));
  document.addEventListener("pointerdown", (event) => {
    if (!event.target.closest(".search")) $("results").classList.remove("open");
  });
  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape") return;
    if ($("results").classList.contains("open")) $("results").classList.remove("open");
    else closePanel();
  });
  for (const type of ["pointerdown", "keydown", "wheel", "focusin"]) {
    document.addEventListener(type, touched, { capture: true, passive: true });
  }
  new ResizeObserver(() => { resizeGlobe(); drawTrail(); layout(); }).observe(stage);
  // Size the app to the part of the screen the browser really shows, so a
  // phone browser's own toolbar never sits over the card (iOS Chrome does).
  const fit = () => {
    const vv = window.visualViewport;
    if (vv && Math.abs(vv.scale - 1) > .01) return;
    document.documentElement.style.setProperty("--app-h", `${Math.round(vv ? vv.height : innerHeight)}px`);
  };
  fit();
  window.visualViewport?.addEventListener("resize", fit);
  addEventListener("resize", fit);
}

/* ---------- the globe behind: same look as the viewer's door mode ---------- */

let scene, camera, renderer, world, globeGroup, planet, starfield;
let turn = null;
const globeQ = new THREE.Quaternion(); // the globe's turn; pins are placed from it every frame
let lastFrame = performance.now();
const FOV = 37;

function texture() {
  const canvas = document.createElement("canvas");
  canvas.width = 1024;
  canvas.height = 512;
  const ctx = canvas.getContext("2d");
  const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
  gradient.addColorStop(0, "#0b536e");
  gradient.addColorStop(.45, "#06374e");
  gradient.addColorStop(1, "#031a2a");
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.globalAlpha = .13;
  ctx.strokeStyle = "#bffcff";
  ctx.lineWidth = 2;
  for (let y = 28; y < 330; y += 32) {
    ctx.beginPath();
    for (let x = -30; x <= canvas.width + 30; x += 18) {
      const wave = y + Math.sin(x * .024 + y * .033) * 13;
      if (x === -30) ctx.moveTo(x, wave); else ctx.lineTo(x, wave);
    }
    ctx.stroke();
  }
  const map = new THREE.CanvasTexture(canvas);
  map.colorSpace = THREE.SRGBColorSpace;
  map.wrapS = THREE.RepeatWrapping;
  return map;
}

function initGlobe() {
  try {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(FOV, 1, .1, 100);
    renderer = new THREE.WebGLRenderer({ canvas: $("globe"), antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    world = new THREE.Group();
    scene.add(world);
    globeGroup = new THREE.Group();
    world.add(globeGroup);
    planet = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 96), new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uDeep: { value: new THREE.Color("#052f46") },
        uShallow: { value: new THREE.Color("#0b7f8e") },
        uGlow: { value: new THREE.Color("#55e4d1") },
        uThemeMap: { value: texture() },
      },
      vertexShader: `
        varying vec3 vNormal;
        varying vec2 vUv;
        void main() {
          vUv = uv;
          vNormal = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec3 uDeep;
        uniform vec3 uShallow;
        uniform vec3 uGlow;
        uniform sampler2D uThemeMap;
        varying vec3 vNormal;
        varying vec2 vUv;
        float lines(float value, float count, float width) {
          float wave = abs(sin(value * 3.14159265 * count));
          return 1.0 - smoothstep(0.0, width, wave);
        }
        void main() {
          vec3 lightDir = normalize(vec3(-0.7, 0.65, 1.1));
          float light = max(dot(vNormal, lightDir), 0.0);
          float fresnel = pow(1.0 - max(dot(vNormal, vec3(0.0, 0.0, 1.0)), 0.0), 2.5);
          float current = sin(vUv.y * 50.0 + sin(vUv.x * 19.0 + uTime * .28) * 2.2) * .5 + .5;
          float grid = max(lines(vUv.x, 18.0, .055), lines(vUv.y, 9.0, .055)) * .09;
          vec3 theme = texture2D(uThemeMap, vec2(fract(vUv.x + uTime * .0015), vUv.y)).rgb;
          vec3 color = mix(uDeep, uShallow, light * .72 + current * .09);
          color = mix(color, theme, .48);
          color += uGlow * (fresnel * .25 + grid);
          color *= .44 + light * .76;
          gl_FragColor = vec4(color, 1.0);
        }
      `,
    }));
    globeGroup.add(planet);
    globeGroup.add(new THREE.Mesh(
      new THREE.SphereGeometry(1.006, 36, 18),
      new THREE.MeshBasicMaterial({ color: "#8cece0", transparent: true, opacity: .045, wireframe: true }),
    ));
    world.add(new THREE.Mesh(
      new THREE.SphereGeometry(1.09, 64, 64),
      new THREE.ShaderMaterial({
        transparent: true, side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false,
        vertexShader: `
          varying vec3 vNormal;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vNormal;
          void main() {
            float intensity = pow(0.72 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 3.0);
            gl_FragColor = vec4(0.22, 0.87, 0.86, 1.0) * intensity * .6;
          }
        `,
      }),
    ));
    const count = 950;
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count; i += 1) {
      const radius = 9 + Math.random() * 20;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = radius * Math.cos(phi);
      positions[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    starfield = new THREE.Points(geometry, new THREE.PointsMaterial({ color: "#d7f2f2", size: .018, transparent: true, opacity: .7 }));
    scene.add(starfield);
    resizeGlobe();
    renderer.setAnimationLoop(animate);
  } catch (error) {
    console.error(error);
    renderer = null;
    const loop = (now) => { animate(now); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
}

// Where the whole globe sits on the stage, in stage pixels.
function globeFrame() {
  const W = stage.clientWidth;
  const H = stage.clientHeight;
  if (W > 680) return { x: W / 2, y: H * .5, r: Math.min(H * .43, W * .36) };
  // Phone: the whole ring (top label to bottom caption) fits between the top
  // of the stage and the top of the card sheet (31% of the app's height).
  // The ring sits on the near side of the ball, so perspective pushes it
  // about a tenth further out than its flat distance.
  const reach = Math.sin(THREE.MathUtils.degToRad(RING)) * 1.11;
  const above = 58;  // room over the top pin's middle for its question
  const below = 48;  // room under the bottom pin's middle for its name
  const appH = $("panel").offsetParent?.clientHeight || H;
  const sheetTop = H - appH * .31;
  const r = clamp(Math.min(W * .47, (sheetTop - above - below) / (2 * reach)), 90, W * .47);
  return { x: W / 2, y: above + r * reach, r };
}

// The canvas's offset from the stage, kept so place() reads no layout per frame.
const view = { w: 1, h: 1, x: 0, y: 0 };

function resizeGlobe() {
  const canvas = $("globe");
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  if (!width || !height) return;
  const box = canvas.getBoundingClientRect();
  const at = stage.getBoundingClientRect();
  Object.assign(view, { w: width, h: height, x: box.left - at.left, y: box.top - at.top });
  if (!renderer) return;
  renderer.setSize(width, height, false);
  camera.aspect = width / height;
  // Pull the camera back until the globe is `frame.r` pixels across, then
  // slide the globe so its middle is the middle of the stage.
  const frame = globeFrame();
  const half = Math.tan(THREE.MathUtils.degToRad(FOV / 2));
  const t = frame.r * 2 * half / height;
  camera.position.z = Math.sqrt(1 + t * t) / t;
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  const perPx = 2 * camera.position.z * half / height;
  world.position.set(
    (at.left + frame.x - (box.left + width / 2)) * perPx,
    -(at.top + frame.y - (box.top + height / 2)) * perPx,
    0,
  );
  world.updateMatrixWorld();
}

// A spot in the globe's own frame → stage pixels, and how squarely it faces
// the viewer (1 = front, 0 = on the rim, below 0 = round the back).
const scratch = new THREE.Vector3();
function project(local) {
  scratch.copy(local).applyQuaternion(globeQ);
  const face = scratch.z;
  if (!renderer) {
    const frame = globeFrame();
    return { x: frame.x + frame.r * scratch.x, y: frame.y - frame.r * scratch.y, face };
  }
  scratch.add(world.position).project(camera);
  return { x: (scratch.x + 1) / 2 * view.w + view.x, y: (1 - scratch.y) / 2 * view.h + view.y, face };
}

const smooth = (lo, hi, v) => {
  const t = clamp((v - lo) / (hi - lo), 0, 1);
  return t * t * (3 - 2 * t);
};
const fadeIn = (born, now) => (born ? smooth(0, 1, (now - born) / 450) : 1);

// Every frame: put each pin, label, chip and line where its spot on the globe
// is now. Pins round the back fade out; pins near the rim shrink and their
// footprint flattens, as a disc lying on a ball would.
function place(now) {
  if (!state.centre) return;
  const middle = project(new THREE.Vector3(0, 0, 0));
  const at = new Map();
  for (const el of pins) {
    if (el.slide) {
      const p = clamp((now - el.slide.started) / el.slide.duration, 0, 1);
      const e = 1 - Math.pow(1 - p, 3);
      el.anchor.copy(el.slide.from).lerp(el.slide.to, e).normalize();
      if (p === 1) el.slide = null;
    }
    const spot = project(el.anchor);
    let alpha = smooth(.06, .3, spot.face) * fadeIn(el.born, now);
    if (el.dying) {
      const p = (now - el.dying) / 450;
      if (p >= 1) {
        pins.delete(el);
        el.remove();
        continue;
      }
      alpha *= 1 - smooth(0, 1, p);
    }
    const scale = clamp((.5 + .5 * spot.face) / (.5 + .5 * el.restFace), .35, 1.15);
    el.style.transform = `translate3d(${spot.x.toFixed(1)}px, ${spot.y.toFixed(1)}px, 0) translate(-50%, -50%) scale(${scale.toFixed(3)})`;
    el.style.opacity = alpha.toFixed(3);
    el.style.pointerEvents = alpha > .5 ? "" : "none";
    const tilt = Math.atan2(spot.y - middle.y, spot.x - middle.x);
    el.style.setProperty("--tilt", `${tilt.toFixed(3)}rad`);
    el.style.setProperty("--squash", Math.max(.2, spot.face).toFixed(3));
    if (!el.dying && el.dataset.slot) at.set(el.dataset.slot, { x: spot.x, y: spot.y, r: el.size * scale / 2, alpha });
  }
  const W = stage.clientWidth;
  const centre = at.get("centre");
  for (const block of state.blocks) {
    const dot = at.get(block.slot);
    if (!dot) continue;
    const alpha = dot.alpha * fadeIn(block.born, now);
    const left = clamp(dot.x - block.width / 2, 4, W - block.width - 4);
    block.label.style.transform = `translate3d(${left.toFixed(1)}px, ${(dot.y - dot.r - block.labelH).toFixed(1)}px, 0)`;
    block.label.style.opacity = alpha.toFixed(3);
    if (block.more) {
      block.more.style.transform = `translate3d(${(dot.x + dot.r - 16).toFixed(1)}px, ${(dot.y + dot.r - 20).toFixed(1)}px, 0)`;
      block.more.style.opacity = alpha.toFixed(3);
      block.more.style.pointerEvents = alpha > .5 ? "" : "none";
    }
    if (!centre) continue;
    const dx = dot.x - centre.x;
    const dy = dot.y - centre.y;
    const reach = Math.hypot(dx, dy) || 1;
    const from = (centre.r + 3) / reach;
    const to = Math.max(from, 1 - (dot.r + 3) / reach);
    block.line.setAttribute("x1", (centre.x + dx * from).toFixed(1));
    block.line.setAttribute("y1", (centre.y + dy * from).toFixed(1));
    block.line.setAttribute("x2", (centre.x + dx * to).toFixed(1));
    block.line.setAttribute("y2", (centre.y + dy * to).toFixed(1));
    block.line.setAttribute("stroke-opacity", (.5 * Math.min(alpha, centre.alpha)).toFixed(3));
  }
}

// A point never centred before gets a spot on the globe from its id.
function homeSpot(id) {
  let hash = 2166136261;
  for (let i = 0; i < id.length; i += 1) hash = Math.imul(hash ^ id.charCodeAt(i), 16777619) >>> 0;
  const lon = (hash % 3600) / 3600 * Math.PI * 2;
  const lat = (((hash >>> 12) % 1000) / 1000 - .5) * 1.2;
  return new THREE.Vector3(Math.cos(lat) * Math.sin(lon), Math.sin(lat), Math.cos(lat) * Math.cos(lon));
}

// The globe's resting turn for a spot: that spot faces the viewer and the
// globe's north stays up, so the grid never tips over however far you wander.
function restFor(spot) {
  const lat = Math.asin(clamp(spot.y, -1, 1));
  const lon = Math.atan2(spot.x, spot.z);
  return new THREE.Quaternion().setFromEuler(new THREE.Euler(lat, -lon, 0, "XYZ"));
}

function turnGlobe(spot, instant) {
  state.restQ = restFor(spot);
  state.spin = 0;
  state.spun = false;
  if (instant || reduced) {
    globeQ.copy(state.restQ);
    turn = null;
    return;
  }
  const angle = globeQ.angleTo(state.restQ);
  turn = { from: globeQ.clone(), to: state.restQ.clone(), started: performance.now(), duration: clamp(500 + angle * 420, 700, 1500) };
}

// Any touch, key or wheel stops the resting spin and brings the centre back.
function touched() {
  state.lastTouch = performance.now();
  if (!state.spun || !state.restQ) return;
  state.spun = false;
  state.spin = 0;
  const angle = globeQ.angleTo(state.restQ);
  turn = { from: globeQ.clone(), to: state.restQ.clone(), started: performance.now(), duration: clamp(500 + angle * 420, 600, 1500) };
}

const spinStep = new THREE.Quaternion();
const UP = new THREE.Vector3(0, 1, 0);
function animate(now) {
  const dt = Math.min((now - lastFrame) / 1000, .05);
  lastFrame = now;
  if (turn) {
    const progress = Math.min(1, (now - turn.started) / turn.duration);
    globeQ.slerpQuaternions(turn.from, turn.to, 1 - Math.pow(1 - progress, 3));
    if (progress === 1) turn = null;
  } else if (!reduced && state.centre && state.centre === state.home
      && !(state.peek && stage.clientWidth <= 680 && $("panel").classList.contains("open"))
      && !$("results").classList.contains("open")
      && now - state.lastTouch > IDLE_MS) {
    // The old viewer's resting spin, about the globe's own north, easing in.
    state.spin = Math.min(1, state.spin + dt / 2.5);
    globeQ.multiply(spinStep.setFromAxisAngle(UP, SPIN * state.spin * dt));
    state.spun = true;
  }
  place(now);
  if (!renderer) return;
  globeGroup.quaternion.copy(globeQ);
  planet.material.uniforms.uTime.value = reduced ? 0 : now / 1000;
  starfield.rotation.y += dt * .002;
  renderer.render(scene, camera);
}
boot().catch((error) => {
  console.error(error);
  $("panel-body").replaceChildren(node("p", "", "The graph could not be loaded."));
  $("panel").classList.add("open");
});
</script>
</body>
</html>
