// How far back to lean the lowered globe so that a spot `wide` radians to the side of the middle shows `sit` of
// the way up the Earth's face (1 = its top edge), as the near camera sees it; null when it cannot: the spot
// would be over the edge, squeezed flat against it, or further to the side than `reach` px.
function leanFor(sit, wide, r, reach) {
  const z = lowCamera(r);
  const edge = Math.sqrt(z * z - 1);
  const c = Math.cos(wide);
  if (z * c <= 1.05) return null;
  const up = (a) => edge * c * Math.sin(a) / (z - c * Math.cos(a));
  let lo = 0;
  let hi = Math.acos(1 / (z * c)) * .93;   // short of the edge itself
  if (up(hi) < sit) return null;
  for (let i = 0; i < 24; i += 1) {
    const mid = (lo + hi) / 2;
    if (up(mid) < sit) lo = mid; else hi = mid;
  }
  return r * edge * Math.sin(wide) / (z - c * Math.cos(hi)) > reach ? null : hi;
}

// The lowered globe shows only its top: turn it so the rows' topics sit there, in the room under the doors.
// Side by side they sit left and right of the middle; the further apart they are, the nearer the Earth's edge
// they must sit to stay on the screen. Too far apart to show together (Brazil and Japan), the first row's
// topic is shown rather than none.
function aimThemes() {
  let spots = state.themes.rows.map((id) => state.points.get(id).at).filter(Boolean).map((at) => vecAt(at.lat, at.lon));
  if (!spots.length) return;
  const W = stage.clientWidth;
  const { r, cap } = lowFrame();
  const sit = 1 - cap * .5 / r;   // how high on the Earth's face the middle of the part that shows is, 1 = its top
  const middle = (list) => {
    const mid = list.reduce((sum, spot) => sum.add(spot), new THREE.Vector3());
    return mid.length() > .2 ? mid.normalize() : list[0].clone();
  };
  let spot = middle(spots);
  let lean = leanFor(sit, Math.max(...spots.map((one) => one.angleTo(spot))), r, W / 2 - (W <= 680 ? 16 : 44));
  if (lean == null) {
    spots = [spots[0]];
    spot = spots[0].clone();
    lean = leanFor(sit, 0, r, W) ?? 1;
  }
  const want = restFor(spot);
  if (spots.length > 1) {
    // Roll the globe so the first and last rows' topics sit side by side on the part that shows.
    const a = spots[0].clone().applyQuaternion(want);
    const b = spots[spots.length - 1].clone().applyQuaternion(want);
    let roll = -Math.atan2(b.y - a.y, b.x - a.x);
    if (Math.abs(roll) > Math.PI / 2) roll += roll > 0 ? -Math.PI : Math.PI;   // never upside down
    want.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), roll));
  }
  want.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -lean));
  state.userTurned = false;
  state.restQ = want;
  state.aimQ = want;
  state.spin = 0;
  state.spun = false;
  if (reduced) {
    globeQ.copy(want);
    turn = null;
    return;
  }
  turn = { from: globeQ.clone(), to: want.clone(), started: performance.now(), duration: 1100 };
}

function outLink(text, href, className = "") {
  const link = node("a", className, text);
  link.href = href;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  return link;
}

function doorPicture(theme, picture, alt, said = "") {
  const figure = node("figure", "th-pic");
  const frame = node("div");
  figure.append(frame);
  const show = (visual) => {
    const img = node("img");
    img.alt = alt;
    img.referrerPolicy = "no-referrer";
    img.addEventListener("load", () => {
      frame.replaceChildren(img);
      const credit = node("figcaption", "", `${t("Photo:")} ${visual.of ? `${capitalOf(visual)} · ` : said}${visual.credit || t("source contributor")} · `);
      credit.append(outLink(visual.licence || t("source"), visual.page));
      figure.append(credit);
      if (figure.isConnected) levelRows();   // the words under a photo wrap to their own length on each door
    }, { once: true });
    img.src = visual.src;
  };
  frame.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${theme.icon}</svg>`;
  if (picture?.then) picture.then((visual) => { if (visual && figure.isConnected) show(visual); });
  else if (picture) show(picture);
  return figure;
}

// The facts a theme door compares: the same ones at the same places on every row.
const DOOR_FACTS = {
  facts: [["people", t("People")], ["life", t("Years people live")], ["hdi", t("Living well score (HDI)")]],
  geography: [["size", t("Size")], ["highest", t("Highest point")]],
  history: [["began", t("Started")], ["government", t("Kind of government")], ["head", t("Head of state")]],
  culture: [["languages", t("Languages|official")], ["nobel", t("Nobel prizes")], ["heritage", t("World Heritage sites")]],
  economy: [["money", t("Money")], ["gdp", t("Made in a year (GDP)")], ["gdp-each", t("GDP for each person")]],
};
const hasFacts = (point, key) => Boolean(point?.facts?.some((fact) => DOOR_FACTS[key].some(([one]) => one === fact.key)));
// The time machine: a year from YEAR_FIRST on, or now. A fact with values through the years follows the year;
// a fact that never changes (how big, how high, when it started) stays; any other is known for today only.
const YEAR_FIRST = 1960;
const YEAR_NOW = new Date().getFullYear();
const YEAR_REACH = 5;     // a value up to this many years older than the chosen year still answers, with its own year
const TIMELESS = new Set(["size", "highest", "began"]);
const RANKED = new Set(["people", "size", "highest", "gdp", "gdp-each", "life", "hdi"]);
const RANK_LEAST = 100;   // a rank is shown only when at least this many countries have the value
const TIMES = {
  people: (n, name) => t("{n} times as many people as {name}", { n, name }),
  size: (n, name) => t("{n} times as big as {name}", { n, name }),
  highest: (n, name) => t("{n} times as high as {name}", { n, name }),
  gdp: (n, name) => t("{n} times as much as {name}", { n, name }),
  "gdp-each": (n, name) => t("{n} times as much as {name}", { n, name }),
};
function timesWords(ratio) {
  if (ratio < 1.15) return "";
  return ratio < 10 ? Math.round(ratio * 10) / 10 : Math.round(ratio);   // the phrase around it says "times"
}
function amount(number) {
  if (LANG !== "en") return number >= 1e4 ? COMPACT.format(roughly(number)) : NUMBER.format(Math.round(number));
  for (const [size, word] of [[1e9, "billion"], [1e6, "million"]]) {
    if (number >= size) return `${String(number / size < 10 ? Math.round(number / size * 10) / 10 : Math.round(number / size))} ${word}`;
  }
  return number >= 1000 ? Number(number.toPrecision(2)).toLocaleString("en") : String(Math.round(number));
}
const SAY = {
  people: (n) => (LANG === "en" ? `${amount(n)} people` : t("{n} people", { n: amount(n), count: n })),
  life: (n) => t("{n} years", { n: Math.round(n * 10) / 10 }),
  hdi: (n) => t("{n} out of 1", { n: Math.round(n * 1000) / 1000 }),
};
const ordinal = (n) => `${n.toLocaleString("en")}${n % 100 > 10 && n % 100 < 14 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th"}`;
// A fact's words in the chosen language. English keeps the words the build wrote; another language writes
// numbers its own way and takes word facts from Wikidata's labels (`said`), a word with no label staying English.
const COMPACT = new Intl.NumberFormat(LOCALE, { notation: "compact", maximumFractionDigits: 1 });
const roughly = (n) => Number(Number(n).toPrecision(2));
function factText(fact) {
  if (LANG === "en" || fact.value == null) return fact.text;
  const v = fact.value;
  const words = (list) => list.map((word, i) => fact.said?.[i] || word).join(LANG === "zh" ? "、" : ", ");
  switch (fact.key) {
    case "people": case "life": case "hdi": return SAY[fact.key](v);
    case "size": return t("{n} km²", { n: roughly(v) });
    case "highest": return t("{name}, {n} m", { name: fact.said?.[0] || fact.name || "", n: v });
    case "began": return String(v);
    case "gdp": return t("{n} US dollars", { n: COMPACT.format(roughly(v)), count: v });
    case "gdp-each": return t("{n} US dollars", { n: roughly(v), count: v });
    case "nobel": return t("{n} winners who were citizens", { n: v });
    case "heritage": return t("{n} sites", { n: v });
    default: return Array.isArray(v) ? words(fact.text.split(", ").length === v.length ? fact.text.split(", ") : v) : fact.text;
  }
}

// What a topic's fact says at the chosen year: { fact, value, text, as_of }, { fact, gone: true } when it has
// nothing for that year, or null when the topic has no such fact at all.
function factAt(point, key, year) {
  const fact = point.facts?.find((one) => one.key === key);
  if (!fact) return null;
  const now = { fact, value: fact.value, text: factText(fact), as_of: fact.as_of };
  if (year == null || TIMELESS.has(key)) return now;
  if (fact.by_year) {
    for (let y = year; y > year - YEAR_REACH; y -= 1) {
      if (fact.by_year[y] != null) return { fact, value: fact.by_year[y], text: SAY[key](fact.by_year[y]), as_of: String(y) };
    }
    return { fact, gone: true };
  }
  return fact.as_of && Number(fact.as_of) <= year ? now : { fact, gone: true };
}

// Where a country stands among all countries for one fact at one year, biggest first: { place, of }.
const ranks = new Map();
function rankOf(point, key, year) {
  if (!RANKED.has(key) || point.status !== "country") return null;
  const id = `${key}|${year}`;
  if (!ranks.has(id)) {
    const held = [...state.points.values()].filter((one) => one.status === "country")
      .map((one) => [one.id, factAt(one, key, year)?.value]).filter(([, n]) => typeof n === "number")
      .sort((a, b) => b[1] - a[1]);
    ranks.set(id, { of: held.length, place: new Map(held.map(([one], i) => [one, i + 1])) });
  }
  const rank = ranks.get(id);
  return rank.of >= RANK_LEAST && rank.place.has(point.id) ? { place: rank.place.get(point.id), of: rank.of } : null;
}

// Which facts a door shows. A fact no row has is left out, so alone a topic shows only what it has, and side by
// side a fact shows on every door as soon as one of them has it. A fact that follows the year stays in its place
// while the time machine moves (it may say "Nothing yet for 1975"); a fact known for today only leaves for the past.
function doorRows(points, theme) {
  const { year } = state;
  return DOOR_FACTS[theme].filter(([key]) => points.some((point) => {
    const fact = point.facts?.find((one) => one.key === key);
    if (!fact) return false;
    if (year == null || TIMELESS.has(key) || fact.by_year) return true;
    return Boolean(fact.as_of) && Number(fact.as_of) <= year;
  }));
}

// Side by side, the same fact sits at the same height on every door: each row is as tall as its tallest.
function levelRows() {
  const boxes = chain.rows.map((row) => row.cmp).filter((cmp) => cmp.isConnected);
  if (boxes.length === 1) {
    chain.tall = chain.tall || new Map();
    for (const row of boxes[0].children) {
      const key = `${state.themes?.key}|${row.dataset.key}`;
      row.style.minHeight = "";
      const now = Math.max(row.getBoundingClientRect().height, chain.tall.get(key) || 0);
      chain.tall.set(key, now);
      row.style.minHeight = `${now}px`;
    }
  }
  if (boxes.length < 2) return evenDoors();
  // What stands over the facts (the photo and its words) is as tall as the tallest too, so the first fact starts level.
  const heads = boxes.map((cmp) => cmp.previousElementSibling).filter(Boolean);
  for (const head of heads) head.style.minHeight = "";
  const high = Math.max(0, ...heads.map((head) => head.getBoundingClientRect().height));
  for (const head of heads) head.style.minHeight = `${high}px`;
  const count = Math.max(...boxes.map((cmp) => cmp.children.length));
  for (const cmp of boxes) for (const row of cmp.children) row.style.minHeight = "";
  // A row keeps the greatest height it has had since these doors opened, so the facts do not jump up and
  // down while the time machine moves (Owner, 2026-11-16).
  chain.tall = chain.tall || new Map();
  const tall = Array.from({ length: count }, (_, r) => {
    const key = `${state.themes?.key}|${boxes[0].children[r]?.dataset.key}`;
    const now = Math.max(...boxes.map((cmp) => cmp.children[r]?.getBoundingClientRect().height || 0), chain.tall.get(key) || 0);
    chain.tall.set(key, now);
    return now;
  });
  for (const cmp of boxes) [...cmp.children].forEach((row, r) => { row.style.minHeight = `${tall[r]}px`; });
  // Inside a fact, each line (title, value, bar, notes) is as tall as that line on any door, so the bars and
  // the rank lines sit level too, not only the tops of the facts (Owner, 2026-11-16). Kept like the rows.
  for (let r = 0; r < count; r += 1) {
    const rows = boxes.map((cmp) => cmp.children[r]).filter(Boolean);
    const fact = `${state.themes?.key}|${rows[0]?.dataset.key}`;
    const lines = Math.max(...rows.map((row) => row.children.length));
    for (const row of rows) for (const line of row.children) line.style.minHeight = "";
    for (let l = 0; l < lines; l += 1) {
      const key = `${fact}|${l}`;
      const now = Math.max(...rows.map((row) => row.children[l]?.getBoundingClientRect().height || 0), chain.tall.get(key) || 0);
      chain.tall.set(key, now);
      for (const row of rows) if (row.children[l]) row.children[l].style.minHeight = `${now}px`;
    }
  }
  evenDoors();
}

// Doors side by side are equally long inside, and stand at the same place: a door with less to read gets
// empty room at its foot, so one door can never stop scrolling before the other.
function evenDoors(top = chain.top ?? 0) {
  const bodies = chain.rows.map((row) => row.body).filter((body) => body?.isConnected);
  if (bodies.length < 2) return;
  const pads = bodies.map((body) => {
    let pad = body.querySelector(":scope > .th-pad");
    if (!pad) pad = body.appendChild(node("div", "th-pad"));
    else if (pad !== body.lastElementChild) body.append(pad);
    pad.style.height = "0px";
    return pad;
  });
  const long = Math.max(...bodies.map((body) => body.scrollHeight));
  bodies.forEach((body, i) => { pads[i].style.height = `${long - body.scrollHeight}px`; });
  chain.scrolling = bodies[0];
  clearTimeout(chain.scrollEnd);
  chain.scrollEnd = setTimeout(() => { chain.scrolling = null; }, 140);
  for (const body of bodies) body.scrollTop = top;
}

// Side by side, the doors scroll as one.
function scrollTogether(from) {
  if (chain.scrolling && chain.scrolling !== from) return;
  chain.scrolling = from;
  clearTimeout(chain.scrollEnd);
  chain.scrollEnd = setTimeout(() => { chain.scrolling = null; }, 140);
  chain.top = from.scrollTop;
  for (const { body } of chain.rows) {
    if (body !== from && Math.abs(body.scrollTop - from.scrollTop) > 1) body.scrollTop = from.scrollTop;
  }
}

// The facts of one door. With more rows, the same fact sits at the same place on each door: numbers get a bar
// measured against the biggest, and a word the rows share is marked on all of them.
function compareInto(box, point, points, theme) {
  const { year } = state;
  const parts = [];
  // Every fact row has the same four lines, in the same order, on every door: title (with its source link),
  // value, bar, notes (rank, "N times as…", "the same as…"). A line a row does not need is left empty, so
  // levelRows() can make each line as tall as the tallest on any door and every line sits level (Owner,
  // 2026-11-16: the rank line goes UNDER the bar, and a door with no rank must not have its bar higher).
  for (const [key, label] of doorRows(points, theme)) {
    const seen = factAt(point, key, year);
    const row = node("div", "th-fact");
    row.dataset.key = key;
    row.append(node("b", "", label));
    parts.push(row);
    const barLine = node("span", "barline");
    const notes = node("span", "notes");
    if (!seen || seen.gone) {
      // An unseen stand-in for the "source" link, so the title and the words sit where they do on a full row.
      const gap = node("span", "gap", "\u200b");
      gap.setAttribute("aria-hidden", "true");
      row.append(gap, node("span", "v none", year == null ? "Nothing yet" : `Nothing yet for ${year}`), barLine, notes);
      continue;
    }
    const { fact } = seen;
    const source = outLink(t("source"), fact.source);
    source.setAttribute("aria-label", t("Source for {what}: Wikidata", { what: label.toLowerCase() }));
    row.append(source);
    const others = points.filter((other) => other !== point).map((other) => [other, factAt(other, key, year)?.value]);
    if (typeof seen.value === "number") {
      const value = node("span", "v", seen.text);
      if (seen.as_of) value.append(" ", node("small", "", t("in {year}", { year: String(seen.as_of) })));
      row.append(value, barLine, notes);
      const rank = rankOf(point, key, year);
      if (rank) notes.append(node("span", "rank", LANG === "en" ? `${ordinal(rank.place)} of ${rank.of} countries` : t("Place {place} of {of} countries", { place: rank.place, of: rank.of, count: rank.of })));
      if (fact.worked) notes.append(node("span", "rank", t("Worked out: {how}", { how: fact.worked === WORKED_GDP ? t("everything made in the year, divided by the people") : fact.worked })));
      const numbers = others.map(([, n]) => n).filter((n) => typeof n === "number");
      if (!numbers.length) continue;
      if (key === "began") {
        const gap = numbers[0] - seen.value;
        if (others.length === 1 && gap > 0) notes.append(node("span", "times", t("{n} years before {name}", { n: gap, name: others[0][0].name })));
        continue;
      }
      const bar = node("span", "bar");
      const fill = node("i");
      fill.style.width = `${Math.max(2, seen.value / Math.max(seen.value, ...numbers) * 100)}%`;
      bar.append(fill);
      barLine.append(bar);
      if (others.length === 1 && TIMES[key] && seen.value > numbers[0]) {
        const words = timesWords(seen.value / numbers[0]);
        notes.append(node("span", "times", words ? TIMES[key](words, others[0][0].name) : t("About the same as {name}", { name: others[0][0].name })));
      }
    } else {
      const value = node("span", "v");
      const lower = (list) => (Array.isArray(list) ? list.map((word) => word.toLowerCase()) : []);
      // Same/different is judged on the English words; each chip shows the word in the chosen language
      // (Wikidata's label, `said`, one per English word of the fact), else the English word.
      const spoken = new Map(Array.isArray(fact.value) ? fact.value.map((word, i) => [word, fact.said?.[i]]) : []);
      let shared = 0;
      seen.value.slice(0, 6).forEach((word) => {
        const same = others.length > 0 && others.every(([, list]) => lower(list).includes(word.toLowerCase()));
        shared += same;
        const said = spoken.get(word) || word;
        value.append(node("span", same ? "chip same" : "chip", said[0].toUpperCase() + said.slice(1)));
      });
      if (seen.value.length > 6) value.append(node("small", "", `and ${seen.value.length - 6} more`));
      row.append(value, barLine, notes);
      if (shared) notes.append(node("span", "both", others.length > 1 ? t("The same in every row") : t("The same as {name}", { name: others[0][0].name })));
    }
  }
  box.replaceChildren(...parts);
}

// Every fact of one topic on one door, under its picture.
function factsDoor(body, cmp, point) {
  const picture = doorPicture(THEMES[0], visualFor(point), t("Photograph of {name}", { name: point.name }));
  // Side by side, what can be compared comes first and the picture after it (Owner, 2026-11-16).
  if (state.themes.rows.length > 1) body.append(cmp, picture);
  else body.append(picture, cmp);
  const flag = point.facts?.find((fact) => fact.key === "flag");
  if (flag) {
    const credit = node("p", "th-words", `Flag picture: ${flag.credit} · `);
    credit.append(outLink(flag.licence || t("source"), flag.page));
    body.append(credit);
  }
}

// A theme's door: the facts to compare at the top, then the page about that side of the topic to read.
function themeDoor(body, cmp, door, theme) {
  if (cmp.children.length) body.append(cmp);
  if (!door) {
    body.append(doorPicture(theme, null, ""), node("h3", "", theme.name), node("p", "th-none", cmp.children.length ? t("Nothing to read yet") : t("Nothing yet")));
    return;
  }
  const title = node("h3", "", door.title);
  const text = node("p", "", door.text);
  // In another language, a door with no page of its own there shows the English page, tagged "English".
  if (LANG !== "en" && !door.spoken) {
    title.lang = "en";
    saidBy(text, false);
  }
  body.append(
    doorPicture(theme, door.picture, t("Photograph for {name}", { name: door.title })),
    title,
    text,
    outLink(t("Read more on Wikipedia ↗"), door.source, "th-more"),
  );
  const words = node("p", "th-words", `${t("Words: Wikipedia")} · `);
  words.append(outLink("CC BY-SA 4.0", "https://creativecommons.org/licenses/by-sa/4.0/"));
  body.append(words);
}

// The time machine's handle: the far right is now.
// It lives in the bar, in Explore and in Learn alike: the year the facts are for (and, while it is off now, no
// clouds: Owner, 2026-11-15, "I want to see how earth change overtime").
function drawYear() {
  const { year } = state;
  const age = state.deep;
  if (document.activeElement !== $("th-range")) $("th-range").value = Math.round(1000 * barOfTime());
  // Away from now, the time shows in the tag under the handle, in the opening's words and look ("1983",
  // "200 million years ago"; Owner, 2026-11-18). The period is in the drawer's "Land and sea" row.
  const words = age != null ? deepWords(age) : null;
  $("th-range").setAttribute("aria-valuetext", words ? `${words.ago}, ${words.period}` : year == null ? t("Now") : String(year));
  $("when").classList.toggle("past", year != null || age != null);
  $("when").classList.toggle("deep", age != null);
  if ((words || year != null) && !intro.active) {
    const tag = $("when-tag");
    tag.textContent = words ? words.ago : String(year);
    tag.classList.remove("gone");
    placeWhenTag();
  }
  // Where the bar starts: 750 mya or 1960, the chosen one lit.
  const span = $("th-span");
  span.disabled = !deep.ages.length;
  span.classList.toggle("loading", !deep.listed);
  span.setAttribute("aria-busy", String(!deep.listed));
  span.setAttribute("aria-pressed", String(deep.on && deep.ages.length > 0));
  $("th-deep-end").textContent = t("750 mya");
  $("th-near-end").textContent = t("{year}|the bar's start", { year: String(YEAR_FIRST) });
  span.title = !deep.listed ? t("Deep time's maps are loading.") : deep.on ? t("The time machine goes back 750 million years. Tap for 1960.")
    : t("The time machine goes back to 1960. Tap for 750 million years ago.");
  drawNowButton();
  if ($("sky-box").classList.contains("open")) drawSkyFacts();
}
// "Now" (back to now) is lit while the year or the clock is away from now.
function drawNowButton() {
  $("th-now").disabled = state.year == null && state.deep == null && clock.live;
}
let yearFrame = 0;
function setYear(year) {
  // Round first: the handle a hair short of the far right is 2025.9999, which must read as now, not as 2026
  // (a year this young has no values yet, so every fact said "Nothing yet for 2026").
  const whole = Math.round(year);
  state.deep = null;
  state.year = whole >= YEAR_NOW || !(whole >= YEAR_FIRST) ? null : whole;
  drawYear();
  // The globe stays still whatever the time does (Owner, 2026-11-18): the reader turns it.
  if (!state.centre) return;  // the first look: nothing drawn yet
  if (state.themes) themesHash();
  else yearHash();
  if (yearFrame) return;     // the handle moves faster than the screen draws: fill the doors (or the card) once a frame
  yearFrame = requestAnimationFrame(() => {
    yearFrame = 0;
    const chosen = state.themes;
    if (!chosen) return cardFacts();
    const points = chosen.rows.map((id) => state.points.get(id));
    chain.top = Math.max(0, ...chain.rows.map((row) => row.body?.scrollTop || 0));   // where the doors stood
    chain.rows.forEach(({ cmp }, i) => { if (points[i]) compareInto(cmp, points[i], points, chosen.key); });
    levelRows();
  });
}

// In Explore the card's facts follow the year, in place, so the card does not jump.
function cardFacts() {
  const body = $("panel-body");
  const list = body.querySelector(".facts");
  const point = state.points.get(state.centre);
  if (!list || !point || body.querySelector(".rows")) return;   // a list is open, not the card
  const fresh = document.createDocumentFragment();
  factsInto(fresh, point);
  const next = fresh.querySelector(".facts");
  if (next) list.replaceWith(next);
}

/* ---------- deep time: the time machine back to 750 million years ago ----------
   Owner, 2026-11-17: on a phone a "Deep time" switch (in the moment drawer) turns the bar to 750 million years
   ago → now, one stop per atlas map; on bigger screens ONE long bar: deep time on its left (DEEP_BAR of it, as
   in the opening), 1960 → now on the rest. At an age the Earth is the PaleoAtlas map of that age
   (scripts/build_deep.py; the stops are the atlas's own 89 maps), cross-faded from the one before; no clouds,
   city lights or sea ice; every place lit or pinned is moved back with the atlas's plate model, so the topic
   shows where it was ("where Brazil was 200 million years ago"); the tag under the handle names the period. */
const deep = {
  ages: [], byAge: new Map(), ids: [], rows: null, today: null, on: false, listed: false,
  kept: new Map(), a: null, b: null, fade: 0, amt: 0, turns: new Float32Array(256 * 4), turnAge: null, memo: new Map(),
  small: new Map(), preloaded: false,
};
const PHONE_MAX = 680;   // the phone layout's width (as `fit()`): there deep time is the drawer's switch

async function loadDeep() {
  try {
    const response = await fetch("./earth/paleo/deep.json", { cache: "no-cache" });
    if (!response.ok) throw new Error(`deep ${response.status}`);
    const index = await response.json();
    // Oldest first; age 0 (the atlas's today) is not a stop: the bar's now is the real Earth.
    for (const era of index.eras.filter((one) => one.age > 0).sort((a, b) => b.age - a.age)) {
      deep.ages.push(era.age);
      deep.byAge.set(era.age, era);
    }
    deep.ids = index.plates.ids;
    deep.rows = index.plates.rows;
    const today = index.eras.find((one) => one.age === 0);
    if (today) readTodayPlates(today.plates);
    state.earthLayers = [...(state.earthLayers || []), { what: index.what, credit: index.credit, licence: index.licence, years: index.years }];
    drawSkyCredits();
    deep.listed = true;
    if (state.deep != null) {
      deep.on = true;
      preloadDeep();
    }
    if (state.deep != null && !deep.byAge.has(state.deep)) {
      // A linked age between maps: the nearest map's.
      const asked = state.deep;
      state.deep = deep.ages.reduce((best, one) => (Math.abs(one - asked) < Math.abs(best - asked) ? one : best));
    }
    drawYear();
  } catch (error) {
    deep.listed = true;   // an older server: the bar keeps its 1960 → now
  }
}

// Today's plates, read once into an array: where a pin or a name is today tells which plate carries it back.
function readTodayPlates(file) {
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = img.width;
    canvas.height = img.height;
    const pen = canvas.getContext("2d", { willReadFrequently: true });
    pen.drawImage(img, 0, 0);
    const rgba = pen.getImageData(0, 0, img.width, img.height).data;
    const plates = new Uint8Array(img.width * img.height);
    for (let i = 0; i < plates.length; i += 1) plates[i] = rgba[i * 4];
    deep.today = { plates, w: img.width, h: img.height };
    // Opened at an age (a link): now the topic can be shown where it was.
    const at = state.points.get(state.centre)?.at;
    if (state.deep != null && at && !state.userTurned && !state.themes) turnGlobe(shownAt(vecAt(at.lat, at.lon)));
  };
  img.src = `./earth/${file}`;
}

// The plate model (a GPlates rotation file, as scripts/paleo_atlas.py reads it): a plate's whole turn from today
// to `age`, as a quaternion [w, x, y, z]; null where the model does not know it.
function qmul(a, b) {
  return [a[0] * b[0] - a[1] * b[1] - a[2] * b[2] - a[3] * b[3], a[0] * b[1] + a[1] * b[0] + a[2] * b[3] - a[3] * b[2],
    a[0] * b[2] - a[1] * b[3] + a[2] * b[0] + a[3] * b[1], a[0] * b[3] + a[1] * b[2] - a[2] * b[1] + a[3] * b[0]];
}
function qslerp(a, b, f) {
  let d = a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3];
  let c = b;
  if (d < 0) {
    c = b.map((v) => -v);
    d = -d;
  }
  if (d > .9995) {
    const q = a.map((v, i) => v + f * (c[i] - v));
    const n = Math.hypot(...q);
    return q.map((v) => v / n);
  }
  const th = Math.acos(d);
  const s = Math.sin(th);
  return a.map((v, i) => (Math.sin((1 - f) * th) * v + Math.sin(f * th) * c[i]) / s);
}
function plateTurn(plate, age, depth = 0) {
  if (plate === 0 || depth > 60) return [1, 0, 0, 0];
  const key = `${plate}@${age}`;
  if (deep.memo.has(key)) return deep.memo.get(key);
  let q = null;
  const rows = deep.rows[plate] || [];
  for (let i = 0; i + 1 < rows.length; i += 1) {
    const [a0, w0, x0, y0, z0, f0] = rows[i];
    const [a1, w1, x1, y1, z1, f1] = rows[i + 1];
    if (f0 === f1 && a0 <= age && age <= a1 && a1 > a0) {
      const parent = plateTurn(f0, age, depth + 1);
      if (parent) q = qmul(parent, qslerp([w0, x0, y0, z0], [w1, x1, y1, z1], (age - a0) / (a1 - a0)));
      break;
    }

}

// Every plate's turn at `age`, into the shader's table (and kept for moving the pins).
function deepTurnsAt(age) {
  if (deep.turnAge === age) return;
  deep.turnAge = age;
  deep.memo.clear();
  deep.turns.fill(0);
  deep.ids.forEach((plate, i) => {
    const q = plateTurn(plate, age) || [1, 0, 0, 0];
    deep.turns.set(q, (i + 1) * 4);
  });
  deepTurns.image.data.set(deep.turns);
  deepTurns.needsUpdate = true;
}

// Where a place (a point on the globe, as vecAt gives) was at the age the turns are for: its plate today,
// turned by that plate's turn. The globe's frame is the plate model's (y, z, x). `on`: the point whose plate
// carries it (a name's spot above its place goes with the place's plate).
function movedBack(v, on = v) {
  const today = deep.today;
  if (!today || deep.turnAge == null) return v;
  const lat = Math.asin(clamp(on.y / on.length(), -1, 1));
  const lon = Math.atan2(on.x, on.z);
  const x = clamp(Math.floor((lon / Math.PI + 1) / 2 * today.w), 0, today.w - 1);
  const y = clamp(Math.floor((.5 - lat / Math.PI) * today.h), 0, today.h - 1);
  const k = today.plates[y * today.w + x];
  if (!k) return v;
  const [w, qx, qy, qz] = deep.turns.subarray(k * 4, k * 4 + 4);
  const p = [v.z, v.x, v.y];
  const t = [2 * (qy * p[2] - qz * p[1]), 2 * (qz * p[0] - qx * p[2]), 2 * (qx * p[1] - qy * p[0])];
  const r = [p[0] + w * t[0] + (qy * t[2] - qz * t[1]), p[1] + w * t[1] + (qz * t[0] - qx * t[2]), p[2] + w * t[2] + (qx * t[1] - qy * t[0])];
  return new THREE.Vector3(r[1], r[2], r[0]).multiplyScalar(v.length());
}
// A place as the Earth shows it now: moved back while deep time shows (for aiming the globe at a topic).
const shownAt = (v) => (state.deep != null && deep.today && deep.rows ? (deepTurnsAt(state.deep), movedBack(v)) : v);

// How much of the bar is deep time: none while the bar starts at 1960; with 750 mya chosen, DEEP_BAR of it on a
// wide screen (the long bar, its right end still now) and all of it on a phone (its right end 1960).
function deepShare() {
  if (!deep.ages.length || !(deep.on || state.deep != null)) return 0;
  return stage.clientWidth > PHONE_MAX ? DEEP_BAR : 1;
}
// The handle's place (0 → 1) for the time shown, and the time for a place. Deep time: one stop per atlas map,
// evenly spaced; the recent years as before (half the bar the last quarter of the years).
function barOfTime() {
  const share = deepShare();
  const n = deep.ages.length;
  if (state.deep != null) return share * Math.max(0, deep.ages.indexOf(state.deep)) / n;
  if (state.year == null) return 1;
  if (share === 1) return 1;
  return share + (1 - share) * (1 - Math.sqrt((YEAR_NOW - state.year) / (YEAR_NOW - YEAR_FIRST)));
}
function timeOfBar(at) {
  const share = deepShare();
  const n = deep.ages.length;
  if (share > 0 && at < share) {
    const i = Math.round(at / share * n);
    if (i < n) return { age: deep.ages[i] };
    return { year: YEAR_FIRST };
  }
  if (share === 1) return { year: YEAR_FIRST };   // a phone's deep bar ends at 1960
  const back = 1 - (at - share) / (1 - share);
  return { year: YEAR_NOW - (YEAR_NOW - YEAR_FIRST) * back * back };
}

// The period an age falls in, and the words for it (the tag under the handle, the drawer).
function deepWords(age) {
  const era = deep.byAge.get(age);
  const ago = t("{n} million years ago", { n: age, ago: AGO.format(age * 1e6) });
  return { period: era ? periodName(era.period) : "", ago };
}
// The periods' names (scripts/build_deep.py), written out so the translation script finds them.
const periodName = (name) => ({
  Quaternary: t("Quaternary"), Neogene: t("Neogene"), Paleogene: t("Paleogene"), Cretaceous: t("Cretaceous"),
  Jurassic: t("Jurassic"), Triassic: t("Triassic"), Permian: t("Permian"), Carboniferous: t("Carboniferous"),
  Devonian: t("Devonian"), Silurian: t("Silurian"), Ordovician: t("Ordovician"), Cambrian: t("Cambrian"),
  Ediacaran: t("Ediacaran"), Cryogenian: t("Cryogenian"), Tonian: t("Tonian"),
})[name] ?? name;

function setDeep(age) {
  if (age === state.deep) return;
  state.deep = age;
  state.year = null;
  if (age != null) {
    deep.on = true;
    preloadDeep();
  }
  deep.changed = performance.now();
  drawYear();
  if (state.themes) themesHash();
  else yearHash();
  // The globe stays still while the age changes, centred topic or not (Owner, 2026-11-17 and 2026-11-18): the
  // land and the outline move across it; the reader turns it.
}

// "750 mya · 1960": where the bar starts. Switching keeps the time if the new bar still has it, else the
// nearest end: 1960 (a phone's deep bar ends there; and out of deep time the bar starts there).
function setSpan(on) {
  if (!deep.ages.length || on === deep.on) return;
  deep.on = on;
  if (on) preloadDeep();
  if (on && deepShare() === 1 && state.deep == null) setYear(YEAR_FIRST);
  else if (!on && state.deep != null) setYear(YEAR_FIRST);
  drawYear();
}

// The small pictures (512 wide: a land-and-sea map and its plate map for every age, about 3 MB in all) are
// fetched as soon as deep time can be reached, so the handle shows a map at once wherever it is dragged; the
// full-size map of an age comes once the handle rests on it (Owner, 2026-11-18: the old Earth lagged behind
// the handle, most on the phone).
function preloadDeep() {
  if (deep.preloaded || !deep.ages.length) return;
  deep.preloaded = true;
  for (const age of deep.ages) {
    const era = deep.byAge.get(age);
    if (!era.small || !era.smallPlates) continue;
    const pic = new Image();
    const plates = new Image();
    pic.src = `./earth/${era.small}`;
    plates.src = `./earth/${era.smallPlates}`;
    deep.small.set(age, { pic, plates });
  }
}

// A texture from a loaded picture: the land and sea in colour; the plates as codes (no smoothing, no mipmaps, no
// colour conversion).
function deepTex(img, codes) {
  const tex = new THREE.Texture(img);
  if (codes) {
    tex.colorSpace = THREE.NoColorSpace;
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    tex.generateMipmaps = false;
  } else tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}
const imgReady = (img) => img.complete && img.naturalWidth > 0;

// The maps for an age, as textures: the full-size pair once asked for (`full`) and loaded, else the small pair
// at once if it has come. Null while neither is there.
function deepTexture(era, full) {
  let held = deep.kept.get(era.age);
  if (!held) {
    held = { pic: null, plates: null, full: false, asked: false };
    deep.kept.set(era.age, held);
  }
  if (!held.pic) {
    const small = deep.small.get(era.age);
    if (small && imgReady(small.pic) && imgReady(small.plates)) {
      held.pic = deepTex(small.pic, false);
      held.plates = deepTex(small.plates, true);
    }
  }
  if ((full || !era.small) && !held.asked) {
    held.asked = true;
    const pic = new Image();
    const plates = new Image();
    const swap = () => {
      if (!imgReady(pic) || !imgReady(plates) || deep.kept.get(era.age) !== held) return;
      held.pic?.dispose();
      held.plates?.dispose();
      held.pic = deepTex(pic, false);
      held.plates = deepTex(plates, true);
      held.full = true;
    };
    pic.onload = swap;
    plates.onload = swap;
    pic.src = `./earth/${era.file}`;
    plates.src = `./earth/${era.plates}`;
  }
  return held.pic && held.plates ? held : null;
}

// Each frame: the map for the age at the handle. While the handle moves, the map follows it at once (no fade:
// a fade held the old map back); between two neighbouring maps at rest, a short cross-fade. The plates' turns are
// those of the map shown, so the outline, the tiny topic's ring and the names all sit on that map.
function tickDeep(u, dt) {
  if (!renderer || !planet || intro.active) return;
  const want = state.deep != null ? deep.byAge.get(state.deep) : null;
  const now = performance.now();
  const moving = now - (deep.changed || 0) < 200;
  const ready = want ? deepTexture(want, !moving) : null;
  if (want && ready) {
    const near = (a, b) => Math.abs(deep.ages.indexOf(a.age) - deep.ages.indexOf(b.age)) === 1;
    if (!deep.a || deep.amt === 0) {
      deep.a = want;
      deep.b = null;
    } else if (want !== deep.a && want !== deep.b) {
      if (deep.b) deep.a = deep.b;   // a fade under way ends where it was going
      deep.b = !moving && near(deep.a, want) ? want : null;
      deep.fade = 0;
      if (!deep.b) deep.a = want;
    }
    if (!moving) {
      // At rest, the neighbours' full maps come next.
      const i = deep.ages.indexOf(want.age);
      for (const age of [deep.ages[i - 1], deep.ages[i + 1]]) if (age != null) deepTexture(deep.byAge.get(age), true);
    }
  }
  if (deep.b) {
    deep.fade = Math.min(1, deep.fade + dt / .25);
    if (deep.fade >= 1) {
      deep.a = deep.b;
      deep.b = null;
      deep.fade = 0;
    }
  }
  const on = Boolean(want && deep.a);
  deep.amt = clamp(deep.amt + (on ? dt / .4 : -dt / .4), 0, 1);
  if (deep.a && deep.amt > 0) {
    const a = deep.kept.get(deep.a.age);
    const b = deep.b ? deep.kept.get(deep.b.age) : null;
    if (a?.pic) {
      u.uPaleoA.value = a.pic;
      u.uPaleoB.value = b?.pic || a.pic;
      u.uPaleoMix.value = b?.pic ? deep.fade : 0;
      u.uPaleo.value = Math.max(u.uPaleo.value, eased(deep.amt));
      const late = b?.plates && deep.fade >= .5;
      u.uPlates.value = late ? b.plates : a.plates;
      deepTurnsAt(late ? deep.b.age : deep.a.age);
    }
  }
  // The places move back once the old Earth is mostly in, and come home as it goes.
  const back = Boolean(on && deep.amt > .5 && deep.rows);
  u.uDeep.value = back ? 1 : 0;
  if (back !== deep.back) lit.dirty = true;
  deep.back = back;
  const marks = state.overMark ? [...state.marks, state.overMark] : state.marks;
  for (const mark of marks) {
    if (back) {
      mark.home ??= { anchor: mark.anchor, above: mark.above };
      mark.anchor = movedBack(mark.home.anchor);
      // The name stands above its place on the same plate: moved with the place's plate, not its own.
      if (mark.home.above) mark.above = movedBack(mark.home.above, mark.home.anchor);
    } else if (mark.home) {
      mark.anchor = mark.home.anchor;
      mark.above = mark.home.above;
      mark.home = null;
    }
  }
  // A tiny topic's ring is drawn on the globe: it moves back with its place too (it stayed at today's spot
  // while the name moved: Owner, 2026-11-18, Singapore).
  if (lit.ringAt && u.uMark.value.w > .5) {
    const spot = back ? movedBack(lit.ringAt) : lit.ringAt;
    u.uMark.value.set(spot.x, spot.y, spot.z, 1);
  }
  if (!want && deep.amt === 0) deep.a = null;
  if (deep.kept.size > 8) {
    // A phone holds few: let go of maps away from the ones shown and the one wanted.
    for (const [age, held] of deep.kept) {
      if (age === deep.a?.age || age === deep.b?.age || age === want?.age) continue;
      if (Math.abs(deep.ages.indexOf(age) - deep.ages.indexOf(want?.age ?? age)) <= 1) continue;
      held.pic?.dispose();
      held.plates?.dispose();
      deep.kept.delete(age);
    }
  }
}

let yearHashTimer = 0;
function yearHash() {
  clearTimeout(yearHashTimer);
  yearHashTimer = setTimeout(() => {
    if (state.themes || !state.centre) return;
    try { history.replaceState(null, "", topicHash(state.centre)); } catch (error) { /* a convenience only */ }
  }, 300);
}

/* The chain of themes. Every row has the same chain: the chosen theme sits at the front, just over its door, and
   the others wait behind it, near to far. The chain rolls like the pins do: drag it, turn the
   wheel over it, or pick a theme and it rolls to the front. The Earth stays still while it rolls. */
const CHAIN_SHOWN = 5;     // how many satellites the coming-and-going is timed over (every theme shows)
const CHAIN_STEP = 58;     // px of drag that rolls the chain on by one theme
const chain = { rows: [], drag: null, dragged: false, wheelAt: 0, last: 0, pop: new Map(), popTo: null, fly: null, away: null };
const mod = (n, m) => ((n % m) + m) % m;
// How far behind the front theme k sits when the chain is rolled to `roll`: 0 = at the front.
function depthOf(k, roll, n = state.themes.list.length) {
  return mod(k - roll + .5, n) - .5;
}

// Where a theme sits in the chain, by how far behind the front it is. The satellites stand evenly spaced on a
// line going away from the eye, so the near ones look far apart and the far ones bunch up, smaller. The line
// is a gentle curve (Owner, 2026-11-16: "I didn't say remove the curve", less curvy than the steep climb, not
// too far right): it rises from the front satellite and bends right, the last one landing at the top of the
// row about four fifths across. Mid-way a satellite loses its sign and word and is a small planet; far off,
// a point of light.
const AWAY = .3;          // how fast things shrink with distance
const CHAIN_END = .8;     // the last satellite's place across the row
const CHAIN_BOW = .5;     // 0 = a straight line, 1 = straight up then straight across
function seatOf(d, unit, w, h, n) {
  if (d < 0) return { size: 1 - d * .3, x: 4 + Math.max(d, -.5) * 9, y: 6 + d * unit * 1.1, star: 0, txt: 1 + d * 2, sign: 1 };
  const p = 1 / (1 + AWAY * d);
  const c0 = { x: 4 + unit / 2, y: 6 + unit / 2 };
  const end = { x: Math.max(c0.x + 40, w * CHAIN_END - 6), y: Math.max(c0.y + 40, h - 16) };
  // A quadratic curve from the front to the end; its pull point is between the straight line's middle and
  // the corner over the front satellite. `t` runs 0 → 1 from the front to the last seat (on past it beyond).
  const pull = { x: (c0.x + end.x) / 2 + ((c0.x - end.x) / 2) * CHAIN_BOW, y: (c0.y + end.y) / 2 + ((end.y - c0.y) / 2) * CHAIN_BOW };
  const last = 1 - 1 / (1 + AWAY * Math.max(1, n - 1));
  const t = (1 - p) / last;
  const cx = (1 - t) * (1 - t) * c0.x + 2 * t * (1 - t) * pull.x + t * t * end.x;
  const cy = (1 - t) * (1 - t) * c0.y + 2 * t * (1 - t) * pull.y + t * t * end.y;
  return {
    size: p, x: cx - unit * p / 2, y: cy - unit * p / 2,
    star: smooth(2.9, 3.9, d),
    // Words only on the front satellite and the one behind it (Owner, 2026-11-16: every word in the same
    // place, to the right of its ball; the far ones show none until the mouse brings one up).
    txt: clamp((1.8 - d) / .8, 0, 1),
    sign: 1 - smooth(1.6, 2.3, d),
  };
}

// The dotted path the chain rolls along, through the middle of every seat. Seats do not move as the chain
// rolls (the satellites move along them), so it is drawn again only when the room changes.
function pathOf(sky, unit, w, h, n) {
  const size = `${w}x${h}x${unit}x${n}`;
  if (sky.dataset.path === size) return;
  sky.dataset.path = size;
  const at = [];
  for (let d = 0; d <= n - .9; d += .1) {
    const { size: s, x, y } = seatOf(d, unit, w, h, n);
    const r = unit * s / 2;
    at.push(`${(x + r).toFixed(1)},${(h - y - Math.max(r, 8)).toFixed(1)}`);
  }
  let svg = sky.querySelector(".th-path");
  if (!svg) {
    svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "th-path");
    svg.setAttribute("aria-hidden", "true");
    svg.append(document.createElementNS("http://www.w3.org/2000/svg", "path"));
    sky.prepend(svg);
  }
  svg.firstChild.setAttribute("d", `M${at.join("L")}`);
}

// Coming and going, drawn frame by frame. Into the Themes view the satellites fall into place from above, the
// near one first, in step with the Earth coming down: each arrives as a small star, grows into its ball, and
// its word shows last. Out of it, the other way: the word goes, the ball shrinks to a star, and the stars rise
// away, the far one first. Into a theme the two chains swing about the near satellite (CSS), and the one
// coming in grows from stars the same way.
const FLY_MS = 800;       // the same time the Earth takes to come down or go back up
const FLY_EACH = 80;      // one satellite after the other
const FALL_MS = FLY_MS - (CHAIN_SHOWN - 1) * FLY_EACH;
const FLY_EASE = "cubic-bezier(.215, .61, .355, 1)";

// How far a satellite has arrived: 1 = in its seat. `d` its place in the chain (0 = front).
function arrivedOf(row, d, now) {
  const dc = clamp(d, 0, CHAIN_SHOWN - 1);
  if (chain.away) return 1 - clamp((now - chain.away.started - (CHAIN_SHOWN - 1 - dc) * FLY_EACH) / FALL_MS, 0, 1);
  const fall = row.fall ?? (chain.fly?.kind === "sat-fall" ? chain.fly.started : null);
  if (fall !== null) return clamp((now - fall - dc * FLY_EACH) / FALL_MS, 0, 1);
  return 1;
}

function placeChain(now = performance.now()) {
  const chosen = state.themes || chain.away?.chosen;
  if (!chosen) return false;
  const n = chosen.list.length;
  const far = n - .5;
  const front = mod(Math.round(chosen.roll), n);
  const swinging = chain.fly && chain.fly.kind !== "sat-fall" ? clamp((now - chain.fly.started) / SWING_MS, 0, 1) : 1;
  let busy = Boolean(chain.fly) && now - chain.fly.started < FLY_MS + 100;
  if (chain.fly && !busy) chain.fly = null;
  if (chain.away && now - chain.away.started < FLY_MS + 50) busy = true;
  // Measure every row first, then write: no layout in between.
  const rooms = chain.rows.map(({ sky }) => ({
    unit: parseFloat(getComputedStyle(sky).getPropertyValue("--unit")) || 44, w: sky.clientWidth, h: sky.clientHeight,
    drop: sky.getBoundingClientRect().bottom + 40,
  }));

  chain.rows.forEach((row, r) => {
    const { unit, w, h, drop } = rooms[r];
    pathOf(row.sky, unit, w, h, n);
    row.moons.forEach((moon, k) => {
      const d = depthOf(k, chosen.roll, n);
      let { size, x, y, star, txt, sign } = seatOf(d, unit, w, h, n);
      // A mouse over a theme behind: it, and the same theme on every row, comes up to full size with its word.
      const pop = chain.pop.get(k) || 0;
      if (pop > 0) {
        // It grows about its own middle and stays inside the row, so it never slips out from under the mouse.
        const mid = { x: x + unit * size / 2, y: y + unit * size / 2 };
        size += (Math.max(size, .7) - size) * pop;
        const r = unit * size / 2;
        x = clamp(mid.x, r, Math.max(r, w - r)) - r;
        y = clamp(mid.y, r, Math.max(r, h - r)) - r;
        star *= 1 - pop;
        txt += (1 - txt) * pop;
        sign += (1 - sign) * pop;
      }
      let show = clamp((d + .5) * 2, 0, 1) * clamp((far - d) * 2, 0, 1) * (1 - .07 * clamp(d, 0, 7));
      // While one is brought up, the others step back a little. Their words stay: the only one that hid was
      // the second satellite's, it covered nothing, and its coming and going was the annoying part (Owner, 2026-11-16).
      if (pop < .02) show *= 1 - .4 * popped;
      const a = arrivedOf(row, d, now);
      if (a < 1) {
        busy = true;
        y += (1 - easeOut(a)) * drop;
        const grow = smooth(.3, .78, a);
        size = Math.min(size, .3) + (size - Math.min(size, .3)) * grow;
        star = Math.max(star, 1 - grow);
        txt *= smooth(.78, 1, a);
        show *= smooth(0, .18, a);
      }
      if (swinging < 1) {
        const grow = smooth(.15, .7, swinging);
        size = Math.min(size, .3) + (size - Math.min(size, .3)) * grow;
        star = Math.max(star, 1 - grow);
        txt *= smooth(.65, 1, swinging);
      }
      moon.style.setProperty("--s", size.toFixed(3));
      moon.style.setProperty("--star", star.toFixed(3));
      moon.style.setProperty("--txt", txt.toFixed(3));
      moon.style.setProperty("--sign", sign.toFixed(3));
      moon.style.setProperty("--glow", pop.toFixed(3));
      moon.style.setProperty("--f", clamp(1 - Math.abs(d), 0, 1).toFixed(3));
      moon.style.transform = `translate(${x.toFixed(1)}px, ${(-y).toFixed(1)}px)`;
      moon.style.opacity = ((moon.classList.contains("none") ? .4 : 1) * show).toFixed(3);
      moon.classList.toggle("off", show <= .3 || Boolean(chain.away));
      moon.style.zIndex = String(40 - Math.round(d * 4));
      moon.classList.toggle("front", k === front);
      moon.classList.toggle("seen", chosen.seen.has(chosen.list[k].key) && k !== front);
      moon.classList.toggle("mute", txt < .02);
      moon.classList.toggle("pop", pop > .02);
    });

  return busy;
}

// The mouse over a theme (or the keyboard on it): which one pops, on every row.
function popChain(k) {
  if (chain.popTo === k) return;
  chain.popTo = k;
  if (reduced) {
    chain.pop = new Map(k === null ? [] : [[k, 1]]);
    placeChain();
  }
}
// Ease every pop toward where it is going; true while any is still moving.
function easePops(dt) {
  let moving = false;
  const keys = new Set([...chain.pop.keys(), ...(chain.popTo === null ? [] : [chain.popTo])]);
  for (const k of keys) {
    const want = k === chain.popTo ? 1 : 0;
    const was = chain.pop.get(k) || 0;
    const now = Math.abs(want - was) < .01 ? want : was + (want - was) * (1 - Math.exp(-dt * 14));
    if (now === 0) chain.pop.delete(k);
    else chain.pop.set(k, now);
    if (now !== was) moving = true;
  }

// `kind` names how the satellites now in place arrive; `ghosts` are copies of the ones they took the place of,
// on their way out.
function flyChain(kind, ghosts = null) {

  chain.fly = { kind, started: performance.now() };
  if (ghosts) {
    // The chain that was there swings away to the other side, about the near satellite.
    const side = kind === "in-right" ? -1 : 1;
    chain.rows.forEach(({ sky }, i) => {
      (ghosts[i] || ghosts[0] || []).forEach(({ moon, d }) => {
        swing(moon, d, side);
        moon.style.animation = `sat-swing-out ${SWING_MS}ms ${SWING_EASE} forwards`;
        sky.append(moon);
        setTimeout(() => moon.remove(), SWING_MS + 100);
      });
    });
  }
  flying();
  placeChain();
}
const SWING_MS = 720;
const SWING_EASE = "cubic-bezier(.45, 0, .2, 1)";
// How far a satellite at depth d swings: almost nothing at the near end, more at the far end, never so far

function swing(moon, d, side) {

  moon.style.setProperty("--lift", `${Math.round(-side * (4 + d * 9))}px`);   // right goes with up, left with down
}
// Give every satellite in place its part of a swing under way (a chain redrawn in the middle of it goes on
// from where the move has got to). A fall needs nothing here: `placeChain()` draws it.
function flying() {
  const fly = chain.fly;
  const chosen = state.themes;
  if (!fly || !chosen || fly.kind === "sat-fall") return;
  const gone = performance.now() - fly.started;
  if (gone > FLY_MS) { chain.fly = null; return; }
  for (const row of chain.rows) {
    row.moons.forEach((moon, k) => {
      swing(moon, clamp(depthOf(k, chosen.roll), 0, CHAIN_SHOWN - 1), fly.kind === "in-right" ? 1 : -1);
      moon.style.animation = `sat-swing-in ${SWING_MS}ms ${SWING_EASE} ${Math.round(-gone)}ms backwards`;
    });

}
// One row's satellites fall into place, the near one first (a topic that joins the others).
function fallRow(row) {

  row.fall = performance.now();
  chain.busy = true;
}
// Copies of the satellites that show now, to send away once the chain is redrawn.
function ghostChain() {
  const chosen = state.themes;
  return chain.rows.map(({ moons }) => moons.map((moon, k) => ({ moon, d: depthOf(k, chosen.roll) }))
    .filter(({ moon }) => Number(moon.style.opacity) > .05)
    .map(({ moon, d }) => {
      const copy = moon.cloneNode(true);
      copy.classList.add("th-ghost");

// Out of the Themes view: the satellites go back to stars and rise away, the far one first, while the Earth
// goes back up. `was` is the view that was open.
function flyAway(was) {

  chain.popTo = null;
  chain.pop.clear();
  for (const row of chain.rows) row.fall = null;
  chain.away = { started: performance.now(), chosen: was };
}

// Into a theme: its sub-themes take the chain's place. And back out again, to where the themes' chain stood.
function goInside() {
  const chosen = state.themes;
  if (!chosen || chosen.inside || chosen.roll !== chosen.to) return;
  if (!insideOf(chosen.rows.map((id) => state.points.get(id)), chosen.key).length) return;
  chosen.back = { trail: chosen.trail, seen: chosen.seen };
  chosen.trail = new Set();
  chosen.seen = new Set();
  chosen.inside = chosen.key;
  chosen.sub = null;

  flyChain("in-right", ghosts);
}
function goOut() {
  const chosen = state.themes;
  if (!chosen?.inside) return;
  chosen.inside = null;
  chosen.sub = null;
  if (chosen.back) ({ trail: chosen.trail, seen: chosen.seen } = chosen.back);
  chosen.back = null;
  const ghosts = ghostChain();
  drawThemes();
  flyChain("in-left", ghosts);
}

// Which chain is shown. When it changes (in, out, or a row left and took a sub-theme with it) it starts at rest.
function setList(chosen, points) {
  const subs = chosen.inside ? insideOf(points, chosen.inside) : [];
  if (chosen.inside && !subs.length) goOutQuietly(chosen);
  const list = chosen.inside ? subs : THEMES;
  const same = chosen.list.length === list.length && chosen.list.every((one, k) => one.key === list[k].key);
  if (same) return;
  chosen.list = list;
  const at = Math.max(0, list.findIndex((one) => one.key === (chosen.inside ? chosen.sub : chosen.key)));

function goOutQuietly(chosen) {

  chosen.sub = null;
  if (chosen.back) ({ trail: chosen.trail, seen: chosen.seen } = chosen.back);
  chosen.back = null;
}

// Roll the chain until `to` is at the front (a whole number; it may be past either end: the chain goes round).
function rollTo(to) {
  const chosen = state.themes;
  popChain(null);
  chosen.to = Math.round(to);
  if (reduced) rollThemes(performance.now());
}

// Called every frame: the chain moves toward where it was sent; the Earth rolls with it.
function rollThemes(now) {
  const chosen = state.themes;
  // Its own clock, so a slow device still rolls a theme in about a second.
  const dt = Math.min((now - chain.last) / 1000, .4);
  chain.last = now;
  if (chain.away) {
    if (!placeChain(now)) chain.away = null;
    return;
  }
  if (!chosen) return;
  const popped = easePops(dt);
  if (!chain.drag && chosen.roll !== chosen.to) {
    const gap = chosen.to - chosen.roll;
    const from = chosen.roll;
    chosen.roll = reduced || Math.abs(gap) < .004 ? chosen.to : chosen.roll + gap * (1 - Math.exp(-dt * 5));
    rolledOver(from, chosen.roll);
    if (chosen.roll === chosen.to) settleChain();
    else placeChain(now);
  } else if (popped || chain.busy) chain.busy = placeChain(now);

}

// The parts of the line the chain has rolled along: a part is done once the chain is past its middle.
function rolledOver(from, to) {
  const a = Math.floor(Math.min(from, to) + .5);
  const b = Math.floor(Math.max(from, to) + .5);
  for (let k = a; k < b; k += 1) state.themes.trail.add(mod(k, state.themes.list.length));
}

function settleChain() {
  const chosen = state.themes;
  const n = chosen.list.length;
  chosen.roll = chosen.to = mod(chosen.to, n);
  if (!turn && state.restQ) globeQ.copy(state.restQ);
  const key = chosen.list[chosen.roll].key;
  const was = chosen.inside ? chosen.sub : chosen.key;
  chosen.seen.add(was);
  if (key === was) return placeChain();
  if (chosen.inside) chosen.sub = key;
  else chosen.key = key;
  chosen.seen.add(key);
  drawThemes();
}

function holdChain(event) {
  if (event.button > 0 || chain.drag || !state.themes) return;
  const sky = event.currentTarget;
  chain.dragged = false;
  const drag = { id: event.pointerId, y: event.clientY, roll: state.themes.roll, last: event.clientY, at: event.timeStamp, speed: 0, on: false };
  const move = (e) => {
    if (e.pointerId !== drag.id) return;
    if (!drag.on) {
      if (Math.abs(e.clientY - drag.y) < 7) return;
      drag.on = true;
      chain.drag = drag;
      popChain(null);
      chain.dragged = true;
      if (turn) { globeQ.copy(turn.to); turn = null; }
      sky.classList.add("held");
      sky.setPointerCapture?.(drag.id);
    }
    const chosen = state.themes;
    const from = chosen.roll;
    const dt = Math.max(1, e.timeStamp - drag.at);
    drag.speed = drag.speed * .6 + (e.clientY - drag.last) / dt * .4;
    drag.last = e.clientY;
    drag.at = e.timeStamp;
    chosen.roll = drag.roll + (e.clientY - drag.y) / CHAIN_STEP;
    rolledOver(from, chosen.roll);
    placeChain();
  };
  const up = (e) => {
    if (e.pointerId !== drag.id) return;
    sky.removeEventListener("pointermove", move);
    sky.removeEventListener("pointerup", up);
    sky.removeEventListener("pointercancel", up);
    sky.classList.remove("held");
    if (!drag.on) return;
    chain.drag = null;
    const chosen = state.themes;
    if (!chosen) return;
    // A quick flick carries on to the next theme.
    const carry = clamp(drag.speed * 160 / CHAIN_STEP, -1.2, 1.2);
    chosen.to = Math.round(chosen.roll + carry);
    if (chosen.to === chosen.roll) settleChain();
    setTimeout(() => { chain.dragged = false; }, 0);
  };
  sky.addEventListener("pointermove", move);
  sky.addEventListener("pointerup", up);
  sky.addEventListener("pointercancel", up);
}

function wheelChain(event) {
  event.preventDefault();
  // One turn of the wheel, or one swipe on a trackpad, rolls one theme. A swipe goes on sending for a second
  // after the fingers lift: all of that is the same swipe, so it counts once (five steps would come back round).
  const fresh = event.timeStamp - chain.wheelAt > 180;
  chain.wheelAt = event.timeStamp;
  if (!fresh || Math.abs(event.deltaY) < 4) return;
  rollTo(state.themes.to + (event.deltaY > 0 ? 1 : -1));
}

function themeRow(point, i, points) {
  const chosen = state.themes;
  const row = node("section", "th-row");
  row.style.setProperty("--row", ROW_COLOR[i]);
  row.setAttribute("aria-label", point.name);
  const sky = node("div", chosen.inside ? "th-sky inside" : "th-sky");
  const moons = [];
  const now = chosen.inside ? chosen.sub : chosen.key;
  chosen.list.forEach((theme, k) => {
    const has = Boolean(chosen.inside ? subDoor(point, chosen.inside, theme.key) : doorOf(point, theme.key));
    const more = !chosen.inside && insideOf(points, theme.key).length > 0;
    const moon = node("button", `th-moon${has ? "" : " none"}${more ? " deep" : ""}`);
    moon.type = "button";
    moon.innerHTML = `<i><em></em><svg viewBox="0 0 24 24" aria-hidden="true">${theme.icon}</svg><b></b></i>`;
    const tint = THEME_TINT[theme.key] || THEME_TINT[chosen.inside] || THEME_TINT.facts;
    moon.style.setProperty("--day", tint[0]);
    moon.style.setProperty("--dusk", tint[1]);

    moon.setAttribute("aria-label", has ? `${theme.name}, ${point.name}` : t("{theme}, {name}: nothing yet", { theme: theme.name, name: point.name }));
    moon.addEventListener("click", () => {
      if (chain.dragged) return;
      const d = depthOf(k, chosen.roll);
      // The theme already at the front, picked again: go inside it.
      // Inside a theme, the sub-theme at the front picked again: back out to the themes.
      const still = Math.abs(d) < .01 && chosen.roll === chosen.to;

    name.append(badge);

    const plus = node("button", "th-plus", "+");
    plus.type = "button";
    plus.title = t("Compare with another place");

    else themeDoor(body, cmp, point.themes?.find((one) => one.key === theme.key), theme);

}

// One more row: pick the topic to put beside the others.
function pickRow() {
  const chosen = state.themes;
  const row = node("section", "th-row th-add");
  const door = node("article", "th-door");
  const name = node("header", "th-name");
  name.append(node("span", "", t("Compare with…")));
  const shut = node("button", "", "×");
  shut.type = "button";
  shut.setAttribute("aria-label", t("Do not add a topic"));
  shut.addEventListener("click", () => { chosen.adding = false; drawThemes(); });
  name.append(shut);
  const input = node("input");
  input.type = "search";
  input.placeholder = t("Find a country…");
  input.autocomplete = "off";
  input.setAttribute("aria-label", t("Find a country to compare with"));
  const body = node("div", "th-body");
  const list = (term) => {
    const text = term.trim().toLowerCase();
    const free = (point) => hasThemes(point) && !chosen.rows.includes(point.id);
    const ids = text
      ? [...state.points.values()].filter((point) => free(point) && named(point, text))
        .sort((a, b) => a.name.toLowerCase().indexOf(text) - b.name.toLowerCase().indexOf(text) || a.name.localeCompare(b.name))
        .slice(0, 12).map((point) => point.id)
      : (state.answers.get(chosen.rows[0])?.get("next.out") || []).map((answer) => answer.id)
        .filter((id) => free(state.points.get(id))).slice(0, 8);
    const parts = [node("h4", "", text ? (ids.length ? t("Countries") : t("Nothing by that name yet")) : (ids.length ? t("Next to it") : t("Type a name")))];
    for (const id of ids) {
      const button = node("button", "", state.points.get(id).name);
      button.type = "button";
      button.addEventListener("click", () => {
        chosen.rows.push(id);
        chosen.adding = false;
        drawThemes(true);
      });
      parts.push(button);
    }
    body.replaceChildren(...parts);
  };
  input.addEventListener("input", () => list(input.value));
  list("");
  door.append(name, input, body);
  row.append(node("div", "th-sky"), door);
  if (stage.clientWidth > 680) requestAnimationFrame(() => input.focus());
  return row;
}

function drawThemes(moved = false) {
  const chosen = state.themes;
  chosen.rows.length = Math.min(chosen.rows.length, mostRows());
  if (chosen.rows.length >= mostRows()) chosen.adding = false;
  const points = chosen.rows.map((id) => state.points.get(id));
  // A chain redrawn while it was held never hears the hand let go: let go for it, or nothing rolls again.
  if (chain.drag) {
    chain.drag = null;
    chain.dragged = false;
    chosen.to = Math.round(chosen.roll);
  }
  setList(chosen, points);
  const stood = new Map(chain.rows.filter((row) => row.sky.isConnected).map((row) => [row.id, row.sky.getBoundingClientRect().left]));
  chain.rows = [];
  chain.top = 0;
  const parts = points.map((point, i) => themeRow(point, i, points));
  if (chosen.adding) parts.push(pickRow());
  const box = $("th-rows");
  box.style.setProperty("--cols", parts.length);
  box.replaceChildren(...parts);
  if (moved) chain.tall = null;
  levelRows();
  placeChain();
  flying();
  if (!reduced && !chain.fly && stood.size) {
    for (const row of chain.rows) {
      const door = row.sky.nextElementSibling;
      if (!stood.has(row.id)) {
        // A topic that joins the others arrives as the first one did: its satellites fall, its door rises.
        fallRow(row);
        door.classList.add("rise");
        continue;
      }
      // A row that has to make room moves over with a sway: the near satellite first, the others after it.
      const shift = Math.round(stood.get(row.id) - row.sky.getBoundingClientRect().left);
      if (Math.abs(shift) < 3) continue;
      row.moons.forEach((moon, k) => {
        const d = clamp(depthOf(k, chosen.roll), 0, CHAIN_SHOWN - 1);
        moon.style.setProperty("--shift", `${shift}px`);
        moon.style.animation = `sat-shift 460ms ${FLY_EASE} ${Math.round(d * 60)}ms backwards`;
      });
      door.style.setProperty("--shift", `${shift}px`);
      door.classList.add("shift");
    }
  }
  drawYear();
  themesHash();
  if (moved) {
    chain.tall = null;   // other topics, other heights
    aimThemes();
    lit.dirty = true;
  }
}

function bindUI() {
  $("th-back").addEventListener("click", leaveThemes);
  $("close").addEventListener("click", closePanel);
  // The handle's travel is not even: most of what we know is recent, so the years near now get most of the
  // bar and the far years rush by (half the bar is the last quarter of the years).
  // One handle, in the bar (the drawer's long one went: Owner, 2026-11-16).
  {
    const range = $("th-range");
    range.min = 0;
    range.max = 1000;
    range.addEventListener("input", () => {
      const at = timeOfBar(Number(range.value) / 1000);
      if (at.age != null) setDeep(at.age);
      else setYear(at.year);
    });
    // Let go in deep time: the handle settles on the map's stop.
    range.addEventListener("change", () => {
      range.value = Math.round(1000 * barOfTime());
      if (state.deep != null || state.year != null) placeWhenTag();
    });
    // The arrow keys still go one year at a time; in deep time one map at a time, into it from 1960.
    range.addEventListener("keydown", (event) => {
      const step = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1 }[event.key];
      if (!step) return;
      event.preventDefault();
      const n = deep.ages.length;
      const share = deepShare();
      if (state.deep != null) {
        const i = deep.ages.indexOf(state.deep) + step;
        if (i >= n) setYear(YEAR_FIRST);
        else if (i >= 0) setDeep(deep.ages[i]);
      } else if (step < 0 && share > 0 && (share === 1 || (state.year ?? YEAR_NOW) <= YEAR_FIRST)) {
        setDeep(deep.ages[n - 1]);
      } else if (!(step > 0 && share === 1)) {   // a phone's deep bar ends at 1960
        setYear((state.year ?? YEAR_NOW) + step);
      }
      range.value = Math.round(1000 * barOfTime());
      if (state.deep != null || state.year != null) placeWhenTag();
    });
    addEventListener("resize", drawYear);
  }
  $("panel-body").addEventListener("scroll", moreBelow, { passive: true });
  $("panel-grip").addEventListener("click", () => setTall(!$("panel").classList.contains("tall")));
  const search = $("search");
  search.addEventListener("focus", () => drawResults(search.value));
  search.addEventListener("input", () => drawResults(search.value));
  // On a narrower screen search is a button; tapped, its box takes the bar's row until it is done with.
  const finding = (on) => {
    $("top").classList.toggle("finding", on);
    if (on) search.focus();
  };
  $("search-open").addEventListener("click", () => finding(true));

    const top = typing ? 0 : Math.max(0, Math.round(vv ? vv.offsetTop : 0));

  setInterval(fit, 1000);
