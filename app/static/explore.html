    const dx = now.x - was.x;
    const dy = now.y - was.y;
    turnBy(dx, dy);
    const t = performance.now();
    const dt = Math.max(8, t - grab.lastMove) / 1000;
    grab.lastMove = t;
    grab.velocity = { x: dx / dt, y: dy / dt };
  });
  const release = (event) => {
    if (!grab.ids.has(event.pointerId)) return;
    grab.ids.delete(event.pointerId);
    if (grab.ids.size) {
      grab.pinch = 0;
      return;
    }
    stage.classList.remove("grabbing");
    if (event.type === "pointercancel") return;
    if (!grab.moved && performance.now() - grab.start.t < 600) {
      tapAt(event.clientX, event.clientY);
    } else if (grab.moved && !reduced && grab.velocity && performance.now() - grab.lastMove < 80) {
      grab.fling = { ...grab.velocity };
    }
    grab.velocity = null;
  };
  stage.addEventListener("pointerup", release);
  stage.addEventListener("pointercancel", release);
  // A mouse passing over the bare Earth: the name of the place under it, asked at most once a frame.
  let overAt = null;
  let overAsked = false;
  stage.addEventListener("pointermove", (event) => {
    if (event.pointerType === "touch") return;
    if (grab.ids.size || event.buttons || !bare(event.target) || state.themes) {
      overAt = null;
      setOver(null);
      return;
    }
    overAt = { x: event.clientX, y: event.clientY };
    if (overAsked) return;
    overAsked = true;
    requestAnimationFrame(async () => {
      const ask = overAt;
      const id = ask ? await topicUnder(ask.x, ask.y, false) : null;
      overAsked = false;
      setOver(overAt ? id : null);
    });
  });
  stage.addEventListener("pointerleave", () => { overAt = null; setOver(null); });
  // A mouse wheel, or a trackpad pinch (which browsers send as a wheel with Ctrl held).
  stage.addEventListener("wheel", (event) => {
    event.preventDefault();
    const step = event.ctrlKey ? .01 : .0015;
    const lines = event.deltaMode === 1 ? 16 : 1;
    setZoom(view.zoom * Math.exp(-event.deltaY * lines * step));
  }, { passive: false });
  // Safari on a Mac sends a trackpad pinch as its own gesture events.
  let gestureFrom = 1;
  stage.addEventListener("gesturestart", (event) => { event.preventDefault(); gestureFrom = view.zoom; });
  stage.addEventListener("gesturechange", (event) => {
    event.preventDefault();
    if (grab.ids.size < 2) setZoom(gestureFrom * event.scale);
  });
}

// What is under the finger: a mark first (a city, a tiny country), else the area picture at that spot.
const raycaster = new THREE.Raycaster();
const ball = new THREE.Sphere(new THREE.Vector3(), 1);
const hitAt = new THREE.Vector3();
let areaPixels = null;   // the area picture, decoded once on the first tap
let offEarth = false;    // the last tap fell outside the Earth, on empty space
function areaReader() {
  if (areaPixels) return areaPixels;
  const name = state.earthFiles?.areas;
  if (!name) return Promise.resolve(null);
  areaPixels = fetch(`./earth/${name}`)
    .then((r) => r.blob())
    .then((blob) => createImageBitmap(blob, { colorSpaceConversion: "none", premultiplyAlpha: "none" }))
    .then((bitmap) => {
      const canvas = document.createElement("canvas");
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(bitmap, 0, 0);
      return ctx;
    })
    .catch((error) => { console.warn("Area picture could not be read.", error); return null; });
  return areaPixels;
}
// `tap` false (the mouse just passing over) leaves `offEarth` to the taps.
async function topicUnder(clientX, clientY, tap = true) {
  const at = stage.getBoundingClientRect();
  const x = clientX - at.left;
  const y = clientY - at.top;
  let best = null;
  for (const mark of state.marks) {
    const d = Math.hypot((mark.x ?? -99) - x, (mark.y ?? -99) - y);
    if ((mark.alpha || 0) > .5 && d < 18 && (!best || d < best.d)) best = { d, id: mark.id };
  }
  if (best) return best.id;
  if (tap) offEarth = false;
  if (!renderer) return null;
  const box = $("globe").getBoundingClientRect();
  raycaster.setFromCamera({ x: (clientX - box.left) / box.width * 2 - 1, y: -((clientY - box.top) / box.height * 2 - 1) }, camera);
  ball.center.copy(world.position);
  if (!raycaster.ray.intersectSphere(ball, hitAt)) {
    if (tap) offEarth = true;
    return null;
  }
  hitAt.sub(world.position).applyQuaternion(unturnQ.copy(globeQ).invert());
  const lat = Math.asin(clamp(hitAt.y, -1, 1)) * 180 / Math.PI;
  const lon = Math.atan2(hitAt.x, hitAt.z) * 180 / Math.PI;
  const ctx = await areaReader();
  if (!ctx) return null;
  const { width, height } = ctx.canvas;
  const px = ctx.getImageData(clamp(Math.floor((lon + 180) / 360 * width), 0, width - 1),
    clamp(Math.floor((90 - lat) / 180 * height), 0, height - 1), 1, 1).data;
  const code = px[0] + 256 * px[1];
  const index = code > 0 ? code : (px[2] % 8 ? 300 + (px[2] % 8) : 0);
  return state.byArea.get(index) || null;
}
async function tapAt(clientX, clientY) {
  const id = await topicUnder(clientX, clientY);
  const now = performance.now();
  const again = grab.lastTap && grab.lastTap.id === id && now - grab.lastTap.t < 400;
  grab.lastTap = { id, t: now };
  if (!id && offEarth) return restHere();
  if (!id) return;
  awake();
  if (again) {
    grab.lastTap = null;
    return go(id, { card: true });
  }
  // The topic you are on already wears its name: one tap puts out what else was being looked at, or, with
  // nothing else lit, opens its card.
  if (id === state.centre) {
    if (!state.peek?.id) return showCard(id);
    state.peek = state.peek.list ? { list: state.peek.list } : null;
    for (const el of toks.values()) el.classList.toggle("peeked", el.dataset.slot === state.peek?.list);
    for (const row of $("panel-body").querySelectorAll(".rows li.chosen")) row.classList.remove("chosen");
    drawMarks();
    return;
  }
  const answers = state.answers.get(state.centre);
  const key = [...answers.keys()].find((k) => answers.get(k).some((a) => a.id === id));
  lookAt(id, key || null, true);
}

const spinStep = new THREE.Quaternion();
const UP = new THREE.Vector3(0, 1, 0);
const skyStep = new THREE.Quaternion();
const sunSky = new THREE.Vector3();
const moonSky = new THREE.Vector3();

// Resting = the reader has not picked anything yet (the first look) or asked for rest (a tap on empty space),
// and has left it untouched for a while, nothing open on a phone. (With reduced motion the Earth still brightens at rest, but stays still.)
function resting(now) {
  // Not while the time machine is away from now: the Earth stays where the reader left it (Owner, 2026-11-18).
  return state.centre && state.asleep && !state.themes && !intro.active && state.year == null && state.deep == null
    && !(state.peek && stage.clientWidth <= 680 && $("panel").classList.contains("open"))
    && !$("results").classList.contains("open")
    && !$("sky-box").classList.contains("open")
    && now - state.lastTouch > IDLE_MS;
}

// A tap on empty space, outside the Earth, means "let it rest": the card closes, the Earth turns back to
// the current topic at its full size and the time-lapse starts at once, on any topic, not only on mine.
// It goes on resting there (again after each quiet spell) until the reader picks or points at something.
function restHere() {
  if (!state.centre || state.themes) return;
  closePanel();   // no card at rest, on any screen (Owner, 2026-11-16)
  setHover(null);
  state.asleep = true;
  state.userTurned = false;
  state.spin = 0;
  state.spun = false;
  grab.fling = null;
  if (state.restQ) {
    state.aimQ = state.restQ;
    if (reduced) {
      globeQ.copy(state.restQ);
      turn = null;
    } else {
      const angle = globeQ.angleTo(state.restQ);
      turn = angle < 1e-3 ? null
        : { from: globeQ.clone(), to: state.restQ.clone(), started: performance.now(), duration: clamp(500 + angle * 420, 600, 1500) };
    }
  }
  if (Math.abs(view.zoom - 1) > .02) view.zoomAnim = { from: view.zoom, to: 1, started: performance.now() };
  state.lastTouch = performance.now() - IDLE_MS;
}

// One bad frame must not be the last one: the loop that calls this stops for good when a frame throws.
function drawSafely(now) {
  try {
    animate(now);
  } catch (error) {
    console.error(error);
  }
}

function animate(now) {
  const dt = Math.min((now - lastFrame) / 1000, .05);
  lastFrame = now;
  const rest = resting(now);
  if (view.zoomAnim) {
    const p = clamp((now - view.zoomAnim.started) / 600, 0, 1);
    view.zoom = view.zoomAnim.from + (view.zoomAnim.to - view.zoomAnim.from) * (1 - Math.pow(1 - p, 3));
    if (view.zoom > SHARP_AT) loadSharp();
    if (p === 1) view.zoomAnim = null;
    applyCamera();
  }
  if (view.sheetAnim) {
    // (A frame's time can be a little before the motion's start: unclamped, the ease overshoots backwards.)
    const p = clamp((now - view.sheetAnim.started) / 500, 0, 1);
    view.sheet = view.sheetAnim.from + (view.sheetAnim.to - view.sheetAnim.from) * (1 - Math.pow(1 - p, 3));
    if (p === 1) view.sheetAnim = null;
    applyCamera();
  }
  if (view.lowAnim) {
    const p = clamp((now - view.lowAnim.started) / 800, 0, 1);
    view.low = view.lowAnim.from + (view.lowAnim.to - view.lowAnim.from) * (1 - Math.pow(1 - p, 3));
    if (p === 1) {
      view.lowAnim = null;
      if (!view.low) appBox.classList.remove("themes-on");   // the question ring comes back once the globe is up
      if (!view.low && !state.themes) { $("themes").hidden = true; $("themes").classList.remove("leaving"); }
    }
    applyCamera();
  }
  if (grab.fling && !grab.ids.size) {
    turnBy(grab.fling.x * dt, grab.fling.y * dt);
    const keep = Math.exp(-dt * 4);
    grab.fling.x *= keep;
    grab.fling.y *= keep;
    if (Math.hypot(grab.fling.x, grab.fling.y) < 8) grab.fling = null;
  }
  if (turn) {
    const progress = clamp((now - turn.started) / turn.duration, 0, 1);
    globeQ.slerpQuaternions(turn.from, turn.to, 1 - Math.pow(1 - progress, 3));
    if (progress === 1) turn = null;
  } else if (rest && !reduced && !grab.ids.size && !grab.fling) {
    // The time-lapse: the Earth turns on its own axis at the clock's speed,
    // so the Sun, Moon and stars stay put while the ground turns under them.
    state.spin = Math.min(1, state.spin + dt / 2.5);
    globeQ.multiply(spinStep.setFromAxisAngle(UP, 2 * Math.PI / DAY_SECONDS * state.spin * dt));
    state.spun = true;
  }
  rollThemes(now);
  if (intro.active) tickIntro(now);
  else tickClock(now, dt, rest && !turn && !reduced);
  tickClouds(dt);
  tickLights(dt);
  tickIce(dt);
  // The opening and the quiet spell after it keep the Earth's full look (no dimming before the rest begins).
  // (Counted from the questions showing, as the rest's own wait is: no gap where the clouds clear.)
  const show = rest || intro.active || (state.asleep && intro.ended && now - (intro.calm || now) < IDLE_MS + 100);
  look.quiet = clamp(look.quiet + (show ? -dt / 1.2 : dt / .5), 0, 1);
  intro.ui = clamp(intro.ui + (intro.active ? -1 : dt / .8), 0, 1);
  place(now);
  if (!renderer) return;
  globeGroup.quaternion.copy(globeQ);
  // The sky frame → the globe's frame: turn back by how far the Earth has turned.
  // (In the opening the sky goes round the view on its own, from the rest view's sky; cut short, it eases back.)
  skyBase.copy(globeQ);
  if (intro.active && intro.turn) skyBase.copy(intro.turn).multiply(state.restQ);
  else if (intro.skyBack) {
    const p = clamp((now - intro.skyBack.started) / 900, 0, 1);
    skyBase.slerpQuaternions(intro.skyBack.from, globeQ, eased(p));
    if (p === 1) intro.skyBack = null;
  }
  skyQ.copy(skyBase).multiply(skyStep.setFromAxisAngle(UP, -gmst(clock.t)));
  sky.quaternion.copy(skyQ);
  sunW.fromArray(sunDir(clock.t)).applyQuaternion(skyQ);
  sunLocal.copy(sunW).applyQuaternion(unturn.copy(globeQ).invert());
  moonSky.fromArray(moonDir(clock.t));
  moonW.copy(moonSky).applyQuaternion(skyQ);
  placeMoon();
  placeSun();
  const u = planet.material.uniforms;
  if (lit.dirty) applyLit();
  for (let i = 0; i < 4; i += 1) lit.amt[i] += (lit.want[i] - lit.amt[i]) * Math.min(1, dt * 5);
  u.uLayerAmt.value.set(...lit.amt.map((amt) => amt * intro.ui));
  u.uQuiet.value = look.quiet;
  // (In the opening, today's real clouds come in with the next morning.)
  // Clouds come in over .8 s; just after an opening that ended at night (no clouds in its first two acts), slowly,
  // so they drift in rather than appear as the rest begins (Owner, 2026-11-17).
  const cloudsIn = intro.ended && now - intro.ended < 5000 ? 3 : .8;
  look.clouds = clamp(look.clouds + (state.year == null && state.deep == null && (!intro.active || intro.act === 3) ? dt / cloudsIn : -dt / .5), 0, 1);
  introLook(u, now, dt);
  tickDeep(u, dt);
  u.uClouds.value = LOOK.clouds * look.clouds;
  if (state.earthBorn) u.uReady.value = smooth(0, 1, (now - state.earthBorn) / 900);
  if (stars) stars.material.uniforms.uBright.value = (1 - .45 * look.quiet) * intro.birth;
  atmosphere.material.uniforms.uRim.value = LOOK.rim * intro.birth * intro.air;
  atmosphere.material.uniforms.uHot.value = LOOK.hotAir * intro.birth * intro.hot;
  look.allLit = clamp(look.allLit + (state.allLit && !intro.active ? dt / .6 : -dt / .6), 0, 1);
  u.uAllLit.value = atmosphere.material.uniforms.uAllLit.value = eased(look.allLit);
  renderer.render(scene, camera);
}

// The Moon at its real direction, closer and bigger than life so it fits.
// It steps aside (fades) rather than cover the Earth's face.
function placeMoon() {
  moon.position.copy(moonW).multiplyScalar(LOOK.moonAt);
  moon.lookAt(world.position);
  const across = Math.hypot(moonW.x, moonW.y) * LOOK.moonAt;
  const inFront = moonW.z > 0 ? smooth(1.05, 1.3, across) : 1;
  moon.material.uniforms.uAlpha.value = inFront * (1 - .4 * look.quiet) * intro.birth;
  moon.visible = inFront > .01;
}

// The Sun is far off screen: a soft glow at the stage's edge on its side.
function placeSun() {
  const el = $("sun-glow");
  const across = Math.hypot(sunW.x, sunW.y);
  const alpha = smooth(.08, .5, across) * (1 - .4 * look.quiet) * intro.birth * (1 - look.allLit);
  el.style.opacity = alpha.toFixed(3);
  if (alpha < .01) return;
  const frame = globeFrame();
  const W = stage.clientWidth;
  const H = stage.clientHeight;
  const ux = sunW.x / across;
  const uy = -sunW.y / across;
  const tx = ux > 0 ? (W - frame.x) / ux : ux < 0 ? -frame.x / ux : Infinity;
  const ty = uy > 0 ? (H - frame.y) / uy : uy < 0 ? -frame.y / uy : Infinity;
  const t = Math.min(tx, ty);
  el.style.transform = `translate3d(${(frame.x + ux * t).toFixed(1)}px, ${(frame.y + uy * t).toFixed(1)}px, 0) translate(-50%, -50%)`;
}

/* ---------- the real clouds of the last day ----------
   The server fetches one world cloud picture an hour (scripts/build_clouds.py)
   and lists them in /earth/clouds/clouds.json. Where there is no such list
   (the public static site), or it has gone stale, the one-day picture stays.
   - The clock at a moment the pictures cover: the clouds of that moment.
     Between two hours the clouds slide along the motion the server worked
     out for that hour (flow-*.png), so they move rather than fade. Near the
     hour mark the motion is blended with the neighbouring hour's, so speed
     and heading do not jump. Past the newest picture they carry on along the
     last hour's motion (CLOUDS_CARRY), because each picture comes out an hour
     or two late.
   - The time-lapse runs on into hours that have not happened: it replays the
     held day, starting from the newest picture, and says so. From the newest
     back round to the oldest, the newest carries on while the oldest slides in.
   - Any other moment: the one-day picture.
   Smoothness: once real clouds are in use, the whole day is fetched one picture
   at a time, decoded off the main thread (createImageBitmap) as one-channel
   textures (a quarter of the memory; half the width on a phone), uploaded one
   per frame ahead of use, and kept until the list drops them, so the time-lapse
   never waits on a picture or fetches it again. */

const HOUR = 3600000;
const CLOUDS_STALE = 6 * HOUR;   // a newest picture older than this is not "now"
const CLOUDS_CARRY = 2 * HOUR;   // how long the newest clouds carry on along their last motion
const CLOUDS_WIDE = Math.min(screen.width, screen.height) < 700 ? 1024 : 2048;   // a phone holds half-width pictures
const clouds = {
  hours: [],        // { t, file, flow }, oldest first
  newest: null,     // { t, file }: the newest hour again, sharper
  kept: new Map(),  // file -> texture (uploaded), or "loading"
  flows: new Map(), // file -> the motion texture of an hour, or "loading" (small: all are kept)
  uploads: [],      // [file, texture] decoded and waiting to go to the graphics card, one a frame
  dayAsked: false,  // the whole day has been asked for
  anchor: null,     // the clock's moment when the replay began
  lead: 0,          // hours the newest picture had been carried on when the replay began
  shows: "one",     // what is drawn: "real" | "replay" | "one"
  at: 0,            // the moment of the clouds drawn
  carried: 0,       // how far past the newest picture they were carried on (ms)
};

async function loadClouds() {
  try {
    const response = await fetch("./earth/clouds/clouds.json", { cache: "no-store" });
    if (!response.ok) return;
    const index = await response.json();
    clouds.hours = (index.hours || []).map((hour) => ({ t: Date.parse(hour.at), file: hour.file, flow: hour.flow || null }))
      .filter((hour) => Number.isFinite(hour.t));
    clouds.newest = index.newest ? { t: Date.parse(index.newest.at), file: index.newest.file } : null;
    clouds.edge = index.edge_latitude || 73;
    if (index.flow) clouds.flowCell = [1 / (index.flow.scale * index.flow.width), -1 / (index.flow.scale * index.flow.height)];
    // Let go of pictures and motions the list no longer holds; ask for the new hour.
    const listed = new Set(clouds.hours.flatMap((hour) => [hour.file, hour.flow]));
    if (clouds.newest) listed.add(clouds.newest.file);
    // A picture still on screen waits for the next list (its page copy is gone, it cannot be sent again).
    const shown = planet ? Object.values(planet.material.uniforms).map((uniform) => uniform.value) : [];
    for (const held of [clouds.kept, clouds.flows]) {
      for (const [file, tex] of held) {
        if (listed.has(file) || shown.includes(tex)) continue;
        if (tex && tex.dispose) tex.dispose();
        held.delete(file);
      }
    }
    clouds.dayAsked = false;
    if (!clouds.credited && clouds.hours.length) {
      clouds.credited = true;
      state.earthLayers = [...(state.earthLayers || []),
        { what: index.what, credit: index.credit, years: "the last 24 hours", licence: index.licence }];
      drawSkyCredits();
    }
  } catch (error) {
    // No list here: the one-day picture stays.
  }
}

// Fetch and decode one hour's picture into a one-channel texture; it is ready once uploaded.
async function fetchCloud(file) {
  if (clouds.kept.has(file)) return;
  clouds.kept.set(file, "loading");
  try {
    const response = await fetch(`./earth/${file}`);
    if (!response.ok) throw new Error(`${file}: ${response.status}`);
    const blob = await response.blob();
    const sharp = clouds.newest && file === clouds.newest.file;
    let bitmap = null;
    if (!sharp && CLOUDS_WIDE < 2048) {
      try {
        bitmap = await createImageBitmap(blob, { resizeWidth: CLOUDS_WIDE, resizeHeight: CLOUDS_WIDE / 2, resizeQuality: "high" });
      } catch (error) {
        bitmap = null;   // no resizing here: the full picture
      }
    }
    if (!bitmap) bitmap = await createImageBitmap(blob);
    if (clouds.kept.get(file) !== "loading") { bitmap.close(); return; }   // dropped from the list meanwhile
    const tex = new THREE.Texture(bitmap);
    tex.format = THREE.RedFormat;         // grey pictures: one channel is all the shader reads
    tex.flipY = false;                    // bitmaps upload as they are; the shader flips (cloudPic)
    tex.colorSpace = THREE.NoColorSpace;
    tex.wrapS = THREE.RepeatWrapping;     // slid clouds cross the 180° line
    tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    tex.needsUpdate = true;
    tex.onUpdate = () => bitmap.close();  // once on the graphics card, the page's copy is not needed
    clouds.uploads.push([file, tex]);
  } catch (error) {
    clouds.kept.delete(file);
  }
}

// The texture of one hour's picture, or null while it is on its way.
function cloudTexture(file) {
  const held = clouds.kept.get(file);
  if (held) return held === "loading" ? null : held;
  fetchCloud(file);
  return null;
}

// The whole held day, one picture at a time, in the order the replay meets them.
async function fetchDay() {
  clouds.dayAsked = true;
  const hours = clouds.hours;
  for (const hour of hours) {
    if (!clouds.dayAsked || clouds.hours !== hours) return;   // a new list: it asks again
    await fetchCloud(hour.file);
    if (hour.flow) flowTexture(hour.flow);
  }
}

// The motion texture of one hour, null while it is on its way, or "missing" (then the hour fades).
function flowTexture(file) {
  const held = clouds.flows.get(file);
  if (held) return held === "loading" ? null : held;
  clouds.flows.set(file, "loading");
  new THREE.TextureLoader().load(`./earth/${file}`, (tex) => {
    tex.colorSpace = THREE.NoColorSpace;
    tex.wrapS = THREE.RepeatWrapping;
    tex.generateMipmaps = false;
    tex.minFilter = THREE.LinearFilter;
    renderer.initTexture(tex);
    clouds.flows.set(file, tex);
  }, undefined, () => clouds.flows.set(file, "missing"));
  return null;
}

// Hour i to i + 1 at mix m: its motion, and the neighbour it leans to near the hour mark.
// At the mark both sides use the two hours' average, so speed and heading carry over.
function hourMotion(i, m) {
  const hours = clouds.hours;
  const n = hours.length;
  const own = hours[i].flow;
  const side = m < .5 ? (i > 0 ? hours[i - 1].flow : null) : (i + 1 < n ? hours[i + 1].flow : null);
  const k = side ? Math.abs(m - .5) : 0;
  return { flow0: own, flow1: side || own, k: [k, k], move: [m, 1 - m] };
}

function tickClouds(dt) {
  if (!renderer || !planet) return;
  const u = planet.material.uniforms;
  // One decoded picture a frame goes to the graphics card, ahead of use.
  const up = clouds.uploads.shift();
  if (up) {
    if (clouds.kept.get(up[0]) === "loading") {
      renderer.initTexture(up[1]);
      clouds.kept.set(up[0], up[1]);
    } else {
      up[1].dispose();
    }
  }
  const hours = clouds.hours;
  const n = hours.length;
  let pair = null;      // { a, b, mix, at, flow0, flow1, k: [A, B], move: [A, B], carried }
  let shows = "one";
  if (n && Date.now() - hours[n - 1].t < CLOUDS_STALE) {
    const first = hours[0].t;
    const last = hours[n - 1].t;
    const t = clock.t;
    const sharp = clouds.newest && clouds.newest.t === last && renderer.capabilities.maxTextureSize >= 4096;
    const newestFile = sharp ? clouds.newest.file : hours[n - 1].file;
    // At the clock's own pace the newest picture stays "now" as long as it is not stale (it can be 3 to 6 hours
    // old): no falling back to the 2002 day and then, as the time-lapse starts, a sudden switch to the real
    // clouds (Owner, 2026-11-17). Faster, the replay takes over 3 hours past it.
    const reach = clock.rate <= 2 && clouds.anchor === null ? CLOUDS_STALE : 3 * HOUR;
    if (t >= first && t <= last + reach) {
      clouds.anchor = null;
      shows = "real";
      if (t >= last) {
        const file = newestFile;
        const flow = n > 1 ? hours[n - 2].flow : null;   // the last hour's motion, carried on
        const carried = flow ? Math.min(t - last, CLOUDS_CARRY) : 0;
        pair = { a: file, b: file, mix: 0, at: last, flow0: flow, flow1: flow, k: [0, 0], move: [carried / HOUR, 0], carried };
      } else {
        let i = 0;
        while (i < n - 2 && hours[i + 1].t <= t) i += 1;
        const mix = clamp((t - hours[i].t) / (hours[i + 1].t - hours[i].t), 0, 1);
        pair = { a: hours[i].file, b: hours[i + 1].file, mix, at: t, carried: 0, ...hourMotion(i, mix) };
      }
    } else if (t > last && (clock.rate > 2 || clouds.anchor !== null) && n > 2) {
      // Replay: from the newest picture, round to the oldest, and on through the day.
      // It starts from the newest picture where it was shown, carried on along its last motion (not snapped
      // back): that lead holds through the first round from the newest to the oldest, which mixes it away.
      if (clouds.anchor === null) {
        clouds.anchor = t;
        clouds.lead = clouds.shows === "real" ? clouds.carried / HOUR : 0;
      }
      const firstRound = t - clouds.anchor < HOUR;
      shows = "replay";
      const pos = ((n - 1) + (t - clouds.anchor) / HOUR) % n;
      const i = Math.floor(pos);
      const j = (i + 1) % n;
      const m = pos - i;
      if (j > 0) {
        pair = { a: hours[i].file, b: hours[j].file, mix: m, at: hours[i].t + m * HOUR, carried: 0, ...hourMotion(i, m) };
      } else {
        // Round from the newest to the oldest: the newest carries on along the last motion
        // while the oldest slides in along its own; the mix eases, as the two are a day apart.
        const ease = m * m * (3 - 2 * m);
        const lead = firstRound ? clouds.lead : 0;
        pair = { a: firstRound ? newestFile : hours[i].file, b: hours[0].file, mix: ease, at: hours[i].t + m * HOUR,
          carried: lead * HOUR, flow0: hours[n - 2].flow, flow1: hours[0].flow, k: [0, 1], move: [m + lead, 1 - m] };
      }
    } else {
      clouds.anchor = null;
    }
  }
  if (pair && !clouds.dayAsked) fetchDay();
  let ready = false;
  if (pair) {
    const a = cloudTexture(pair.a);
    const b = cloudTexture(pair.b);
    const known = pair.flow0 && pair.flow1 && clouds.flowCell;
    const m0 = known ? flowTexture(pair.flow0) : "missing";
    const m1 = known ? flowTexture(pair.flow1) : "missing";
    const waiting = m0 === null || m1 === null;
    const moving = !waiting && m0 !== "missing" && m1 !== "missing";
    if (a && b && !waiting) {
      u.uCloudA.value = a;
      u.uCloudB.value = b;
      u.uCloudMix.value = pair.mix;
      u.uFlowOn.value = moving ? 1 : 0;
      if (moving) {
        u.uFlow.value = m0;
        u.uFlow1.value = m1;
        u.uFlowK.value.set(...pair.k);
        u.uFlowCell.value.set(...clouds.flowCell);
        u.uCloudMove.value.set(...pair.move);
      }
      clouds.at = pair.at;
      clouds.carried = pair.carried;
      ready = true;
    } else if (u.uLive.value > 0.01) {
      ready = true;   // the next picture is on its way: hold the one shown
    }
  }
  clouds.shows = ready ? shows : "one";
  u.uLive.value = clamp(u.uLive.value + (ready ? dt : -dt) / .8, 0, 1);
}

// One plain sentence for the sky box: which clouds these are.
function cloudWords() {
  if (state.year != null) return t("No clouds are drawn while the time machine is at {year}: the Earth shows how it changes over the years, not one day's weather.", { year: String(state.year) });
  const when = `${DAY_FMT.format(new Date(clouds.at))}, ${TIME_FMT.format(new Date(clouds.at))}`;
  const edge = t("Weather satellites cannot see past {n}° north or south, so no clouds are drawn there, and low cloud and fog mostly do not show.", { n: Math.round(clouds.edge || 73) });
  if (clouds.shows === "real" && clouds.carried > 5 * 60000) return `${t("The clouds are real: where weather satellites saw them on {when}, then moved on the way they were going, because the next picture is not out yet.", { when })} ${edge}`;
  if (clouds.shows === "real") return `${t("The clouds are real: where weather satellites saw them on {when}.", { when })} ${edge}`;
  if (clouds.shows === "replay") return `${t("These hours have not happened yet, so the clouds are the last real day played again (now {when}).", { when })} ${edge}`;
  return t("The clouds are one real day from 2002, not today's.");
}

/* ---------- city lights through the years (the time machine) ---------- */

// Each year is a factor on today's lights picture, not a new picture: the look stays, where the lights are changes.
const lights = {
  years: [],        // { year, file, made }, oldest first
  kept: new Map(),  // file -> texture, or "loading"
  shown: null,      // the entry drawn (the nearer of the two mixed)
};

async function loadLights() {
  try {
    const response = await fetch("./earth/lights/lights.json", { cache: "no-cache" });
    if (!response.ok) throw new Error(`lights ${response.status}`);
    const index = await response.json();
    lights.years = (index.years || []).filter((entry) => Number.isFinite(entry.year) && entry.file)
      .sort((a, b) => a.year - b.year);
    lights.made = index.made;
    if (planet) planet.material.uniforms.uLightMost.value = index.most || 2;
    if (lights.years.length) {
      const real = lights.years.filter((entry) => !entry.made);
      state.earthLayers = [...(state.earthLayers || []), {
        what: index.what, credit: index.credit, licence: index.licence,
        years: `${real[0].year} to ${real[real.length - 1].year}`,
      }];
      drawSkyCredits();
    }
  } catch (error) {
    // No list here: today's lights stay as they are.
  } finally {
    lights.listed = true;   // (the opening waits for the list, or for knowing there is none)
  }
}

function lightTexture(file) {
  const held = lights.kept.get(file);
  if (held) return held === "loading" ? null : held;
  lights.kept.set(file, "loading");
  new THREE.TextureLoader().load(`./earth/${file}`, (tex) => {
    tex.colorSpace = THREE.NoColorSpace;
    lights.kept.set(file, tex);
  }, undefined, () => lights.kept.delete(file));
  return null;
}

// The two entries round a year, and how far between them it is. Now = the newest year measured.
function lightsAround(year, list = lights.years) {
  const n = list.length;
  if (year == null || year >= list[n - 1].year) return [list[n - 1], list[n - 1], 0];
  if (year <= list[0].year) return [list[0], list[0], 0];
  let i = 0;
  while (list[i + 1].year <= year) i += 1;
  const a = list[i];
  const b = list[i + 1];
  return [a, b, (year - a.year) / (b.year - a.year)];
}

function tickLights(dt) {
  if (!renderer || !planet || !lights.years.length) return;
  const u = planet.material.uniforms;
  // The opening runs through the years fast: a few years only, held, so nothing loads mid-way.
  const [a, b, mix] = intro.active && intro.lights.length ? lightsAround(intro.year, intro.lights) : lightsAround(state.year);
  const ta = lightTexture(a.file);
  const tb = lightTexture(b.file);
  const ready = Boolean(ta && tb);
  if (ready) {
    u.uLightA.value = ta;
    u.uLightB.value = tb;
    u.uLightMix.value = mix;
    lights.shown = mix < .5 ? a : b;
    if (lights.kept.size > 6 && !intro.active) {
      // A phone holds few: let go of years away from the two shown.
      for (const [file, tex] of lights.kept) {
        if (file === a.file || file === b.file || tex === "loading") continue;
        tex.dispose();
        lights.kept.delete(file);
      }
    }
  }
  // Fade the factor in once the first pair has landed; hold the old pair while the next loads.
  if (ready || u.uLightA.value) u.uLightYear.value = clamp(u.uLightYear.value + dt / .6, 0, 1);
}

// One plain sentence for the sky box: whose lights these are.
function lightWords() {
  const shown = lights.shown;
  if (!shown) return t("The city lights are NASA's picture of 2016.");
  if (shown.made) return t("There is no night picture from {year}: these lights are made from the 1992 lights, dimmed by how many people lived in each country then.", { year: String(shown.year) });
  if (state.year == null) return t("The city lights are where they shone in {year}, the newest year measured.", { year: String(shown.year) });
  return t("The city lights are where they really shone in {year}, measured from space.", { year: String(shown.year) });
}

/* ---------- sea ice, month by month (the time machine; Owner, 2026-11-16) ----------
   The day picture (August 2004) has no sea ice in it: the ice of the clock's month in the time machine's year is
   painted on the sea (scripts/build_ice.py). At Now: yesterday's ice (refreshed once a day by the clouds job).
   Real from 1979 (satellites); before that the Arctic is from old ice charts and the Antarctic is made (the
   1979-1988 average), and the sky box says so. The opening's last act shows today's ice. */
const ice = {
  months: [],       // { year, month, file, made }, oldest first
  now: null,        // { day: "YYYY-MM-DD", file }: yesterday's ice, when the list has it
  kept: new Map(),  // file -> texture, or "loading"
  a: null, b: null, // the entries in uIceA / uIceB (b only while fading to it)
  fade: 0,
  listed: false,
};
const MONTH_FMT = new Intl.DateTimeFormat(DATE_LOCALE, { month: "long", year: "numeric", timeZone: "UTC" });
const NOW_DAY_FMT = new Intl.DateTimeFormat(DATE_LOCALE, { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });

async function loadIce() {
  try {
    const response = await fetch("./earth/ice/ice.json", { cache: "no-cache" });
    if (!response.ok) throw new Error(`ice ${response.status}`);
    const index = await response.json();
    ice.months = (index.months || []).filter((entry) => Number.isFinite(entry.year) && entry.month >= 1 && entry.month <= 12 && entry.file)
      .sort((p, q) => p.year - q.year || p.month - q.month);
    if (index.now && index.now.file && Number.isFinite(Date.parse(index.now.day))) {
      ice.now = { ...index.now, at: Date.parse(`${index.now.day}T12:00:00Z`), isNow: true };
    }
    ice.firstReal = index.first_real || 1979;
    if (ice.months.length) {
      const real = ice.months.filter((entry) => !entry.made);
      state.earthLayers = [...(state.earthLayers || []), {
        what: index.what, credit: index.credit, licence: index.licence,
        years: `${real[0].year} to ${ice.now ? ice.now.day.slice(0, 4) : real[real.length - 1].year}`,
      }];
      drawSkyCredits();
    }
  } catch (error) {
    // No list here: the sea stays as the day picture has it (no ice).
  } finally {
    ice.listed = true;   // (the opening waits for the list, or for knowing there is none)
  }
}

function iceTexture(file) {
  const held = ice.kept.get(file);
  if (held) return held === "loading" ? null : held;
  ice.kept.set(file, "loading");
  new THREE.TextureLoader().load(`./earth/${file}`, (tex) => {
    tex.colorSpace = THREE.NoColorSpace;
    ice.kept.set(file, tex);
  }, undefined, () => ice.kept.delete(file));
  return null;
}

// The month to show: the clock's month, in the time machine's year (or the clock's own year at Now). At Now,
// within three days of yesterday's picture, that picture. A month the list lacks: the same month, nearest year.
function iceWanted() {
  const t = intro.active ? Date.now() : clock.t;
  if ((intro.active || state.year == null) && ice.now && Math.abs(t - ice.now.at) < 3 * 86400000) return ice.now;
  if (!ice.months.length) return ice.now;
  const when = new Date(t);
  const year = intro.active ? when.getUTCFullYear() : state.year ?? when.getUTCFullYear();
  const month = when.getUTCMonth() + 1;
  let best = null;
  for (const entry of ice.months) {
    if (entry.month !== month) continue;
    if (!best || Math.abs(entry.year - year) < Math.abs(best.year - year)) best = entry;
  }
  return best;
}

function tickIce(dt) {
  if (!renderer || !planet) return;
  const u = planet.material.uniforms;
  const want = iceWanted();
  if (!want) return;
  const tex = iceTexture(want.file);
  if (!ice.a) {
    if (tex) {
      u.uIceA.value = tex;
      ice.a = want;
    }
  } else if (!ice.b && want !== ice.a && tex) {
    // Fade to the new month; while it fades the next change waits, so a fast drag never jumps.
    u.uIceB.value = tex;
    ice.b = want;
    ice.fade = 0;
  }
  if (ice.b) {
    ice.fade = Math.min(1, ice.fade + dt / .45);
    u.uIceMix.value = ice.fade;
    if (ice.fade >= 1) {
      u.uIceA.value = u.uIceB.value;
      u.uIceMix.value = 0;
      ice.a = ice.b;
      ice.b = null;
    }
  }
  if (ice.a) u.uIce.value = clamp(u.uIce.value + dt / .6, 0, 1);
  if (ice.kept.size > 8 && !intro.active) {
    // A phone holds few: let go of months away from the two drawn and the one wanted.
    for (const [file, held] of ice.kept) {
      if (held === "loading" || file === ice.a?.file || file === ice.b?.file || file === want.file) continue;
      held.dispose();
      ice.kept.delete(file);
    }
  }
}

// One plain sentence for the sky box: whose sea ice this is.
function iceWords() {
  const shown = ice.b && ice.fade >= .5 ? ice.b : ice.a;
  if (!shown) return "";
  if (shown.isNow) return t("The sea ice is the real ice of {when}, measured from space.", { when: NOW_DAY_FMT.format(new Date(shown.at)) });
  const name = MONTH_FMT.format(new Date(Date.UTC(shown.year, shown.month - 1, 15)));
  if (shown.made) {
    return t("The Arctic sea ice of {when} comes from old ice charts, ship and aircraft reports. Nobody measured the Antarctic ice then, so it is made: that month's average from {from} to {to}.",
      { when: name, from: String(ice.firstReal), to: String(ice.firstReal + 9) });
  }
  const year = state.year ?? new Date(clock.t).getUTCFullYear();
  if (shown.year !== year) return t("The sea ice is the real ice of {when}, the nearest year measured for that month.", { when: name });
  return t("The sea ice is the real ice of {when}, measured from space.", { when: name });
}

/* ---------- the opening: the Earth from its beginning to now ----------
   Once per tab (a new tab, a bookmark, a shared link; not the logo, not a reload), never with reduced motion,
   any tap or key skips it (Owner, 2026-11-16). Her fourth look, same day (after 8f63188): the Earth keeps the
   rest view's size and place from the first frame to the last; no tilt, the view stays at the topic's own
   latitude; ONE steady motion: the view goes round the Earth one way at one speed, the Sun and Moon going round
   it (as seen) at the rest view's own angle, so night is only the Sun passing behind the Earth and day its
   coming back in front. While the pictures load, the stars and the glowing young Earth come out of the dark
   in place; the motion begins once everything is in.
   1. day (the Sun coming round in front): the land changes from the young Earth (drawn: nothing older than
      750 million years is mapped) through the past eras (PALEOMAP PaleoAtlas maps, scripts/build_paleo.py) to
      today's land; the old, mostly-sea eras go by quickly;
   2. night (the Sun behind the Earth): city lights from 1960, growing year by year to the newest;
   3. day again: today's Earth, real clouds fading in, coming to rest on the topic at its real time of day.
      (Owner: keep it as today's Earth; sea ice by year goes here once it is built.)
   How the motion works: the camera stays put in code; going round the Earth is the same on screen as the Sun,
   Moon and stars going round, so the sky turns forward (day → night → day) at one speed, round the one circle
   that holds the view and the rest view's Sun: the line between day and night keeps the rest view's angle all
   the way (Owner, 2026-11-16; round the Earth's own axis it leaned one way at dusk, the other at dawn). The acts follow from where the Sun is, not from fixed shares of the time. The ground also
   drifts a little, forward, onto the topic, at the same steady pace: it starts where the old lands show best
   (the `faces` table in paleo.json), at least `INTRO.drift` and at most `INTRO.reach` degrees east of it.
   The end is the topic's real time of day, so the Sun's whole journey is fixed per topic: the opening starts
   with the Sun coming round onto the face, about a day before the end, and so lasts a little longer or shorter
   for some topics (about 3 to 5.5 seconds); an evening topic sees the Sun set again at the end, and a topic
   before its dawn ends in the dark. */

// One place to change the timing and the look. Owner, 2026-11-16: about 3 to 5 seconds, slow, one steady speed.
const INTRO = {
  pace: 8,              // the face's Sun hours per second: how fast the view goes round (one speed throughout)
  start: [6.5, 10],     // the face's Sun time it may start at: the Sun coming round onto the young Earth
  dusk: 18.5,           // the ages run while the face is lit, until the Sun is going behind the Earth;
  dawn: 29.5,           // the lights grow through its night, until the Sun comes back in front
  ease: [.5, .7],       // seconds to get going, and to come to rest (the rest view starts still)
  fade: .8,             // seconds the stars and the young Earth take to come out of the dark (the least hold)
  drift: 12,            // degrees: the least the face starts east of the topic (it drifts forward onto it) ...
  reach: 60,            // ... and the most, so the ground turns slowly
  cost: .001,           // land share given up for each degree more of turning
  wait: 4,              // the longest the opening holds for its pictures; then it is skipped
};
const intro = {
  active: false, ended: 0, ui: 1, year: null, lights: [], eras: [], tex: [],
  started: 0, t: null, go: false, act: 0, words: "", lastYear: YEAR_NOW, birth: 1, real: null, air: 1, hot: 0,
};

function wantIntro(asked) {
  const forced = new URLSearchParams(location.search).get("intro");
  if (forced === "0" || reduced || !renderer || asked.has("themes") || asked.has("age")) return false;
  intro.forced = forced === "1";
  if (intro.forced) return true;
  try { return !sessionStorage.getItem("kg-intro"); } catch { return true; }
}

// How far along (0 → 1) a steady motion is at `t` of `T` seconds: it gets going over `a` seconds, holds one
// speed, and comes to rest over the last `b`.
function steady(t, T, a, b) {
  const v = 1 / (T - a / 2 - b / 2);
  if (t <= 0) return 0;
  if (t >= T) return 1;
  if (t < a) return v * t * t / (2 * a);
  if (t <= T - b) return v * (a / 2 + t - a);
  return 1 - v * (T - t) * (T - t) / (2 * b);
}

const DEG = Math.PI / 180;
const faceQ = (lat, lon) => new THREE.Quaternion().setFromEuler(new THREE.Euler(lat, -lon, 0, "XYZ"));

function startIntro() {
  performance.mark("kg-intro-start");
  try { sessionStorage.setItem("kg-intro", "1"); } catch { /* fine */ }
  Object.assign(intro, { active: true, ui: 0, started: performance.now(), t: 0, last: null, base: clock.t, go: false, birth: 0, turn: null, skyBack: null, real: null, air: 0, calm: 0 });
  appBox.classList.add("intro", "dim-now");
  $("when-tag").classList.remove("gone");
  // Owner, 2026-11-16: it comes to rest on the Earth alone, at full size in the middle, with no card; and the
  // Earth has that size and place from the first frame (the card's shutting used to grow it during the opening).
  closePanel();
  Object.assign(view, { sheet: 0, sheetTo: 0, sheetAnim: null, zoom: 1, zoomAnim: null });
  applyCamera();
  // Where the topic is, and the rest view's own lean (kept, so the last frame is the rest view exactly).
  const face = new THREE.Vector3(0, 0, 1).applyQuaternion(state.restQ.clone().invert());
  intro.lat = Math.asin(clamp(face.y, -1, 1));
  intro.lon = Math.atan2(face.x, face.z);
  intro.lean = state.restQ.clone().multiply(faceQ(intro.lat, intro.lon).invert());
  planIntro(INTRO.drift);
  loadPaleo();
  window.addEventListener("pointerdown", skipIntro, true);
  window.addEventListener("keydown", skipIntro, true);
  window.addEventListener("wheel", skipIntro, { capture: true, passive: true });
  for (const kind of ["click", "pointerup", "dblclick"]) window.addEventListener(kind, swallowAfterSkip, true);
}

// How far east of the topic the opening starts: where the old lands show best, weighed against turning more.
function introDrift(faces) {
  if (!faces?.land?.length) return INTRO.drift;
  const at = (deg) => faces.land[Math.round((((deg + 180) % 360) + 360) % 360 / faces.step) % faces.land.length];
  let best = INTRO.drift;
  for (let d = INTRO.drift; d <= INTRO.reach; d += faces.step) {
    if (at(intro.lon / DEG + d) - INTRO.cost * d > at(intro.lon / DEG + best) - INTRO.cost * best) best = d;
  }
  return best;
}

// The opening's journey, for a start `drift` degrees east of the topic: the face's Sun time from `from` to `end`
// (the topic's real time of day the next day), at INTRO.pace hours a second, and so how long it lasts.
function planIntro(drift) {
  intro.drift = drift;
  // The topic's Sun time now (from the real clock: once the opening runs, `clock.t` is the opening's).
  // The Sun goes round in the one circle that holds the view and the rest view's Sun (Owner, 2026-11-16: the
  // line between day and night keeps one angle, the rest view's, all the way). Going round the Earth's own axis
  // instead, the line leans one way at dusk and the other at dawn, by the Sun's height over the view's equator.
  const real = intro.base + (performance.now() - intro.started);
  const sun = new THREE.Vector3().fromArray(sunDir(real))
    .applyQuaternion(state.restQ.clone().multiply(new THREE.Quaternion().setFromAxisAngle(UP, -gmst(real))));
  const side = new THREE.Vector3(sun.x, sun.y, 0);
  if (side.length() < 1e-4) side.set(-1, 0, 0);
  side.normalize();
  if (side.x > 0) side.negate();   // towards the west (the left): where the Sun goes after noon
  intro.axis = new THREE.Vector3(0, 0, 1).cross(side);
  // Where on that circle the rest view's Sun is, as the face's Sun time (12 = straight behind the viewer).
  const hour = (((12 + Math.atan2(sun.dot(side), sun.z) / DEG / 15) % 24) + 24) % 24;
  intro.end = 24 + hour;
  intro.from = clamp(intro.end - 24, ...INTRO.start);
  const [a, b] = INTRO.ease;
  intro.total = (intro.end - intro.from) / INTRO.pace + (a + b) / 2;
}

async function loadPaleo() {
  try {
    const response = await fetch("./earth/paleo/paleo.json", { cache: "no-cache" });
    if (!response.ok) throw new Error(`paleo ${response.status}`);
    const index = await response.json();
    intro.eras = index.eras || [];
    if (!intro.go) planIntro(introDrift(index.faces));   // (still holding on the young Earth)
    const loader = new THREE.TextureLoader();
    intro.tex = intro.eras.map(() => null);
    intro.eras.forEach((era, i) => loader.load(`./earth/${era.file}`, (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      intro.tex[i] = tex;
    }, undefined, () => { intro.failed = true; }));
    state.earthLayers = [...(state.earthLayers || []), { what: index.what, credit: index.credit, licence: index.licence, years: index.years }];
    drawSkyCredits();
  } catch (error) {
    intro.failed = true;   // no past here (an older server): the opening is skipped
  }
}

// Ready when the past eras, today's Earth and a handful of lights years are in (or there is no lights list).
function introReady() {
  if (intro.failed) return false;
  if (!intro.eras.length || intro.tex.some((tex) => !tex) || !state.earthBorn || !lights.listed || !ice.listed) return false;
  // Today's sea ice, for the last act (no list or no picture: the sea stays as it is).
  const todayIce = iceWanted();
  if (todayIce && !iceTexture(todayIce.file)) return false;
  if (lights.years.length && !intro.lights.length) {
    const want = [1960, 1970, 1980, 1990, 2000, 2010, 9999];
    intro.lights = [...new Set(want.map((year) => lightsAround(year)[0]))];
  }
  return intro.lights.every((entry) => lightTexture(entry.file));
}

const eased = (x) => { const p = clamp(x, 0, 1); return p * p * (3 - 2 * p); };

function tickIntro(now) {
  // Its own clock, moved on frame by frame: a slow or stalled frame slows the opening, never skips an act.
  const step = Math.min(.1, (now - (intro.last ?? now)) / 1000);
  intro.last = now;
  let t = intro.t + step;
  // The stars and the young Earth come out of the dark, in place; the motion begins once everything is in.
  if (!intro.go) {
    const since = (now - intro.started) / 1000;
    if (since >= INTRO.fade && introReady()) {
      intro.go = true;
      performance.mark("kg-intro-go");
    } else {
      // (Asked for with ?intro=1, it waits as long as it takes.)
      if (intro.failed || (!intro.forced && since > INTRO.wait)) return endIntro();
      t = 0;
    }
  }
  if (t >= intro.total) return endIntro(true);
  intro.t = t;
  // One steady motion: the face's Sun time and the ground's drift move together.
  const along = steady(t, intro.total, ...INTRO.ease);
  const face = intro.from + (intro.end - intro.from) * along;
  const east = intro.drift * (1 - along);   // degrees the face still is east of the topic
  intro.face = face;
  intro.act = face < INTRO.dusk ? 1 : face < INTRO.dawn ? 2 : 3;
  globeQ.copy(intro.lean).multiply(faceQ(intro.lat, intro.lon + east * DEG));
  turn = null;
  // The sky (Sun, Moon, stars) goes round the view on that circle, forward only, ending on the rest view's sky;
  // the clock itself runs on as real time.
  intro.turn = new THREE.Quaternion().setFromAxisAngle(intro.axis, (face - intro.end) * 15 * DEG);
  clock.t = intro.base + (now - intro.started);
  clock.rate = 1;
  // The year the lights show: 1960 by day, growing through the night to the newest (by the end, for a topic
  // whose opening ends before dawn); today's in the morning.
  const newest = lights.years.length ? lights.years[lights.years.length - 1].year : YEAR_NOW;
  const night = clamp((face - INTRO.dusk) / (Math.min(INTRO.dawn, intro.end) - INTRO.dusk), 0, 1);
  intro.year = intro.act === 3 ? null : 1960 + (newest - 1960) * night;
  introWords();
  if (now - (clock.drawn || 0) > 250) {
    clock.drawn = now;
    drawClock();
  }
}

// How far through the past the day is (0 young Earth → 1 today's land), from where the Sun is on the face.
// Owner: cut the plain-blue-ball spans. The young Earth is a flash (it has had the wait as well), the old
// mostly-sea eras (750 to 360 million years ago) go by quickly, and most of the act is the land coming together
// and breaking apart, 360 million years ago to today; the eras blend one into the next all the way, no holds.
const AGES = { young: .12, old: .3, eras: .86, oldest: 360 };   // shares of the act; the age the old eras end at
function introAge() {
  const p = clamp((intro.face - intro.from) / (INTRO.dusk - intro.from), 0, 1);
  const ages = intro.eras.map((era) => era.age);
  const first = ages[0] ?? 750;
  if (p < AGES.young) return { p, age: 4500 * Math.pow(first / 4500, p / AGES.young), k: 0 };
  const last = Math.max(0, ages.length - 1);
  if (p < AGES.eras && last > 0) {
    const mid = Math.max(0, ages.findIndex((age) => age <= AGES.oldest));
    const k = p < AGES.old
      ? mid * (p - AGES.young) / (AGES.old - AGES.young)
      : mid + (last - mid) * (p - AGES.old) / (AGES.eras - AGES.old);
    const n = Math.min(last - 1, Math.floor(k));
    return { p, age: ages[n] + (ages[n + 1] - ages[n]) * (k - n), k };
  }
  return { p, age: (ages[last] ?? 0) * (1 - clamp((p - AGES.eras) / (1 - AGES.eras), 0, 1)), k: last };
}

// What the time machine says at a moment of the opening. No caption over the Earth (Owner, 2026-11-17: the time
// machine showing the time pass is enough).
function introWords() {
  let big;
  if (intro.act === 1) {
    const { age } = introAge();
    if (age >= 1000) {
      // {ago}: the whole span written the language's own short way (zh 45亿, where "4.5亿" would be wrong).
      big = t("{n} billion years ago", { n: Number((age / 1000).toFixed(1)), ago: AGO.format(age * 1e6) });
    } else if (age >= 1) {
      const shown = age >= 100 ? Math.round(age / 10) * 10 : Math.round(age);
      big = t("{n} million years ago", { n: Number(shown), ago: AGO.format(shown * 1e6) });
    } else {
      big = t("Today's land");
    }
  } else if (intro.act === 2) {
    big = String(Math.round(intro.year));
  } else {
    big = t("Now");
  }
  // The handle travels the whole opening, one way (Owner, 2026-11-16): for the opening only, the left part of
  // the bar is deep time; from there on it is the bar's own scale, 1960 to now.
  const recent = (year) => DEEP_BAR + (1 - DEEP_BAR) * (1 - Math.sqrt(clamp((YEAR_NOW - year) / (YEAR_NOW - YEAR_FIRST), 0, 1)));
  const at = intro.act === 1 ? DEEP_BAR * introAge().p
    : intro.act === 2 ? recent(intro.year)
      : recent(intro.lastYear) + (1 - recent(intro.lastYear)) * eased((intro.face - INTRO.dawn) / ((intro.end - INTRO.dawn) * .6));
  if (intro.act === 2) intro.lastYear = intro.year;
  $("th-range").value = Math.round(1000 * at);
  placeWhenTag();
  // As the "Now" tag shows, "Made from real data" comes in under the clock; if the "Now" tag, riding the handle,
  // is about to run into it, the "Now" tag fades first (Owner, 2026-11-17).
  if (intro.act === 3) {
    if (!intro.real) realTag();
    const tag = $("when-tag");
    if (!tag.classList.contains("gone") && realTouchesNow(40)) tag.classList.add("gone");
  }
  if (big === intro.words) return;
  intro.words = big;
  $("when-tag").textContent = big;
  $("when").classList.toggle("past", intro.act !== 3);
  placeWhenTag();
}
// How much of the bar deep time takes in the opening (4.5 billion years ago to today's land).
const DEEP_BAR = .4;

// The opening's year under the handle: its tip points at the handle, the tag itself kept inside the screen.
function placeWhenTag() {
  const range = $("th-range");
  const tag = $("when-tag");
  const box = $("when").getBoundingClientRect();
  const thumb = 16;   // the handle's width in the browsers we check
  const x = range.offsetLeft + thumb / 2 + (range.offsetWidth - thumb) * Number(range.value) / 1000;
  const w = tag.offsetWidth;
  const left = clamp(x - w / 2, 8 - box.left, innerWidth - 8 - box.left - w);
  tag.style.transform = `translateX(${Math.round(left)}px)`;
  tag.style.setProperty("--tip", `${clamp(Math.round(x - left), 12, w - 12)}px`);
}

// The opening's part of each frame's look: out of the dark, the young Earth, the past eras, then today's.
function introLook(u, now, dt) {
  const t = intro.active ? intro.t : null;
  u.uTime.value = now / 1000;
  // The stars, the Sun's glow, the Moon, the air and the young Earth's own glow come out of the dark together.
  intro.birth = intro.active ? eased((now - intro.started) / 1000 / INTRO.fade) : 1;
  u.uBirth.value = intro.birth;
  let young = 0;
  let paleo = 0;
  if (t != null) {
    const { p, k } = introAge();
    young = 1 - eased((p - AGES.young * .7) / (AGES.young * .5));
    u.uHeat.value = 1 - eased(p / (AGES.young * 1.1));
    // No blue air round the fire ball (Owner, 2026-11-17): it comes in as the Earth cools and the first map
    // takes over; while it is molten, only a faint warm haze.
    intro.air = eased((p - AGES.young * .6) / (AGES.young * .6));
    intro.hot = u.uHeat.value * young;
    paleo = 1 - eased((p - AGES.eras) / (1 - AGES.eras));
    const n = Math.floor(k);
    const last = intro.eras.length - 1;
    u.uPaleoA.value = intro.tex[Math.min(n, last)] || null;
    u.uPaleoB.value = intro.tex[Math.min(n + 1, last)] || null;
    u.uPaleoMix.value = k - n;   // straight through, no holds: the land moves at an even pace
    if (!u.uPaleoA.value) paleo = 0;
  }
  // After the opening (or a skip) whatever is left fades out.
  u.uYoung.value = t != null ? young : Math.max(0, u.uYoung.value - dt / .5);
  if (t == null) {
    intro.air = Math.min(1, intro.air + dt / .5);
    intro.hot = Math.max(0, intro.hot - dt / .5);
  }
  u.uPaleo.value = t != null ? paleo : Math.max(0, u.uPaleo.value - dt / .5);
}

function endIntro(done = false) {
  if (!intro.active) return;
  intro.active = false;
  intro.ended = performance.now();
  intro.year = null;
  appBox.classList.remove("intro");
  appBox.classList.add("hush");
  // Cut short: the ground and the clock ease back to the topic and now from wherever they were.
  if (!done) {
    turn = { from: globeQ.clone(), to: state.restQ.clone(), started: performance.now(), duration: 900 };
    if (intro.turn) intro.skyBack = { from: intro.turn.clone().multiply(state.restQ), started: performance.now() };
    clock.back = { from: clock.t, started: performance.now() };
  } else {
    clock.t = intro.base + (performance.now() - intro.started);
  }
  clock.rate = 1;
  state.lastTouch = performance.now();
  drawYear();
  drawClock();
  realTag();
  window.removeEventListener("pointerdown", skipIntro, true);
  window.removeEventListener("keydown", skipIntro, true);
  window.removeEventListener("wheel", skipIntro, true);
}

// "Made from real data · Sources" under the clock, as soon as the opening's handle reaches now (or when the
// opening is cut short or ends before it gets there). It holds about 2 s, at least till a beat past the
// opening's end, then fades; as it fades, "Now" and the clock light up and the Earth goes straight to rest
// (Owner, 2026-11-17). From the opening's end the current topic's name is on the Earth; the ring and the card
// wait (`.hush`) for the usual ways in. A tap or key while the tag shows ends it at once.
function unhush() {
  if (!appBox.classList.contains("hush")) return;
  appBox.classList.remove("hush");
  appBox.classList.add("unhush");
  setTimeout(() => appBox.classList.remove("unhush"), 1000);
}
const REAL_HOLD = 2000;   // ms the tag shows (and never gone before 700 ms past the opening's end)
function realTag() {
  if (intro.real) return;
  const line = $("real-line");
  intro.real = { at: performance.now(), done: false };
  line.hidden = false;
  placeRealLine();
  addEventListener("resize", placeRealLine);
  requestAnimationFrame(() => { if (!intro.real.done) line.classList.add("on"); });
  const showRest = (event) => {
    if (intro.real.done) return;
    intro.real.done = true;
    window.removeEventListener("pointerdown", showRest);
    window.removeEventListener("keydown", showRest);
    line.classList.remove("on");
    appBox.classList.remove("dim-now");
    const lit = [$("th-now"), $("moment")];
    for (const el of lit) el.classList.add("lit");
    setTimeout(() => { for (const el of lit) el.classList.remove("lit"); }, 1400);
    setTimeout(() => {
      line.hidden = true;
      removeEventListener("resize", placeRealLine);
    }, 700);
    // As "Now" and the clock light up, the Earth goes to rest at once (the clock's time-lapse starts, the ground
    // turns), its name on it; the questions and the card wait for the usual tap (see `.hush`). A tap while the tag
    // still showed is the reader's own: it does what it always does, and the rest comes after the usual wait.
    if (event) state.lastTouch = performance.now();
    else restHere();
    intro.calm = state.lastTouch;   // the full look holds straight into the rest (no dimming, clouds stay)
    addEventListener("keydown", unhush, { once: true });   // keyboard: any key brings the questions
  };
  // Shown for REAL_HOLD, and never gone before the opening has ended plus a short beat.
  const hide = () => {
    if (intro.real.done) return;
    const left = intro.active ? 100 : Math.max(intro.real.at + REAL_HOLD, intro.ended + 700) - performance.now();
    if (left > 0) setTimeout(hide, left);
    else showRest();
  };
  setTimeout(hide, REAL_HOLD);
  // Listen once the opening is over and its skipping tap has passed, so that tap does not also bring the ring in.
  const listen = () => {
    if (intro.real.done) return;
    if (intro.active || performance.now() - intro.ended < 600) return setTimeout(listen, 100);
    window.addEventListener("pointerdown", showRest);
    window.addEventListener("keydown", showRest);
  };
  listen();
}

// The real-data tag under the bar: centred under the clock (the drawer's button for the sources), kept inside
// the screen; its tip points at the clock's middle, clear of the tag's rounded ends.
function placeRealLine() {
  const line = $("real-line");
  const tag = line.firstElementChild;
  const clk = $("clock");
  // Measured against the bar (#when) from the screen rects: the clock sits inside the split pill, so its
  // offsetLeft would be from the pill, not the bar (the tag drifted far left once the clock was split).
  const bar = $("when").getBoundingClientRect();
  const c = clk.getBoundingClientRect();
  const w = tag.getBoundingClientRect().width;
  const end = tag.offsetHeight / 2 + 6;
  const mid = c.left - bar.left + c.width / 2;
  const left = clamp(mid - w / 2, 8 - bar.left, innerWidth - 8 - bar.left - w);
  line.style.transform = `translate(${Math.round(left)}px, ${Math.round(c.top - bar.top)}px)`;
  line.style.width = `${Math.ceil(w)}px`;
  line.style.height = `${Math.round(c.height)}px`;
  tag.style.setProperty("--tip", `${clamp(Math.round(mid - left), end, Math.round(w - end))}px`);
}

// Is the opening's "Now" tag at the handle within `gap` px of the real-data tag under the clock?
function realTouchesNow(gap) {
  const a = $("real-line").firstElementChild.getBoundingClientRect();
  const b = $("when-tag").getBoundingClientRect();
  return a.left < b.right + gap && b.left < a.right + gap;
}

// Any tap, key or wheel cuts the opening short; that tap does nothing else.
function skipIntro(event) {
  if (!intro.active) return;
  event.stopPropagation();
  endIntro();
}
function swallowAfterSkip(event) {
  if (intro.active || performance.now() - intro.ended < 500) event.stopPropagation();
  else for (const kind of ["click", "pointerup", "dblclick"]) window.removeEventListener(kind, swallowAfterSkip, true);
}

/* ---------- the clock: what moment the Earth shows ---------- */

function tickClock(now, dt, lapsing) {
  if (clock.back) {
    const p = clamp((now - clock.back.started) / 1200, 0, 1);
    const e = p * p * (3 - 2 * p);
    clock.t = clock.back.from + (Date.now() - clock.back.from) * e;
    if (p === 1) clock.back = null;
  } else {
    clock.rate = lapsing ? 1 + (LAPSE - 1) * state.spin : 1;
    clock.t += dt * 1000 * clock.rate;
  }
  if (now - (clock.drawn || 0) > 250) {
    clock.drawn = now;
    drawClock();
  }
}

const DAY_FMT = new Intl.DateTimeFormat(DATE_LOCALE, { weekday: "short", day: "numeric", month: "short" });
const TIME_FMT = new Intl.DateTimeFormat(DATE_LOCALE, { hour: "2-digit", minute: "2-digit" });
const ZONE = new Intl.DateTimeFormat(DATE_LOCALE, { timeZoneName: "short" })
  .formatToParts(new Date()).find((part) => part.type === "timeZoneName")?.value || "";

function drawClock() {
  const shown = new Date(clock.t);
  const fast = clock.rate > 2;
  const live = !fast && Math.abs(clock.t - Date.now()) < 90000;
  clock.live = live || Boolean(clock.back);
  // AM/PM small, so the clock leaves the handle its room (a phone's bar is one row).
  const parts = TIME_FMT.formatToParts(shown);
  const time = parts.filter((part) => part.type !== "dayPeriod").map((part) => part.value).join("").trim();
  const half = parts.find((part) => part.type === "dayPeriod")?.value || "";
  // All lit: the time reads "All lit" (CSS swaps the two in one cell; the drawer still says the moment).
  if ($("clock-time").dataset.shown !== `${time}|${half}`) {
    $("clock-time").dataset.shown = `${time}|${half}`;
    const now = node("span", "time-word", time);
    if (half) now.append(node("small", "", half));
    $("clock-time").replaceChildren(now, node("span", "all-word", t("All lit")));
  }
  $("clock").classList.toggle("fast", fast);
  $("sky-moment").textContent = `${DAY_FMT.format(shown)}, ${TIME_FMT.format(shown)} ${ZONE} · ${fast ? t("1 day ≈ {n} s", { n: DAY_SECONDS }) : live ? t("now") : t("real speed")}`;
  drawNowButton();
  if ($("sky-box").classList.contains("open")) drawSkyFacts();
}

/* The drawer's rows: what the Earth and the sky show, at a glance. Each row is built once and then only its
   words and small picture change (the clock redraws it four times a second, and an opened row stays open). */
const SKY_PICS = {

  past: '<svg width="46" height="24" viewBox="0 0 46 24" aria-hidden="true"><rect x=".5" y=".5" width="45" height="23" rx="3" fill="#2d6c8c"/>'
    + '<path d="M10 6c6-3 14-2 19 1s9 7 6 11-11 3-16 1-12-3-12-7 1-5 3-6z" fill="#8a9a5b"/></svg>',
  // Little pictures that do not change: the stars, the city lights, the sea ice at both ends of the Earth.
  stars: '<svg width="46" height="24" viewBox="0 0 46 24" aria-hidden="true"><g fill="#f3f7f7">'
    + '<circle cx="6" cy="6" r="1.3"/><circle cx="15" cy="15" r=".9"/><circle cx="23" cy="5" r="1.6"/><circle cx="31" cy="17" r="1.1"/>'
    + '<circle cx="39" cy="8" r=".9"/><circle cx="10" cy="20" r=".7"/><circle cx="27" cy="11" r=".7"/><circle cx="42" cy="19" r="1.3"/></g>'
    + '<circle cx="35" cy="3" r=".8" fill="#ffd57a"/></svg>',
  lights: '<svg width="46" height="24" viewBox="0 0 46 24" aria-hidden="true"><rect x=".5" y=".5" width="45" height="23" rx="3" fill="#04121a" stroke="rgba(190,225,235,.28)"/>'
    + '<g fill="#ffd57a"><circle cx="9" cy="8" r="1.3"/><circle cx="12" cy="10" r=".8"/><circle cx="22" cy="7" r="1.6"/><circle cx="25" cy="9" r="1"/>'
    + '<circle cx="34" cy="10" r="1.3"/><circle cx="37" cy="8" r=".8"/><circle cx="15" cy="16" r=".9"/><circle cx="31" cy="15" r=".8"/></g></svg>',
  ice: '<svg width="46" height="24" viewBox="0 0 46 24" aria-hidden="true"><rect x=".5" y=".5" width="45" height="23" rx="3" fill="#123a52" stroke="rgba(190,225,235,.28)"/>'
    + '<path d="M1 1h44v4c-6 2-10 0-15 2s-10 0-15 1-9-1-14 0z" fill="#dce7f0"/><path d="M1 23h44v-4c-7-2-11 1-16-1s-9 0-14-1-9 1-14 0z" fill="#dce7f0"/></svg>',
};
const MAP_W = 46;
const MAP_H = 24;
const mapX = (lon) => ((lon + 180) / 360) * MAP_W;
const mapY = (lat) => ((90 - lat) / 180) * MAP_H;
const MAP_EDGE = `<rect x=".5" y=".5" width="${MAP_W - 1}" height="${MAP_H - 1}" rx="3" fill="none" stroke="rgba(190,225,235,.28)"/>`;

// Day and night on a small flat map, the Sun where it is straight overhead.
function sunPicture(sun) {
  const lead = Math.abs(sun.lat) < .5 ? (sun.lat < 0 ? -.5 : .5) : sun.lat;
  const tan = Math.tan((lead * Math.PI) / 180);
  const line = [];
  for (let lon = -180; lon <= 180; lon += 5) {
    const lat = (Math.atan(-Math.cos(((lon - sun.lon) * Math.PI) / 180) / tan) * 180) / Math.PI;
    line.push(`${mapX(lon).toFixed(1)},${mapY(lat).toFixed(1)}`);
  }
  // The Sun south of the equator: the north is in night past the line, else the south.
  const shut = lead < 0 ? `${MAP_W},0 0,0` : `${MAP_W},${MAP_H} 0,${MAP_H}`;
  return `<svg width="${MAP_W}" height="${MAP_H}" viewBox="0 0 ${MAP_W} ${MAP_H}" aria-hidden="true">`
    + `<rect x=".5" y=".5" width="${MAP_W - 1}" height="${MAP_H - 1}" rx="3" fill="#2d6c8c"/>`
    + `<polygon points="${line.join(" ")} ${shut}" fill="#04121a" opacity=".92"/>`
    + `<circle cx="${mapX(sun.lon).toFixed(1)}" cy="${mapY(sun.lat).toFixed(1)}" r="2.6" fill="#ffd57a"/>${MAP_EDGE}</svg>`;
}

// The Moon's lit part, as seen from the north: growing = lit on the right.
function moonPicture(lit, growing) {
  const r = 10;
  const c = 12;
  const bulge = (r * Math.abs(1 - 2 * lit)).toFixed(2);
  const path = `M${c},${c - r} A${r},${r} 0 0 1 ${c},${c + r} A${bulge},${r} 0 0 ${lit > .5 ? 1 : 0} ${c},${c - r}Z`;
  return `<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="#26343b"/>`
    + `<path d="${path}" fill="#e9ecea"${growing ? "" : ` transform="matrix(-1 0 0 1 ${2 * c} 0)"`}/></svg>`;
}

// Where the clouds come from: the band the weather satellites see, or the whole Earth (the 2002 day), or none.
function cloudPicture(shows, off, edge) {
  const top = mapY(edge);
  const band = off ? ""
    : shows === "one" ? `<rect x="1" y="1" width="${MAP_W - 2}" height="${MAP_H - 2}" rx="2.5" fill="#e9ecea" opacity=".55"/>`
      : `<rect x="1" y="${top.toFixed(1)}" width="${MAP_W - 2}" height="${(MAP_H - 2 * top).toFixed(1)}" fill="#e9ecea" opacity=".6"/>`;
  return `<svg width="${MAP_W}" height="${MAP_H}" viewBox="0 0 ${MAP_W} ${MAP_H}" aria-hidden="true">`
    + `<rect x=".5" y=".5" width="${MAP_W - 1}" height="${MAP_H - 1}" rx="3" fill="#123a52"/>${band}`
    + `${off ? `<path d="M8 20L38 4" stroke="#789098" stroke-width="1.5"/>` : ""}${MAP_EDGE}</svg>`;
}

const SKY_MORE = '<svg class="sky-more" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const SHORT_DAY = new Intl.DateTimeFormat(DATE_LOCALE, { day: "numeric", month: "short", timeZone: "UTC" });
const SHORT_MONTH = new Intl.DateTimeFormat(DATE_LOCALE, { month: "short", year: "numeric", timeZone: "UTC" });

function skyRow({ key, what, point, say, picture, past = false }) {
  let row = $("sky-facts").querySelector(`[data-key="${key}"]`);
  if (!row) {
    row = node("details", "sky-row");
    row.dataset.key = key;
    const head = node("summary");
    const text = node("span", "sky-text");
    text.append(node("span", "sky-what"), node("b", "sky-key"));
    head.append(node("span", "sky-vis"), text);
    head.insertAdjacentHTML("beforeend", SKY_MORE);
    row.append(head, node("p", "sky-say"));
    $("sky-facts").append(row);
  }
  row.classList.toggle("past", past);
  const set = (selector, value) => {
    const el = row.querySelector(selector);
    if (el.textContent !== value) el.textContent = value;
  };
  set(".sky-what", what);
  set(".sky-key", point);
  set(".sky-say", say);
  if (row.dataset.picture !== picture) {
    row.dataset.picture = picture;
    row.querySelector(".sky-vis").innerHTML = picture;   // (built here from numbers only)
  }
}

function drawSkyFacts() {
  const sun = overhead(sunDir(clock.t), clock.t);
  const litNow = moonLit(clock.t);
  const lit = Math.round(litNow * 100);
  const growing = moonLit(clock.t + 6 * 3600000) >= litNow;
  const where = ({ lat, lon }) => `${Math.abs(lat).toFixed(0)}° ${lat >= 0 ? "N" : "S"}, ${Math.abs(lon).toFixed(0)}° ${lon >= 0 ? "E" : "W"}`;
  const age = state.deep;
  const off = state.year != null || age != null;
  const edge = Math.round(clouds.edge || 73);
  const none = t("None in deep time");
  const deepSay = t("Nothing shows the clouds, city lights or sea ice of deep time: the Earth shows its land and sea only.");
  const cloudPoint = age != null ? none : off ? t("None in {year}", { year: String(state.year) })
    : clouds.shows === "real" ? t("Real, seen at {time}", { time: TIME_FMT.format(new Date(clouds.at)) })
      : clouds.shows === "replay" ? t("The last real day, again")
        : t("One real day from 2002");
  const lightShown = lights.shown;
  const lightPoint = age != null ? none : !lightShown ? "2016"
    : lightShown.made ? t("{year}, made from 1992", { year: String(lightShown.year) })
      : state.year == null ? t("{year}, the newest measured", { year: String(lightShown.year) }) : String(lightShown.year);
  skyRow({ key: "sun", what: t("Sun"), point: t("Overhead {where}", { where: where(sun) }), picture: sunPicture(sun),
    say: t("The Sun is straight overhead at {where}. Day and night are where they really are.", { where: where(sun) }) });
  skyRow({ key: "moon", what: t("Moon"), point: growing ? t("{n}% lit, growing", { n: lit }) : t("{n}% lit, shrinking", { n: lit }),
    picture: moonPicture(Math.round(litNow * 50) / 50, growing),
    say: t("The Moon is {n}% lit, in its real direction; it is drawn closer and bigger than life so it fits.", { n: lit }) });
  skyRow({ key: "stars", what: t("Stars"), point: t("At their real places"), picture: SKY_PICS.stars,
    say: t("The stars are every star you can see with your eyes, at their real places.") });
  // Deep time: what the land and sea are (first of the Earth's rows, gone again at the recent years).
  const pastRow = $("sky-facts").querySelector('[data-key="past"]');
  if (age != null) {
    const { period, ago } = deepWords(age);
    skyRow({ key: "past", what: t("Land and sea"), point: period || ago, past: true, picture: SKY_PICS.past,
      say: t("The land and sea of {ago}: a geologist's map, painted from rocks and fossils (the PaleoAtlas). Places are shown where they were then, moved back with the same atlas's plate model.", { ago }) });
    const row = $("sky-facts").querySelector('[data-key="past"]');
    const cloudRow = $("sky-facts").querySelector('[data-key="clouds"]');
    if (cloudRow && row.nextElementSibling !== cloudRow) cloudRow.before(row);
  } else pastRow?.remove();
  skyRow({ key: "clouds", what: t("Clouds"), point: cloudPoint, past: off, say: age != null ? deepSay : cloudWords(),
    picture: cloudPicture(clouds.shows, off, edge) });
  skyRow({ key: "lights", what: t("City lights"), point: lightPoint, past: off, say: age != null ? deepSay : lightWords(), picture: SKY_PICS.lights });
  const iceSay = age != null ? null : iceWords();
  const iceShown = ice.b && ice.fade >= .5 ? ice.b : ice.a;
  if (!iceSay) $("sky-facts").querySelector('[data-key="ice"]')?.remove();
  if (iceSay && iceShown) {
    const month = iceShown.isNow ? SHORT_DAY.format(new Date(iceShown.at))
      : SHORT_MONTH.format(new Date(Date.UTC(iceShown.year, iceShown.month - 1, 15)));
    const point = iceShown.made ? t("{when}, partly made", { when: month }) : t("Real, {when}", { when: month });
    skyRow({ key: "ice", what: t("Sea ice"), point, past: off, say: iceSay, picture: SKY_PICS.ice });
  }
}

// The sources, one line each: a short name that links to the source, and its licence word. The full credit
// stays on the line's hover. CC BY sources keep their makers' names in the short name.
const SOURCE_LINKS = [
  ["Blue Marble: Next Generation", "NASA Blue Marble", "https://science.nasa.gov/earth/earth-observatory/blue-marble-next-generation/"],
  ["Blue Marble clouds", "NASA Blue Marble clouds", "https://science.nasa.gov/earth/earth-observatory/blue-marble-next-generation/"],
  ["Black Marble", "NASA Black Marble", "https://science.nasa.gov/earth/earth-observatory/earth-at-night/"],
  ["Natural Earth", "Natural Earth", "https://www.naturalearthdata.com/"],
  ["Yale Bright Star", "Yale Bright Star Catalogue", "https://vizier.cfa.harvard.edu/viz-bin/VizieR?-source=V/50"],
  ["CGI Moon Kit", "NASA CGI Moon Kit", "https://svs.gsfc.nasa.gov/4720"],
  ["Global Mosaic of Geostationary", "NOAA GMGSI clouds", "https://registry.opendata.aws/noaa-gmgsi/"],
  ["Li, Zhou, Zhao and Zhao", "Night lights 1992–2024, Li et al.", "https://doi.org/10.6084/m9.figshare.9828827"],
  ["PALEOMAP", "PALEOMAP PaleoAtlas, Scotese", "https://doi.org/10.5281/zenodo.5460860"],
  ["Sea Ice Index", "NSIDC Sea Ice Index", "https://nsidc.org/data/g02135"],
  ["Walsh et al.", "NSIDC old ice charts, Walsh et al.", "https://nsidc.org/data/g10010"],
];

function drawSkyCredits() {
  const seen = new Set();
  const items = [];
  for (const layer of state.earthLayers || []) {
    const found = SOURCE_LINKS.filter(([match]) => layer.credit.includes(match));
    const lines = found.length ? found.map(([, name, url]) => ({ name, url })) : [{ name: layer.credit }];
    for (const { name, url } of lines) {
      if (seen.has(name)) continue;
      seen.add(name);
      const item = node("li");
      item.title = `${layer.what}: ${layer.credit}, ${layer.years}. ${layer.licence}.`;
      item.append(url ? outLink(`${name} ↗`, url) : node("b", "", name),
        node("span", "", `· ${String(layer.licence || "").replace(/\s*\(.*\)\s*$/, "").split(",")[0]}`));
      items.push(item);
    }
  }
  // The one picture with no source: the opening's young Earth is drawn.
  items.push(node("li", "", t("Before 750 million years ago the Earth is an artist's impression: no map is older.")));
  // Privacy (audit R9/F-11): what leaves the device and what stays on it.
  items.push(node("li", "privacy", t("No cookies, no tracking. Pictures load from Wikimedia, which sees your internet address. Your device keeps only your language, and until the tab closes, the intro and pictures.")));
  $("sky-credits").replaceChildren(...items);
}

// The clock opens the drawer: the moment, what the Earth and the sky show, the sources.
function showMoment(open) {
  $("sky-box").classList.toggle("open", open);
  $("clock").setAttribute("aria-expanded", String(open));
  if (open) drawSkyFacts();
}

// The clock's symbol: "all lit" on or off. The light only: the time, the year and the turn stay as they are.
function setAllLit(on) {
  state.allLit = on;
  $("moment").classList.toggle("all", on);
  $("all-lit").setAttribute("aria-pressed", String(on));
  drawClock();
  if (state.themes) themesHash();
  else if (state.centre) try { history.replaceState(null, "", topicHash(state.centre)); } catch { /* a convenience only */ }
}

function bindClock() {
  $("all-lit").addEventListener("click", () => setAllLit(!state.allLit));
  $("clock").addEventListener("click", () => showMoment(!$("sky-box").classList.contains("open")));
  // One way back for the whole moment: the year to now and the clock to now.
  $("th-now").addEventListener("click", () => {
    // A phone's deep bar has no now: back to now is back to the 1960 → now bar.
    if (deepShare() === 1) deep.on = false;
    setYear(null);
    if (!clock.live) clock.back = { from: clock.t, started: performance.now() };
  });
  $("sky-close").addEventListener("click", () => showMoment(false));
  $("th-span").addEventListener("click", () => {
    setSpan(!deep.on);
    $("th-range").value = Math.round(1000 * barOfTime());
    if (state.deep != null || state.year != null) placeWhenTag();
  });
}
boot().catch((error) => {
  console.error(error);
  $("panel-body").replaceChildren(node("p", "", t("The graph could not be loaded.")));
  $("panel").classList.add("open");
});
</script>
</body>
