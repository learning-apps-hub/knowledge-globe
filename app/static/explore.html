// One turn of the Earth against the stars while resting = this many seconds.
const DAY_SECONDS = 90;
const LAPSE = SIDEREAL_DAY / DAY_SECONDS;  // the clock's speed while resting
// `?at=2026-11-24T22:00+08:00` opens on another moment (for checking a full
// Moon or a solstice; the time machine will do this properly).
const AT = Date.parse(new URLSearchParams(location.search).get("at") || "");
const clock = {
  t: Number.isFinite(AT) ? AT : Date.now(),  // the moment the Earth, Sun, Moon and stars show
  rate: 1,        // clock seconds per real second
  back: null,     // easing back to now: { from, started }
};
const look = { quiet: 1 };  // 0 = resting (full show), 1 = exploring (Earth quiet)

const AIR_R = 1.09;  // the glow's outer edge, in Earth radii
const ATMOSPHERE_FRAG = `
  uniform vec3 uSun;
  uniform float uRim;
  varying vec3 vNormal;
  varying vec3 vView;
  void main() {
    vec3 n = normalize(vNormal);
    vec3 v = normalize(vView);
    // This is the shell's far side. c is 0 at its outer edge; from c, how
    // high over the ground this line of sight passes (0 = grazing the Earth).
    float c = clamp(-dot(n, v), 0.0, 1.0);
    float h = max(${AIR_R.toFixed(2)} * sqrt(1.0 - c * c) - 1.0, 0.0);
    float out_ = 1.0 - smoothstep(0.0, ${(AIR_R - 1).toFixed(2)}, h);
    // A thin line of lit air hugging the Earth and a trace of halo: from this
    // far away the real atmosphere is barely a hundredth of the Earth's size.
    float line = exp(-h / 0.004);
    float halo = exp(-h / 0.022) * out_;
    // The ground this line of sight grazes, and how the Sun stands there.
    vec3 g = normalize(n + v * c);
    float mu = dot(g, uSun);
    float day = smoothstep(-0.14, 0.30, mu);
    vec3 blue = mix(vec3(0.20, 0.44, 1.0), vec3(0.50, 0.74, 1.0), line);
    vec3 dusk = vec3(1.0, 0.42, 0.14);
    float warm = smoothstep(0.26, 0.0, mu) * smoothstep(-0.16, -0.02, mu);
    vec3 col = mix(blue, dusk, warm * 0.6) * day;
    // Backlit: with the Sun behind the Earth, the whole rim glows.
    col += vec3(1.0, 0.72, 0.46) * pow(max(-uSun.z, 0.0), 6.0) * 0.5;
    gl_FragColor = vec4(col * (line * 0.30 + halo * 0.04) * uRim, 1.0);
    #include <colorspace_fragment>
  }
`;

const PLANET_FRAG = `
  uniform sampler2D uDay;
  uniform sampler2D uPack;
  uniform vec3 uSun;
  uniform vec3 uSunLocal;
  uniform float uReady, uQuiet;
  uniform float uNight, uVivid, uSunlight, uHaze, uLights, uLightsGamma, uLightsGlow;
  uniform float uClouds, uShadow, uGlint, uRim, uQuietDim, uQuietGrey, uQuietClouds;
  // Light-up, in four layers, drawn in this order: 0 what holds the current topic (the answers above the
  // globe), 1 the current topic, 2 what it holds (the answers below), 3 the answer you are looking at. The area picture
  // (red/green = country code, blue = ocean) is looked up in a table: one channel per layer.
  uniform sampler2D uAreas;
  uniform vec2 uAreaSize;     // the area picture's size: 4096 x 2048, or 8192 x 4096 once zoomed in
  uniform sampler2D uLit;
  uniform float uLitDash;     // layer 1 only: a disputed area's dashed edge
  uniform vec4 uLayerAmt;     // each layer's fade
  uniform vec3 uCol[4];
  uniform vec4 uStyle[4];     // fill, edge, half-Earth glow, 1 = every border inside the set
  uniform vec4 uHemi[4];      // north, south, east, west: 1 for each half lit
  uniform vec3 uLines[8];     // (1 = latitude / 2 = longitude, radians, layer)
  uniform vec4 uMark;         // ring centre (xyz) and 1 when shown
  varying vec3 vNormal;
  varying vec3 vView;
  varying vec3 vLocal;
  varying vec2 vUv;
  const vec3 LUMA = vec3(0.2126, 0.7152, 0.0722);
  float cloudAt(vec2 uv) { return pow(texture2D(uPack, uv).g, 1.25); }
  float areaAt(vec2 uv) {
    vec3 a = floor(texture2D(uAreas, uv).rgb * 255.0 + 0.5);
    float code = a.r + 256.0 * a.g;
    return code > 0.5 ? code : (mod(a.b, 8.0) > 0.5 ? 300.0 + mod(a.b, 8.0) : 0.0);
  }
  vec4 litOf(float idx) { return idx > 0.5 ? texture2D(uLit, vec2((idx + 0.5) / 512.0, 0.5)) : vec4(0.0); }
  float lineNear(float d, float w) { return 1.0 - smoothstep(w * 0.6, w * 1.6, d); }
  void main() {
    vec3 n = normalize(vNormal);
    vec3 v = normalize(vView);
    float mu = dot(n, uSun);
    float nv = max(dot(n, v), 0.0);
    vec3 dayc = texture2D(uDay, vUv).rgb;
    vec3 pack = texture2D(uPack, vUv).rgb;    // r city lights, g clouds, b water
    dayc = max(mix(vec3(dot(dayc, LUMA)), dayc, uVivid), 0.0);

    // Sunlight: full day, then a short twilight past the day/night line.
    float lit = pow(clamp((mu + 0.05) / 1.05, 0.0, 1.0), 0.82);
    // A warm band where day turns to night: low Sun through a lot of air.
    float dusk = smoothstep(0.20, 0.0, mu) * smoothstep(-0.10, 0.0, mu);
    vec3 sunCol = mix(vec3(1.0), vec3(1.0, 0.60, 0.36), dusk * 0.75);
    vec3 sunlight = lit * uSunlight * sunCol;

    // Clouds, and one more look towards the Sun: what stands between this
    // ground and the Sun shades it, and a cloud's sunward side is brighter.
    float thin = 1.0 - uQuietClouds * uQuiet;
    float cloud = min(cloudAt(vUv) * uClouds, 1.0) * thin;
    vec3 p = normalize(vLocal);
    vec3 east = normalize(vec3(p.z, 0.0, -p.x) + vec3(1e-5, 0.0, 0.0));
    vec3 north = cross(p, east);
    vec2 toSun = vec2(dot(uSunLocal, east), dot(uSunLocal, north));
    float coslat = max(sqrt(1.0 - p.y * p.y), 0.25);
    vec2 step_ = toSun * vec2(0.1592 / coslat, 0.3183) * 0.0055;
    float sunward = min(cloudAt(vUv + step_) * uClouds, 1.0) * thin;
    float shade = 1.0 - uShadow * sunward * smoothstep(-0.05, 0.15, mu);

    // Night ground: a trace of cool moon- and starlight, most colour gone.
    vec3 nightc = mix(vec3(dot(dayc, LUMA)), dayc, 0.4) * vec3(0.72, 0.88, 1.2) * uNight;
    vec3 col = nightc + dayc * sunlight * shade;
    // The Sun on water. The sea is rough, so its mirror image of the Sun is
    // smeared by the waves into a wide silvery patch: brighter than open sea,
    // far dimmer than cloud, and never a white disc. (Wave-slope spread 0.04,
    // a moderate breeze; water throws back 2% head-on, more at a low angle.)
    vec3 h = normalize(uSun + v);
    float nh = max(dot(n, h), 0.0);
    float nh2 = max(nh * nh, 1e-4);
    float waves = exp(-(1.0 - nh2) / (nh2 * 0.04)) / (0.1257 * nh2 * nh2);
    float mirror = 0.02 + 0.98 * pow(1.0 - max(dot(v, h), 0.0), 5.0);
    float glint = min(0.7854 * mirror * waves / max(nv, 0.12), 0.45)
      * pack.b * smoothstep(0.0, 0.12, mu);
    col += sunCol * uSunlight * glint * uGlint * (1.0 - min(cloud * 1.3, 1.0)) * shade;
    // Blue air over the ground: a little everywhere, a lot towards the edge.
    // (Matched to NASA's DSCOVR/EPIC whole-Earth photos: the sea is slate
    // blue, and the edge is a pale grey-blue haze, not a glowing outline.)
    float air = (0.036 + 0.12 * pow(1.0 - nv, 3.0)) * uHaze;
    vec3 airCol = mix(vec3(1.0, 0.50, 0.24), vec3(0.36, 0.58, 1.0), smoothstep(-0.02, 0.24, mu));
    col += airCol * air * smoothstep(-0.12, 0.30, mu) * uSunlight;

    float relief = clamp(1.0 + (cloud - sunward) * 0.9, 0.72, 1.18);
    vec3 cloudCol = vec3(1.0, 1.01, 1.04) * (uNight * 0.7 + sunlight * relief);
    col = mix(col, cloudCol, clamp(cloud, 0.0, 1.0) * 0.94);

    // City lights: sharp cores, and a soft glow from the blurred picture.
    float dark = 1.0 - smoothstep(-0.14, 0.03, mu);
    // (The night picture carries faint speckle over empty sea and desert,
    // up to about 0.08: below that is noise, not a town.)
    float core = pow(pack.r, uLightsGamma) * smoothstep(0.06, 0.15, pack.r);
    float glow = texture2D(uPack, vUv, 2.6).r;
    vec3 lamp = mix(vec3(1.0, 0.55, 0.20), vec3(1.0, 0.82, 0.56), clamp(core * 1.6, 0.0, 1.0));
    col += lamp * (core * uLights + glow * glow * uLightsGlow) * dark * (1.0 - cloud * 0.7);

    // The edge of the Earth, seen through the most air.
    float fres = pow(1.0 - nv, 4.0);
    col += vec3(0.50, 0.66, 0.95) * fres * smoothstep(-0.16, 0.36, mu) * uRim * 0.18;

    float g = dot(col, LUMA);
    col = mix(col, vec3(g), uQuietGrey * uQuiet) * (1.0 - uQuietDim * uQuiet);
    // Bright cloud tops roll off softly rather than cut to flat white.
    col = mix(col, 0.78 + (1.0 - exp(-(col - 0.78) * 3.2)) * 0.22, step(0.78, col));
    // Light-up: what was chosen glows, bright edge and a soft fill. Drawn after the dimming, so it pops.
    if (dot(uLayerAmt, vec4(1.0)) > 0.001) {
      // Edges about 1.5 screen pixels wide at any zoom (never under half a pixel of the area picture).
      vec2 px = max(fwidth(vUv) * 1.5, 0.5 / uAreaSize);
      float c0 = areaAt(vUv);
      float cE = areaAt(vUv + vec2(px.x, 0.0));
      float cW = areaAt(vUv - vec2(px.x, 0.0));
      float cN = areaAt(vUv + vec2(0.0, px.y));
      float cS = areaAt(vUv - vec2(0.0, px.y));
      vec4 l0 = litOf(c0), lE = litOf(cE), lW = litOf(cW), lN = litOf(cN), lS = litOf(cS);
      // Outer edge: where a layer's set ends. Inner: every border touching the set (its countries apart).
      vec4 outer = max(max(abs(lE - l0), abs(lW - l0)), max(abs(lN - l0), abs(lS - l0)));
      vec4 inner = max(max(step(0.5, abs(cE - c0)) * max(lE, l0), step(0.5, abs(cW - c0)) * max(lW, l0)),
                       max(step(0.5, abs(cN - c0)) * max(lN, l0), step(0.5, abs(cS - c0)) * max(lS, l0)));
      float dash = mix(1.0, step(0.5, fract((vUv.x * 4096.0 + vUv.y * 2048.0) / 10.0)), uLitDash);   // 4096: same dash at any picture size
      float lat = asin(clamp(p.y, -1.0, 1.0));
      float lon = atan(p.x, p.z);
      float wLat = fwidth(p.y) / max(cos(lat), 0.05);
      float wLon = length(fwidth(p.xz)) / max(length(p.xz), 0.05);
      vec4 sides = vec4(step(0.0, p.y), step(p.y, 0.0), step(0.0, p.x), step(p.x, 0.0));
      float equator = lineNear(abs(lat), wLat);
      float meridian = max(lineNear(abs(lon), wLon), lineNear(3.14159265 - abs(lon), wLon * 0.5));
      // How far from the Equator (north, south) and from the 0 / 180 degree circle (east, west).
      vec4 lean = exp(-vec4(vec2(abs(lat)), vec2(asin(clamp(abs(p.x), 0.0, 1.0)))) / 0.15);
      for (int i = 0; i < 4; i++) {
        float amt = uLayerAmt[i];
        if (amt < 0.001) continue;
        vec4 st = uStyle[i];
        float edge = mix(outer[i], inner[i], st.w);
        float fill = l0[i] * st.x + min(edge * 2.2, 1.0) * st.y * (i == 1 ? dash : 1.0);
        vec4 hemi = uHemi[i];
        // Half the Earth: its dividing line, a glow that leans into the lit side and dies away within
        // about 25 degrees, and only a breath of colour over the rest. (A flat wash over the whole half
        // turned the night side brown and hid the ground; two halves glow twice in their shared quarter.)
        fill += dot(hemi * sides, lean) * st.z + dot(hemi, sides) * 0.014;
        float line = 0.0;
        if (hemi.x + hemi.y > 0.5) line = max(line, equator);
        if (hemi.z + hemi.w > 0.5) line = max(line, meridian);
        for (int j = 0; j < 8; j++) {
          vec3 l = uLines[j];
          if (abs(l.z - float(i)) > 0.5 || l.x < 0.5) continue;
          if (l.x < 1.5) line = max(line, lineNear(abs(lat - l.y), wLat));
          else line = max(line, lineNear(abs(mod(lon - l.y + 3.14159265, 6.2831853) - 3.14159265), wLon));
        }
        fill += line * 0.9;
        if (i == 1 && uMark.w > 0.5) {
          float ang = acos(clamp(dot(p, uMark.xyz), -1.0, 1.0));
          fill += lineNear(abs(ang - 0.04), max(fwidth(ang), 0.002)) * 0.95;
        }
        col = mix(col, uCol[i], clamp(fill, 0.0, 1.0) * amt * uReady);
      }
    }
    // Until the pictures arrive: a plain lit ball.
    col = mix(vec3(0.010, 0.035, 0.06) * (0.25 + lit), col, uReady);
    gl_FragColor = vec4(col, 1.0);
    #include <colorspace_fragment>
  }
`;

const VIEW_VERT = `
  varying vec3 vNormal;
  varying vec3 vView;
  varying vec3 vLocal;
  varying vec2 vUv;
  void main() {
    vUv = uv;
    vLocal = position;
    vNormal = normalize(normalMatrix * normal);
    vec4 at = modelViewMatrix * vec4(position, 1.0);
    vView = -at.xyz;
    gl_Position = projectionMatrix * at;
  }
`;

const MOON_FRAG = `
  uniform sampler2D uMap;
  uniform vec3 uSun;
  uniform float uReady, uAlpha, uGain;
  varying vec3 vNormal;
  varying vec2 vUv;
  void main() {
    vec3 n = normalize(vNormal);
    // The Moon's dusty ground throws light back evenly: no dark edge when full.
    float lit = pow(max(dot(n, uSun), 0.0), 0.6);
    vec3 surface = mix(vec3(0.42), texture2D(uMap, vUv).rgb, uReady);
    // A trace of earthshine keeps the dark part just visible, as it really is.
    vec3 col = surface * (0.012 + lit * uGain);
    gl_FragColor = vec4(col, uAlpha);
    #include <colorspace_fragment>
  }
`;

const STAR_VERT = `
  attribute float aSize;
  attribute vec3 aColor;
  uniform float uScale;
  varying vec3 vColor;
  varying float vSize;
  void main() {
    vColor = aColor;
    vSize = aSize * uScale;
    gl_PointSize = max(vSize, 1.5);
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;
const STAR_FRAG = `
  uniform float uBright;
  varying vec3 vColor;
  varying float vSize;
  void main() {
    float d = length(gl_PointCoord - 0.5) * 2.0;
    float core = smoothstep(1.0, 0.0, d);
    // A star smaller than its dot keeps its light: fainter, not cut off.
    float fade = clamp(vSize / 1.5, 0.0, 1.0);
    gl_FragColor = vec4(vColor * core * fade * uBright, 1.0);
    #include <colorspace_fragment>
  }
`;

// Which areas glow. A 512-wide table indexed by area code (countries 1..258) or 300 + ocean number;
// each of its four channels is one light-up layer (see PLANET_FRAG).
const litTable = new THREE.DataTexture(new Uint8Array(512 * 4), 512, 1, THREE.RGBAFormat);
litTable.magFilter = THREE.NearestFilter;
litTable.minFilter = THREE.NearestFilter;
litTable.generateMipmaps = false;
// Each layer: fill, edge, half-Earth glow beside its dividing line, 1 = every border inside the set lights
// (a continent's countries).
// The layers are drawn in this order, so what the current topic holds shows on top of it.
const L = { up: 0, here: 1, down: 2, look: 3 };
const LAYER_STYLE = [
  [.05, .75, .22, 0],  // up: what holds it, as an outline round the current topic
  [.22, .9, .30, 0],   // here: the current topic (thin enough that its ground still shows)
  [.10, .7, .22, 1],   // down: what it holds, every one of them, borders and all
  [.26, 1, .30, 0],    // look: the answer you are looking at
];
const HERE_COLOR = "#ffcc6b";
const lit = { dirty: true, keys: ["", "", "", ""], amt: [0, 0, 0, 0], want: [0, 0, 0, 0] };
let dateLine = null;
const HOME_SIDE = new Map(HOMES.map((home) => [home.key, home.side]));
const LAYER_OF_SIDE = { up: L.up, down: L.down };

function vecAt(latDeg, lonDeg, radius = 1) {
  const lat = latDeg * Math.PI / 180;
  const lon = lonDeg * Math.PI / 180;
  return new THREE.Vector3(Math.cos(lat) * Math.sin(lon), Math.sin(lat), Math.cos(lat) * Math.cos(lon)).multiplyScalar(radius);
}

// Light up, in each answer's own shape: the current topic; what holds it (an outline round it); what it
// holds (all of them at once); and the answer you are looking at. Areas, lines and halves of the Earth
// are drawn, never pointed at; only pins get beams (drawMarks).
function applyLit() {
  lit.dirty = false;
  if (!planet) return;
  const u = planet.material.uniforms;
  const data = litTable.image.data;
  data.fill(0);
  for (const v of u.uHemi.value) v.set(0, 0, 0, 0);
  for (const v of u.uLines.value) v.set(0, 0, 0);
  u.uMark.value.set(0, 0, 0, 0);
  u.uLitDash.value = 0;
  let lineAt = 0;
  let dateLayer = -1;
  const keys = ["", "", "", ""];
  const colors = [null, HERE_COLOR, null, null];
  const paint = (i, point, color) => {
    const where = point?.where;
    if (!where || point.shape === "pin") return;
    keys[i] += `${point.id},`;
    colors[i] ||= color;
    if (where.codes) {
      for (const code of where.codes) data[code * 4 + i] = 255;
    } else if (where.ocean) {
      data[(300 + where.ocean) * 4 + i] = 120;   // an ocean is huge: a lighter wash
    } else if (where.hemisphere) {
      const slot = { north: "x", south: "y", east: "z", west: "w" }[where.hemisphere];
      u.uHemi.value[i][slot] = 1;
    } else if ((where.lat !== undefined || where.lon !== undefined) && lineAt < 8) {
      const isLat = where.lat !== undefined;
      u.uLines.value[lineAt].set(isLat ? 1 : 2, (isLat ? where.lat : where.lon) * Math.PI / 180, i);
      lineAt += 1;
    } else if (where.path) {
      dateLayer = Math.max(dateLayer, i);
    }
  };
  const centre = state.points.get(state.centre);
  paint(L.here, centre);
  if (centre?.status === "disputed") u.uLitDash.value = 1;
  if (centre?.tiny && centre.at) u.uMark.value.set(...vecAt(centre.at.lat, centre.at.lon).toArray(), 1);
  // Only the current topic is lit by default. A question's answers light while you point at it (mouse)
  // or while its list is open (tap, on a phone); one answer lights while you point at its row or look
  // at it (Owner, 2026-11-13).
  const answers = state.answers.get(state.centre);
  const lightSlot = (slot, only = null) => {
    const i = only ? L.look : (LAYER_OF_SIDE[HOME_SIDE.get(slot)] ?? L.look);
    for (const answer of answers?.get(slot) || []) {
      if (!only || answer.id === only) paint(i, state.points.get(answer.id), KIND_COLOR[kindOf(slot)]);
    }
  };
  if (state.peek?.list) lightSlot(state.peek.list);
  if (state.hover) lightSlot(state.hover.slot, state.hover.id);
  if (state.peek?.id) paint(L.look, state.points.get(state.peek.id), peekColor());
  for (let i = 0; i < 4; i += 1) {
    u.uCol.value[i].set(colors[i] || HERE_COLOR);
    if (keys[i] !== lit.keys[i]) lit.amt[i] = 0;   // a new choice fades in again
    lit.keys[i] = keys[i];
    lit.want[i] = keys[i] ? 1 : 0;
  }
  if (dateLine) {
    dateLine.visible = dateLayer >= 0;
    if (dateLayer >= 0) dateLine.children[0]?.material.color.set(colors[dateLayer] || HERE_COLOR);
  }
  litTable.needsUpdate = true;
}

function buildDateLine(paths) {
  dateLine = new THREE.Group();
  const material = new THREE.LineBasicMaterial({ color: HERE_COLOR, transparent: true, opacity: .95 });
  for (const path of paths) {
    const points = path.map(([lon, lat]) => vecAt(lat, lon, 1.002));
    dateLine.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), material));
  }
  dateLine.visible = false;
  globeGroup.add(dateLine);
}

function initGlobe() {
  try {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(FOV, 1, .02, 200);   // close: a zoomed-in camera is near the ground
    // Opaque: space is black, and the atmosphere's added light needs a real
    // background under it (a see-through canvas showed a dark ring there).
    renderer = new THREE.WebGLRenderer({ canvas: $("globe"), antialias: true });
    renderer.setClearColor("#02060b");
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    world = new THREE.Group();
    scene.add(world);
    globeGroup = new THREE.Group();
    world.add(globeGroup);

    // Turned so the picture's longitude 0 faces +z and 90° east faces +x: the
    // same frame as every spot the page works out (restFor, vecAt, sky.js).
    const ball = new THREE.SphereGeometry(1, 128, 96);
    ball.rotateY(-Math.PI / 2);
    planet = new THREE.Mesh(ball, new THREE.ShaderMaterial({
      uniforms: {
        uDay: { value: null }, uPack: { value: null },
        uSun: { value: sunW }, uSunLocal: { value: sunLocal }, uReady: { value: 0 }, uQuiet: { value: 1 },
        uNight: { value: LOOK.night }, uVivid: { value: LOOK.vivid }, uSunlight: { value: LOOK.sunlight },
        uHaze: { value: LOOK.haze }, uLights: { value: LOOK.lights }, uLightsGamma: { value: LOOK.lightsGamma },
        uLightsGlow: { value: LOOK.lightsGlow }, uClouds: { value: LOOK.clouds }, uShadow: { value: LOOK.shadow },
        uGlint: { value: LOOK.glint }, uRim: { value: LOOK.rim },
        uQuietDim: { value: LOOK.quietDim }, uQuietGrey: { value: LOOK.quietGrey },
        uQuietClouds: { value: LOOK.quietClouds },
        uAreas: { value: null }, uAreaSize: { value: new THREE.Vector2(4096, 2048) },
        uLit: { value: litTable }, uLitDash: { value: 0 },
        uLayerAmt: { value: new THREE.Vector4() },
        uCol: { value: [0, 1, 2, 3].map(() => new THREE.Color(HERE_COLOR)) },
        uStyle: { value: LAYER_STYLE.map((st) => new THREE.Vector4(...st)) },
        uHemi: { value: [0, 1, 2, 3].map(() => new THREE.Vector4()) },
        uLines: { value: Array.from({ length: 8 }, () => new THREE.Vector3()) },
        uMark: { value: new THREE.Vector4() },
      },
      vertexShader: VIEW_VERT,
      fragmentShader: PLANET_FRAG,
    }));
    globeGroup.add(planet);

    atmosphere = new THREE.Mesh(
      new THREE.SphereGeometry(AIR_R, 96, 64),
      new THREE.ShaderMaterial({
        transparent: true, side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false,
        uniforms: { uSun: { value: sunW }, uRim: { value: LOOK.rim } },
        vertexShader: VIEW_VERT,
        fragmentShader: ATMOSPHERE_FRAG,
      }),
    );
    world.add(atmosphere);

    // The sky: real stars, turned with the globe and the clock.
    sky = new THREE.Group();
    world.add(sky);

    const moonBall = new THREE.SphereGeometry(LOOK.moonR, 48, 32);
    moonBall.rotateY(-Math.PI / 2);   // the near side (longitude 0) faces +z, then lookAt turns it to us
    moon = new THREE.Mesh(moonBall, new THREE.ShaderMaterial({
      transparent: true,
      uniforms: { uMap: { value: null }, uSun: { value: sunW }, uReady: { value: 0 }, uAlpha: { value: 0 }, uGain: { value: LOOK.moonGain } },
      vertexShader: VIEW_VERT,
      fragmentShader: MOON_FRAG,
    }));
    world.add(moon);

    resizeGlobe();
    renderer.setAnimationLoop(animate);
    loadEarth();
  } catch (error) {
    console.error(error);
    renderer = null;
    const loop = (now) => { animate(now); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
}

// The pictures live on the server (not in git): /earth/manifest.json names them.
async function loadEarth() {
  let manifest;
  try {
    const response = await fetch("./earth/manifest.json");
    if (!response.ok) throw new Error(`manifest ${response.status}`);
    manifest = await response.json();
  } catch (error) {
    console.warn("No Earth pictures on this server; showing a plain globe.", error);
    return;
  }
  state.earthLayers = manifest.layers || [];
  drawSkyCredits();
  const files = manifest.files;
  state.earthFiles = files;
  const loader = new THREE.TextureLoader();
  const aniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  const load = (name, srgb) => new Promise((resolve, reject) => {
    loader.load(`./earth/${name}`, (tex) => {
      tex.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
      tex.anisotropy = aniso;
      resolve(tex);
    }, undefined, reject);
  });
  if (files.stars) loadStars(files.stars);
  if (files.moon) {
    load(files.moon, true).then((tex) => {
      moon.material.uniforms.uMap.value = tex;
      moon.material.uniforms.uReady.value = 1;
    }).catch((error) => console.warn(error));
  }
  try {
    const [day, pack] = await Promise.all([load(files.day4096, true), load(files.pack4096, false)]);
    planet.material.uniforms.uDay.value = day;
    planet.material.uniforms.uPack.value = pack;
    state.earthBorn = performance.now();
    if (files.areas) {
      // Codes, not colours: no smoothing, no mipmaps, no colour conversion.
      loader.load(`./earth/${files.areas}`, (tex) => {
        tex.colorSpace = THREE.NoColorSpace;
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        tex.generateMipmaps = false;
        if (planet.material.uniforms.uAreaSize.value.x > tex.image.width) return tex.dispose();   // sharp one won
        planet.material.uniforms.uAreas.value = tex;
        planet.material.uniforms.uAreaSize.value.set(tex.image.width, tex.image.height);
        lit.dirty = true;   // light the current topic now that the picture is here
      }, undefined, (error) => console.warn("Area picture did not load.", error));
    }
    if (files.geo) {
      fetch(`./earth/${files.geo}`).then((r) => r.json()).then((geo) => {
        if (geo.lines?.["date-line"]) buildDateLine(geo.lines["date-line"].paths);
        lit.dirty = true;
      }).catch((error) => console.warn(error));
    }
  } catch (error) {
    console.warn("Earth pictures did not load.", error);
  }
}

async function loadStars(name) {
  const response = await fetch(`./earth/${name}`);
  if (!response.ok) return;
  const list = (await response.json()).stars;
  const positions = new Float32Array(list.length * 3);
  const sizes = new Float32Array(list.length);
  const colors = new Float32Array(list.length * 3);
  const v = [0, 0, 0];
  const RAD = Math.PI / 180;
  list.forEach(([ra, dec, mag, bv], i) => {
    fromRaDec(ra * RAD, dec * RAD, v);
    positions.set([v[0] * 90, v[1] * 90, v[2] * 90], i * 3);
    // Brightness doubles about every 0.75 magnitudes; a dot's area carries it.
    sizes[i] = 4.4 * Math.pow(10, -0.124 * (mag + 1.46)) + .5;
    colors.set(starColor(bv), i * 3);

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));
  geometry.setAttribute("aColor", new THREE.BufferAttribute(colors, 3));
  stars = new THREE.Points(geometry, new THREE.ShaderMaterial({
    uniforms: { uScale: { value: renderer.getPixelRatio() * LOOK.starSize }, uBright: { value: 1 } },
    vertexShader: STAR_VERT, fragmentShader: STAR_FRAG,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  sky.add(stars);
}

// Where the whole globe sits on the stage, in stage pixels.
// Where the globe and the question ring sit on the stage. The ring is an
// oval round the globe, flat to the screen; the globe takes the room the
// ring leaves. On a phone it all fits above the card sheet.
function globeFrame() {
  const W = stage.clientWidth;
  const H = stage.clientHeight;
  const phone = W <= 680;
  const blockW = phone ? 104 : 168;
  const above = phone ? 30 : 36;  // room over a top answer for its question
  const below = phone ? 34 : 40;  // room under a bottom answer for its name
  const appH = $("panel").offsetParent?.clientHeight || H;
  // A phone's sheet opens at 34% of the screen: the ring's lowest names must stay clear of it.
  const bottom = phone ? H - appH * .345 : H;
  let D = phone ? 46 : 64;
  let frame;
  for (let pass = 0; pass < 3; pass += 1) {
    const ry = Math.max(60, (bottom - above - below - D) / 2 - 4);
    const rx = phone ? W / 2 - blockW / 2 - 4 : Math.min(W / 2 - blockW / 2 - 12, ry * 1.55);
    // A phone is narrow: the side answers may sit a little over the globe's edge.
    const r = phone ? Math.min(rx - D * .2, ry - D / 2 - 8) : Math.min(ry - D / 2 - 24, rx - D / 2 - 18);
    frame = { x: W / 2, y: above + D / 2 + 4 + ry, r: Math.max(70, r), rx, ry, D, blockW };
    D = clamp(frame.r * (phone ? .3 : .22), 44, 84);
  }
  return frame;
}

// The canvas's offset from the stage, kept so place() reads no layout per frame. `zoom` is the
// reader's own pinch or wheel zoom (1 = the whole globe inside the question ring).
const view = { w: 1, h: 1, x: 0, y: 0, zoom: 1, zoomAnim: null };
const ZOOM_MIN = .7;
const ZOOM_MAX = 7;

function resizeGlobe() {
  const canvas = $("globe");
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  if (!width || !height) return;
  const box = canvas.getBoundingClientRect();
  const at = stage.getBoundingClientRect();
  Object.assign(view, { w: width, h: height, x: box.left - at.left, y: box.top - at.top });
  if (!renderer) return;
  renderer.setSize(width, height, false);
  camera.aspect = width / height;
  applyCamera();
}

// Pull the camera back until the globe's radius is `frame.r` × zoom pixels, then slide the globe so its
// middle is the middle of the question ring.
function applyCamera() {
  if (!renderer) return;
  const canvas = $("globe");
  const box = canvas.getBoundingClientRect();
  const at = stage.getBoundingClientRect();
  const height = view.h;
  const width = view.w;
  const frame = globeFrame();
  const half = Math.tan(THREE.MathUtils.degToRad(FOV / 2));
  const t = frame.r * view.zoom * 2 * half / height;
  camera.position.z = Math.sqrt(1 + t * t) / t;
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  const perPx = 2 * camera.position.z * half / height;
  world.position.set(
    (at.left + frame.x - (box.left + width / 2)) * perPx,
    -(at.top + frame.y - (box.top + height / 2)) * perPx,
    0,
  );
  world.updateMatrixWorld();
}

function setZoom(value) {
  const next = clamp(value, ZOOM_MIN, ZOOM_MAX);
  view.zoomAnim = null;
  if (Math.abs(next - view.zoom) < 1e-4) return;
  view.zoom = next;
  if (next > SHARP_AT) loadSharp();
  applyCamera();
}

// Zoomed in, the 4096 pictures go soft: swap in the 8192 day picture and area picture, once, only on a device
// that can hold them (tier A, Owner 2026-11-13). Never on the first look: a phone that never zooms never pays.
const SHARP_AT = 1.6;
let sharpAsked = false;
function loadSharp() {
  const files = state.earthFiles;
  if (sharpAsked || !files || !planet?.material.uniforms.uDay.value) return;   // after the first pictures
  if (renderer.capabilities.maxTextureSize < 8192) return;
  sharpAsked = true;
  const loader = new THREE.TextureLoader();
  if (files.day8192) {
    loader.load(`./earth/${files.day8192}`, (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      const old = planet.material.uniforms.uDay.value;
      planet.material.uniforms.uDay.value = tex;
      if (old && old !== tex) old.dispose();
    }, undefined, (error) => console.warn("Sharp day picture did not load.", error));
  }
  if (files.areas8192) {
    loader.load(`./earth/${files.areas8192}`, (tex) => {
      tex.colorSpace = THREE.NoColorSpace;
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      tex.generateMipmaps = false;
      const old = planet.material.uniforms.uAreas.value;
      planet.material.uniforms.uAreas.value = tex;
      planet.material.uniforms.uAreaSize.value.set(tex.image.width, tex.image.height);
      if (old && old !== tex) old.dispose();
      lit.dirty = true;
    }, undefined, (error) => console.warn("Sharp area picture did not load.", error));
  }
}

// A spot in the globe's own frame → stage pixels, and how squarely it faces
// the viewer (1 = front, 0 = on the rim, below 0 = round the back).
const scratch = new THREE.Vector3();
function project(local) {
  scratch.copy(local).applyQuaternion(globeQ);
  const face = scratch.z;
  if (!renderer) {
    const frame = globeFrame();
    return { x: frame.x + frame.r * scratch.x, y: frame.y - frame.r * scratch.y, face };
  }
  scratch.add(world.position).project(camera);
  return { x: (scratch.x + 1) / 2 * view.w + view.x, y: (1 - scratch.y) / 2 * view.h + view.y, face };

const smooth = (lo, hi, v) => {

};

// Every frame: the ring pictures glide to their places, labels and chips
// follow them, and pins ride the globe wherever it has turned. A pin round
// the back fades out, and so does its beam, until the globe turns to it.
function place(now) {
  if (!state.centre) return;
  const at = new Map();
  for (const el of pins) {
    if (el.move) {
      const p = clamp((now - el.move.started) / el.move.duration, 0, 1);
      const e = 1 - Math.pow(1 - p, 3);
      el.pos.x = el.move.from.x + (el.target.x - el.move.from.x) * e;
      el.pos.y = el.move.from.y + (el.target.y - el.move.from.y) * e;
      if (p === 1) el.move = null;
    }
    let alpha = fadeIn(el.born, now);
    if (el.dying) {
      const p = (now - el.dying) / 450;
      if (p >= 1) {
        pins.delete(el);
        el.remove();
        continue;
      }
      alpha *= 1 - smooth(0, 1, p);
    }
    el.style.transform = `translate3d(${el.pos.x.toFixed(1)}px, ${el.pos.y.toFixed(1)}px, 0) translate(-50%, -50%)`;
    el.style.opacity = alpha.toFixed(3);
    el.style.pointerEvents = alpha > .5 ? "" : "none";
    if (!el.dying && el.dataset.slot) at.set(el.dataset.slot, { x: el.pos.x, y: el.pos.y, r: el.size / 2, alpha, labelH: 30 });
  }

  for (const block of state.blocks) {
    const dot = at.get(block.slot);
    if (!dot) continue;
    const alpha = dot.alpha * fadeIn(block.born, now);
    const left = clamp(dot.x - block.width / 2, 4, W - block.width - 4);
    block.label.style.transform = `translate3d(${left.toFixed(1)}px, ${(dot.y - dot.r - block.labelH).toFixed(1)}px, 0)`;
    block.label.style.opacity = alpha.toFixed(3);
    if (block.more) {
      block.more.style.transform = `translate3d(${(dot.x + dot.r - 16).toFixed(1)}px, ${(dot.y + dot.r - 20).toFixed(1)}px, 0)`;
      block.more.style.opacity = alpha.toFixed(3);
      block.more.style.pointerEvents = alpha > .5 ? "" : "none";
    }
  }
  // Close up, less of the globe shows: the horizon moves towards the front.
  const horizon = renderer ? 1 / Math.max(1.0001, camera.position.distanceTo(world.position)) : 0;
  for (const mark of state.marks) {
    const spot = project(mark.anchor);
    // An answer's mark (and its beam) lights with its question: while that is pointed at or its list is
    // open, or one alone while its row is pointed at. On arrival only the current topic shows.
    if (mark.of) {
      const on = state.peek?.list === mark.of
        || (state.hover?.slot === mark.of && (!state.hover.id || state.hover.id === mark.id));
      mark.show = reduced ? +on : clamp(mark.show + (on ? .16 : -.16), 0, 1);
    }
    const alpha = smooth(horizon + .04, horizon + .3 * (1 - horizon), spot.face) * fadeIn(mark.born, now) * mark.show;
    if (mark.above) {
      const up = project(mark.above);
      const lift = Math.round(clamp(Math.hypot(up.x - spot.x, up.y - spot.y), 12, 110));
      if (lift !== mark.lift) mark.el.style.setProperty("--lift", `${mark.lift = lift}px`);
    }
    mark.x = spot.x;
    mark.y = spot.y;
    mark.alpha = alpha;
    mark.el.style.transform = `translate3d(${spot.x.toFixed(1)}px, ${spot.y.toFixed(1)}px, 0)`;
    mark.el.style.opacity = alpha.toFixed(3);
    if (!mark.beam) continue;
    const dot = at.get(mark.slot);
    const show = dot ? Math.min(alpha, dot.alpha) : 0;
    mark.beam.style.opacity = show.toFixed(3);
    if (!dot || show < .01) continue;
    const dx = dot.x - spot.x;
    const dy = dot.y - spot.y;
    const reach = Math.hypot(dx, dy) || 1;
    const from = Math.min(.5, 5 / reach);
    // Stop short of the question over the picture (coming down) or the name under it (coming up),
    // not on top of the words.
    const clear = dot.r + (dy > 0 ? dot.labelH : 34) + 3;
    const slope = Math.abs(dy) / reach;
    const to = Math.max(from, 1 - (slope > .5 ? clear / slope : dot.r + 2) / reach);
    for (const line of mark.beam.children) {
      line.setAttribute("x1", (spot.x + dx * from).toFixed(1));
      line.setAttribute("y1", (spot.y + dy * from).toFixed(1));
      line.setAttribute("x2", (spot.x + dx * to).toFixed(1));
      line.setAttribute("y2", (spot.y + dy * to).toFixed(1));
    }
  }
}

// The globe's resting turn for a spot: that spot faces the viewer and the
// globe's north stays up, so the grid never tips over however far you wander.
function restFor(spot) {
  const lat = Math.asin(clamp(spot.y, -1, 1));
  const lon = Math.atan2(spot.x, spot.z);
  return new THREE.Quaternion().setFromEuler(new THREE.Euler(lat, -lon, 0, "XYZ"));
}

function turnGlobe(spot, instant) {
  state.userTurned = false;
  state.restQ = spot ? restFor(spot) : (turn ? turn.to.clone() : globeQ.clone());
  state.aimQ = state.restQ;
  state.spin = 0;
  state.spun = false;
  if (instant || reduced) {
    globeQ.copy(state.restQ);
    turn = null;
    return;
  }
  const angle = globeQ.angleTo(state.restQ);
  turn = { from: globeQ.clone(), to: state.restQ.clone(), started: performance.now(), duration: clamp(500 + angle * 420, 700, 1500) };
}

// Any touch, key or wheel stops the resting spin and brings the centre back; a touch on the bare globe
// (the start of a turn or a zoom) only stops it, so the globe stays where the reader takes hold of it.
function touched(event) {
  state.lastTouch = performance.now();
  if (!state.spun || !state.aimQ) return;
  state.spun = false;
  state.spin = 0;
  if (event && bare(event.target)) return;
  const angle = globeQ.angleTo(state.aimQ);
  turn = { from: globeQ.clone(), to: state.aimQ.clone(), started: performance.now(), duration: clamp(500 + angle * 420, 600, 1500) };
}

/* ---------- the reader's own hands on the globe ---------- */

// Drag turns the globe (north stays up), pinch or wheel zooms, a tap looks at what is under the finger,
// a double-tap goes there. Only on the bare globe: the ring's pictures and buttons keep their own taps.
const grab = { ids: new Map(), moved: false, start: null, pinch: 0, fling: null, lastMove: 0, lastTap: null };
function bare(target) {
  return target === stage || target?.id === "links" || target?.id === "sun-glow" || target?.id === "globe"
    || !!target?.closest?.("#links");
}
// The globe's turn → the spot facing the reader, as latitude and longitude in radians.
const facing = new THREE.Vector3();
const unturnQ = new THREE.Quaternion();
function turnBy(dx, dy) {
  const r = globeFrame().r * view.zoom;
  facing.set(0, 0, 1).applyQuaternion(unturnQ.copy(globeQ).invert());
  const lat = clamp(Math.asin(clamp(facing.y, -1, 1)) + dy / r, -1.48, 1.48);
  const lon = Math.atan2(facing.x, facing.z) - dx / r;
  const spot = new THREE.Vector3(Math.cos(lat) * Math.sin(lon), Math.sin(lat), Math.cos(lat) * Math.cos(lon));
  globeQ.copy(restFor(spot));
  turn = null;
  state.aimQ = globeQ.clone();   // the reader's turn is kept until they go somewhere
  state.userTurned = true;
}
// Pointing with a mouse (or pen) at a question on the ring, its "+N" chip or one row of its list lights
// those answers on the globe; moving off puts the light out. Touch has no hover: a tap looks instead.
function setHover(hover) {
  const key = hover ? `${hover.slot}|${hover.id || ""}` : "";
  const was = state.hover ? `${state.hover.slot}|${state.hover.id || ""}` : "";
  if (key === was) return;
  state.hover = hover;
  lit.dirty = true;
}
function bindHover() {
  document.addEventListener("pointerover", (event) => {
    if (event.pointerType === "touch") return;
    const el = event.target.closest?.("[data-slot]");
    const slot = el?.dataset.slot;
    setHover(slot && slot !== "centre" && state.answers.get(state.centre)?.has(slot)
      ? { slot, id: el.dataset.hid || null } : null);
  });
  document.documentElement.addEventListener("pointerleave", () => setHover(null));

    stage.setPointerCapture?.(event.pointerId);
    grab.ids.set(event.pointerId, { x: event.clientX, y: event.clientY });
    grab.fling = null;
    if (grab.ids.size === 1) {
      grab.moved = false;
      grab.start = { x: event.clientX, y: event.clientY, t: performance.now() };
    } else {
      grab.moved = true;   // two fingers: a pinch, never a tap
      const [a, b] = [...grab.ids.values()];
      grab.pinch = Math.hypot(a.x - b.x, a.y - b.y);
    }
    stage.classList.add("grabbing");
  });
  stage.addEventListener("pointermove", (event) => {

    if (!was) return;

      grab.pinch = d;
      return;
    }
    if (!grab.moved && Math.hypot(now.x - grab.start.x, now.y - grab.start.y) < 6) return;
    grab.moved = true;

    const dy = now.y - was.y;
    turnBy(dx, dy);
    const t = performance.now();
    const dt = Math.max(8, t - grab.lastMove) / 1000;
    grab.lastMove = t;

    if (!grab.ids.has(event.pointerId)) return;
    grab.ids.delete(event.pointerId);
    if (grab.ids.size) {
      grab.pinch = 0;
      return;
    }
    stage.classList.remove("grabbing");
    if (event.type === "pointercancel") return;
    if (!grab.moved && performance.now() - grab.start.t < 600) {
      tapAt(event.clientX, event.clientY);

  stage.addEventListener("pointercancel", release);

// What is under the finger: a mark first (a city, a tiny country), else the area picture at that spot.
const raycaster = new THREE.Raycaster();
const ball = new THREE.Sphere(new THREE.Vector3(), 1);
const hitAt = new THREE.Vector3();
let areaPixels = null;   // the area picture, decoded once on the first tap
function areaReader() {
  if (areaPixels) return areaPixels;
  const name = state.earthFiles?.areas;
  if (!name) return Promise.resolve(null);
  areaPixels = fetch(`./earth/${name}`)
    .then((r) => r.blob())
    .then((blob) => createImageBitmap(blob, { colorSpaceConversion: "none", premultiplyAlpha: "none" }))
    .then((bitmap) => {
      const canvas = document.createElement("canvas");
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(bitmap, 0, 0);
      return ctx;
    })
    .catch((error) => { console.warn("Area picture could not be read.", error); return null; });

}
async function topicUnder(clientX, clientY) {
  const at = stage.getBoundingClientRect();
  const x = clientX - at.left;
  const y = clientY - at.top;
  let best = null;
  for (const mark of state.marks) {
    const d = Math.hypot((mark.x ?? -99) - x, (mark.y ?? -99) - y);
    if ((mark.alpha || 0) > .5 && d < 18 && (!best || d < best.d)) best = { d, id: mark.id };
  }
  if (best) return best.id;

  raycaster.setFromCamera({ x: (clientX - box.left) / box.width * 2 - 1, y: -((clientY - box.top) / box.height * 2 - 1) }, camera);

  const lat = Math.asin(clamp(hitAt.y, -1, 1)) * 180 / Math.PI;
  const lon = Math.atan2(hitAt.x, hitAt.z) * 180 / Math.PI;
  const ctx = await areaReader();
  if (!ctx) return null;
  const { width, height } = ctx.canvas;
  const px = ctx.getImageData(clamp(Math.floor((lon + 180) / 360 * width), 0, width - 1),
    clamp(Math.floor((90 - lat) / 180 * height), 0, height - 1), 1, 1).data;
  const code = px[0] + 256 * px[1];
  const index = code > 0 ? code : (px[2] % 8 ? 300 + (px[2] % 8) : 0);

}
async function tapAt(clientX, clientY) {

  grab.lastTap = { id, t: now };
  if (!id) return;
  if (again) {
    grab.lastTap = null;
    closePanel();
    return go(id);
  }
  if (id === state.centre) return showCard(id);
  const answers = state.answers.get(state.centre);
  const key = [...answers.keys()].find((k) => answers.get(k).some((a) => a.id === id));

const spinStep = new THREE.Quaternion();
const UP = new THREE.Vector3(0, 1, 0);
const skyStep = new THREE.Quaternion();
const sunSky = new THREE.Vector3();
const moonSky = new THREE.Vector3();

// Resting = on my topic, untouched for a while, nothing open on a phone.
// (With reduced motion the Earth still brightens at rest, but stays still.)
function resting(now) {
  return state.centre && state.centre === state.home
    && !(state.peek && stage.clientWidth <= 680 && $("panel").classList.contains("open"))
    && !$("results").classList.contains("open")
    && !$("sky-box").classList.contains("open")

function animate(now) {

    const p = Math.min(1, (now - view.zoomAnim.started) / 600);
    view.zoom = view.zoomAnim.from + (view.zoomAnim.to - view.zoomAnim.from) * (1 - Math.pow(1 - p, 3));

  skyQ.copy(globeQ).multiply(skyStep.setFromAxisAngle(UP, -gmst(clock.t)));
  sky.quaternion.copy(skyQ);
  sunW.fromArray(sunDir(clock.t)).applyQuaternion(skyQ);
  sunLocal.copy(sunW).applyQuaternion(unturn.copy(globeQ).invert());
  moonSky.fromArray(moonDir(clock.t));
  moonW.copy(moonSky).applyQuaternion(skyQ);
  placeMoon();
  placeSun();
  const u = planet.material.uniforms;
  if (lit.dirty) applyLit();
  for (let i = 0; i < 4; i += 1) lit.amt[i] += (lit.want[i] - lit.amt[i]) * Math.min(1, dt * 5);
  u.uLayerAmt.value.set(...lit.amt);
  u.uQuiet.value = look.quiet;
  if (state.earthBorn) u.uReady.value = smooth(0, 1, (now - state.earthBorn) / 900);
  if (stars) stars.material.uniforms.uBright.value = 1 - .45 * look.quiet;
  renderer.render(scene, camera);
}

// The Moon at its real direction, closer and bigger than life so it fits.
// It steps aside (fades) rather than cover the Earth's face.
function placeMoon() {
  moon.position.copy(moonW).multiplyScalar(LOOK.moonAt);
  moon.lookAt(world.position);
  const across = Math.hypot(moonW.x, moonW.y) * LOOK.moonAt;
  const inFront = moonW.z > 0 ? smooth(1.05, 1.3, across) : 1;
  moon.material.uniforms.uAlpha.value = inFront * (1 - .4 * look.quiet);
  moon.visible = inFront > .01;
}

// The Sun is far off screen: a soft glow at the stage's edge on its side.
function placeSun() {
  const el = $("sun-glow");
  const across = Math.hypot(sunW.x, sunW.y);
  const alpha = smooth(.08, .5, across) * (1 - .4 * look.quiet);
  el.style.opacity = alpha.toFixed(3);
  if (alpha < .01) return;
  const frame = globeFrame();
  const W = stage.clientWidth;
  const H = stage.clientHeight;
  const ux = sunW.x / across;
  const uy = -sunW.y / across;
  const tx = ux > 0 ? (W - frame.x) / ux : ux < 0 ? -frame.x / ux : Infinity;
  const ty = uy > 0 ? (H - frame.y) / uy : uy < 0 ? -frame.y / uy : Infinity;
  const t = Math.min(tx, ty);
  el.style.transform = `translate3d(${(frame.x + ux * t).toFixed(1)}px, ${(frame.y + uy * t).toFixed(1)}px, 0) translate(-50%, -50%)`;
}

/* ---------- the clock: what moment the Earth shows ---------- */

function tickClock(now, dt, lapsing) {
  if (clock.back) {
    const p = clamp((now - clock.back.started) / 1200, 0, 1);
    const e = p * p * (3 - 2 * p);
    clock.t = clock.back.from + (Date.now() - clock.back.from) * e;
    if (p === 1) clock.back = null;
  } else {
    clock.rate = lapsing ? 1 + (LAPSE - 1) * state.spin : 1;
    clock.t += dt * 1000 * clock.rate;
  }
  if (now - (clock.drawn || 0) > 250) {
    clock.drawn = now;
    drawClock();
  }
}

const DAY_FMT = new Intl.DateTimeFormat(undefined, { weekday: "short", day: "numeric", month: "short" });
const TIME_FMT = new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit" });
const ZONE = new Intl.DateTimeFormat(undefined, { timeZoneName: "short" })
  .formatToParts(new Date()).find((part) => part.type === "timeZoneName")?.value || "";

function drawClock() {
  const shown = new Date(clock.t);
  const fast = clock.rate > 2;
  const live = !fast && Math.abs(clock.t - Date.now()) < 90000;
  $("clock-day").textContent = `${DAY_FMT.format(shown)} ·`;
  $("clock-time").textContent = TIME_FMT.format(shown);
  $("clock-speed").textContent = fast ? `1 day ≈ ${DAY_SECONDS} s` : live ? "now" : "real speed";
  $("clock").classList.toggle("fast", fast);
  $("clock-now").hidden = live || !!clock.back;
  if ($("sky-box").classList.contains("open")) drawSkyFacts();
}

function drawSkyFacts() {
  const sun = overhead(sunDir(clock.t), clock.t);
  const lit = Math.round(moonLit(clock.t) * 100);
  const where = ({ lat, lon }) => `${Math.abs(lat).toFixed(0)}° ${lat >= 0 ? "N" : "S"}, ${Math.abs(lon).toFixed(0)}° ${lon >= 0 ? "E" : "W"}`;
  $("sky-facts").replaceChildren(
    node("p", "", `Showing ${DAY_FMT.format(new Date(clock.t))}, ${TIME_FMT.format(new Date(clock.t))} ${ZONE}.`),
    node("p", "", `The Sun is straight overhead at ${where(sun)}. Day and night are where they really are.`),
    node("p", "", `The Moon is ${lit}% lit, in its real direction; it is drawn closer and bigger than life so it fits.`),
    node("p", "", "The stars are every star you can see with your eyes, at their real places."),
  );
}

function drawSkyCredits() {
  const list = $("sky-credits");
  list.replaceChildren(...(state.earthLayers || []).map((layer) => {
    const item = node("li", "");
    item.append(node("strong", "", layer.what), node("span", "", ` ${layer.credit}, ${layer.years}. ${layer.licence}.`));
    return item;
  }));
}

function bindClock() {
  $("clock").addEventListener("click", () => {
    const box = $("sky-box");
    const open = !box.classList.contains("open");
    box.classList.toggle("open", open);
    $("clock").setAttribute("aria-expanded", String(open));
    if (open) drawSkyFacts();
  });
  $("clock-now").addEventListener("click", (event) => {
    event.stopPropagation();
    clock.back = { from: clock.t, started: performance.now() };
  });
  $("sky-close").addEventListener("click", () => {
    $("sky-box").classList.remove("open");
    $("clock").setAttribute("aria-expanded", "false");
  });
}
boot().catch((error) => {
  console.error(error);
  $("panel-body").replaceChildren(node("p", "", "The graph could not be loaded."));
  $("panel").classList.add("open");
});
</script>
</body>
