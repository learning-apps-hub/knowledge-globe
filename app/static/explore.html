<!doctype html>
<html lang="en" data-static-build="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Content-Security-Policy (audit R11): only this site, plus Wikimedia for pictures and the Commons picture search.
     The viewer is one file, so its own inline script and style must stay allowed. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://upload.wikimedia.org https://thumb.wikimedia.org https://commons.wikimedia.org; connect-src 'self' https://commons.wikimedia.org; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Knowledge Globe — Explore</title>
<!-- One graph of points and questions. Design: working files/ONE_GRAPH_DESIGN.md (vault). -->
<style>
  :root {
    color-scheme: dark;
    --night: #061017;
    --glass: rgba(9, 23, 31, .78);
    --glass-strong: rgba(10, 25, 34, .95);
    --line: rgba(190, 225, 235, .14);
    --line-strong: rgba(190, 225, 235, .28);
    --ink: #f3f7f7;
    --ink-soft: #b7c9ce;
    --ink-dim: #789098;
    --aqua: #55e4d1;
    --gold: #ffd57a;
    --gold-hot: #ffe7a8;
    --panel: 372px;
    --move: .8s cubic-bezier(.22, .8, .24, 1);
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--ink);
    font: 14px/1.5 "DM Sans", system-ui, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--aqua); outline-offset: 3px; }

  .app {
    position: fixed;
    inset: var(--app-top, 0px) 0 auto 0;
    /* --app-h is the height the browser really shows, --app-top where that starts (both from visualViewport). */
    height: var(--app-h, 100dvh);
    display: grid;
    /* One column: the Earth and its stars take the whole width. The card comes in over them, from the
       right on a wide screen and from the foot on a narrower one, only when asked for (Owner, 2026-11-16). */
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: 58px minmax(0, 1fr);
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(14, 34, 58, .30), transparent 62%),
      #02060b;
  }
  /* Read by screen readers, not shown (audit R6/F-08). */
  .vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  #globe:focus-visible { outline: 2px solid var(--gold); outline-offset: -4px; }
  #globe { grid-column: 1; grid-row: 1 / -1; width: 100%; height: 100%; min-width: 0; min-height: 0; }

  /* ONE menu bar over the whole width, the card's too, in ONE row on every screen (Owner, 2026-11-16):
     logo (the start) · Learn · the topic you are on · the time machine with the moment at its end · search ·
     language. */
  .top {
    grid-column: 1 / -1; grid-row: 1;
    z-index: 5;
    display: flex; align-items: center; gap: 10px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(2, 8, 13, .82), rgba(2, 8, 13, .55));
    backdrop-filter: blur(10px);
  }
  .brand {
    flex: none; display: inline-flex; padding: 0; border: 0; background: none; align-items: center; gap: 8px; height: 36px;
    color: var(--ink); text-decoration: none; font: 700 15px/1 "Manrope", sans-serif; letter-spacing: -.01em; white-space: nowrap;
  }
  .brand svg { width: 22px; height: 22px; flex: none; color: var(--aqua); }
  /* Round buttons in the bar: Learn, search (on a narrower screen) and the language. */
  .icon-btn {
    flex: none; display: grid; place-items: center; width: 36px; height: 36px; padding: 0;
    border: 1px solid var(--line-strong); border-radius: 50%; background: var(--glass); color: var(--ink);
  }
  .icon-btn svg { width: 17px; height: 17px; }
  /* Learn is a switch: lit while the Themes view is open, dim for a topic with nothing to learn yet. */
  .icon-btn[aria-pressed="true"] { background: var(--aqua); border-color: var(--aqua); color: #04222a; }
  .icon-btn:disabled { opacity: .38; cursor: default; }
  .lang { font: 700 12px/1 "Manrope", sans-serif; letter-spacing: .03em; }
  .lang:lang(zh), :lang(zh) .lang { letter-spacing: 0; font-size: 12px; }
  /* The language list: three choices under the button; picking one reloads the page in it. */
  .lang-wrap { position: relative; flex: none; }
  .lang-list {
    position: absolute; right: 0; top: 42px; z-index: 7; min-width: 150px; padding: 6px;
    border: 1px solid var(--line-strong); border-radius: 14px;
    background: var(--glass-strong); box-shadow: 0 22px 70px rgba(0, 0, 0, .5);
  }
  .lang-list[hidden] { display: none; }
  .lang-list button {
    display: block; width: 100%; padding: 9px 12px; border: 0; border-radius: 9px;
    background: none; color: var(--ink); text-align: left; font: 600 14px/1.2 "Manrope", sans-serif;
  }
  .lang-list button:hover, .lang-list button:focus-visible { background: rgba(85, 228, 209, .12); }
  .lang-list button[aria-pressed="true"] { color: var(--aqua); }
  /* Words left in English inside another language, and words drafted by AI: a small quiet tag. */
  .lang-tag {
    display: inline-block; margin-left: 6px; padding: 1px 6px; border: 1px solid var(--line-strong); border-radius: 8px;
    color: var(--ink-dim); font: 600 9.5px/1.4 "Manrope", sans-serif; letter-spacing: .04em; vertical-align: middle;
  }
  /* The moment, in one row (Owner, 2026-11-16): the year at the left of the time machine's handle; at its
     right "Now", which takes the year and the clock back to now and is lit only while either is away; then
     the clock (the time of day), which opens the drawer. Nothing here changes width, so the handle never
     moves under the finger. */
  .when { flex: 1 0 auto; min-width: 0; display: flex; align-items: center; gap: 8px; }
  /* The handle keeps its room; the topic's name shortens instead. */
  .when > input { flex: 1; width: 0; min-width: 96px; height: 28px; margin: 0; accent-color: var(--gold); }
  .when-now {
    flex: none; height: 30px; padding: 0 11px; border: 1px solid var(--gold); border-radius: 99px;
    background: color-mix(in srgb, var(--gold) 14%, transparent); color: var(--gold);
    font: 700 12px/1 "Manrope", sans-serif; cursor: pointer;
  }
  .when-now:disabled { border-color: var(--line); background: none; color: var(--ink-dim); cursor: default; }
  /* The clock, split (Owner, 2026-11-18): its symbol is the "all lit" switch (the whole Earth evenly lit, any
     time); the time opens the drawer. All lit = the face filled gold, the pill gold-tinted, the time reads
     "All lit". */
  .moment {
    flex: none; display: inline-flex; align-items: stretch; height: 36px; overflow: hidden;
    border: 1px solid var(--line-strong); border-radius: 99px; background: var(--glass);
    color: var(--ink-soft); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .moment > button {
    display: inline-flex; align-items: center; margin: 0; padding: 0; border: 0; background: none;
    color: inherit; font: inherit; cursor: pointer;
  }
  /* Owner's pick D2 (2026-11-18): a clock first (dark face, bright rim, hands, four hour marks), gold rays
     outside it with a glow behind them only, which breathes at rest; lit (on, hover, press) = the face fills
     gold and the hands and marks go dark, like a lamp switched on. */
  .moment .sym { width: 40px; justify-content: center; padding-left: 4px; transition: background .25s; }
  .moment .sym svg { width: 23px; height: 23px; flex: none; overflow: visible; }
  .moment .sym .dial { fill: var(--night); stroke: var(--ink-soft); transition: fill .25s, stroke .25s; }
  .moment .sym .hands { stroke: var(--ink); stroke-width: 2.2; transition: stroke .25s; }
  .moment .sym .ticks { stroke: var(--ink-soft); stroke-width: 1.6; transition: stroke .25s; }
  .moment .sym .rays { stroke: var(--gold); transition: stroke .25s; }
  .moment .sym .halo { stroke: var(--gold); stroke-width: 3.4; opacity: .75; filter: url(#rayglow);
    transition: opacity .25s, stroke-width .25s; }
  @keyframes ray-breathe { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .moment:not(.all) .sym:not(:hover):not(:active) .halo { animation: ray-breathe 3.2s ease-in-out infinite; }
  .moment.all .sym .dial, .moment .sym:hover .dial, .moment .sym:active .dial { fill: var(--gold); stroke: var(--gold-hot); }
  .moment.all .sym .hands, .moment .sym:hover .hands, .moment .sym:active .hands,
  .moment.all .sym .ticks, .moment .sym:hover .ticks, .moment .sym:active .ticks { stroke: var(--night); }
  .moment.all .sym .halo, .moment .sym:hover .halo, .moment .sym:active .halo { opacity: 1; stroke-width: 4.4; }
  .moment.all .sym .rays, .moment .sym:hover .rays, .moment .sym:active .rays { stroke: var(--gold-hot); }
  .moment:has(.sym:hover), .moment:has(.sym:active) { border-color: color-mix(in srgb, var(--gold) 60%, transparent); }
  .moment .sym:hover, .moment .sym:active { background: color-mix(in srgb, var(--gold) 16%, transparent); }
  #clock { padding: 0 12px 0 8px; border-left: 1px solid var(--line); }
  #clock.fast #clock-time { color: var(--gold); }
  #clock-time small { margin-left: 2px; font-size: max(12px, .72em); letter-spacing: .02em; }
  /* The time and "All lit" share one cell, so the pill keeps its width when the switch flips (the handle
     beside it never moves). */
  #clock-time { display: inline-grid; justify-items: center; }
  #clock-time > span { grid-area: 1 / 1; }
  #clock-time > .all-word, .moment.all #clock-time > .time-word { visibility: hidden; }
  .moment.all #clock-time > .all-word { visibility: visible; }
  .moment.all { border-color: color-mix(in srgb, var(--gold) 60%, transparent); }
  .moment.all .sym { background: color-mix(in srgb, var(--gold) 16%, transparent); }
  .moment.all #clock { color: var(--gold); font-weight: 600; }
  .moment > button:focus-visible { outline: 2px solid var(--aqua); outline-offset: -3px; border-radius: 99px; }
  .moment:has(#clock[aria-expanded="true"]) { border-color: var(--aqua); }
  .search-open { display: none; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    height: 36px; padding: 0 13px;
    border: 1px solid var(--line-strong); border-radius: 99px;
    background: var(--glass); backdrop-filter: blur(10px);
    white-space: nowrap; text-decoration: none; color: var(--ink);
  }
  .pill svg { width: 15px; height: 15px; flex: none; }
  .pill small { color: var(--ink-dim); font-size: 12px; }
  .search { position: relative; flex: 0 1 300px; min-width: 150px; }
  .search input {
    width: 100%; height: 36px; padding: 0 14px;
    border: 1px solid var(--line-strong); border-radius: 99px;
    background: var(--glass); backdrop-filter: blur(10px);
  }
  .search input::placeholder { color: var(--ink-dim); }
  .results {
    position: absolute; left: 0; right: 0; top: 42px; z-index: 6;
    display: none; max-height: 56vh; overflow: auto; padding: 6px;
    border: 1px solid var(--line-strong); border-radius: 14px;
    background: var(--glass-strong); box-shadow: 0 22px 70px rgba(0, 0, 0, .5);
  }
  .results.open { display: block; }
  .results h4 { margin: 6px 8px 4px; color: var(--ink-dim); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
  .results button {
    display: block; width: 100%; padding: 8px 10px; border: 0; border-radius: 9px;
    background: none; text-align: left;
  }
  .results button:hover, .results button:focus-visible { background: rgba(85, 228, 209, .12); }
  .results button small { display: block; color: var(--ink-dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .results .been { color: var(--aqua); }
  .results .been.here { color: var(--ink); }
  .results .been.here small { color: var(--aqua); }

  /* A narrower screen: still one row. The logo is its mark only and search is a button; tapped, its box
     takes the row until it is done with. */
  @media (max-width: 900px) {
    .brand span { display: none; }
    .search { flex: none; min-width: 0; position: static; }
    .search input { display: none; }
    .search-open { display: grid; }
    .top.finding > :not(.brand, .search) { display: none; }
    .top.finding .search { flex: 1; position: relative; }
    .top.finding .search input { display: block; }
    .top.finding .search-open { display: none; }
  }

  /* The globe takes the reader's own drag, pinch and wheel, not the browser's page zoom or scroll. */
  #stage { grid-column: 1; grid-row: 2; position: relative; z-index: 1; min-width: 0; min-height: 0; overflow: hidden;
    touch-action: none; cursor: grab; -webkit-user-select: none; user-select: none; }
  #stage.grabbing { cursor: grabbing; }
  #links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* Answers on the question ring are flat pictures, placed by place() every
     frame, so only their size eases here. */
  .tok {
    --accent: var(--aqua);
    position: absolute; left: 0; top: 0;
    will-change: transform, opacity;
    transition: width var(--move), height var(--move);
  }
  /* A pin: the mark at a topic's true place on Earth. The current topic's pin
     carries its name. Beams run from a pin to its answer on the ring. */
  .mark { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; will-change: transform, opacity; }
  .mark i {
    position: absolute; left: -4.5px; top: -4.5px; width: 9px; height: 9px; border-radius: 50%;
    background: color-mix(in srgb, var(--accent) 55%, white);
    box-shadow: 0 0 0 2px rgba(1, 10, 16, .75), 0 0 12px 2px var(--accent);
  }
  .mark.soft i { left: -3px; top: -3px; width: 6px; height: 6px; box-shadow: 0 0 0 1.5px rgba(1, 10, 16, .7), 0 0 8px var(--accent); }
  .mark.here i, .mark.nodot i { display: none; }
  .mark.here.is-pin i { display: block; }
  .mark b {
    position: absolute; left: 0; bottom: var(--lift, 9px); transform: translateX(-50%);
    padding: 3px 9px; border-radius: 99px; white-space: nowrap;
    background: rgba(4, 16, 22, .72); border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
    color: var(--ink); font: 700 13px/1.2 "Manrope", sans-serif;
  }
  /* One country (or an area too small to see): the name stands clear of it, on a thin stem. */
  .mark b { transition: opacity .2s; }
  /* No room over the place (a short phone screen: an answer's words are there): the name goes under it,
     and with no room there either it steps aside. place() chooses. */
  .mark.under b { bottom: auto; top: var(--lift, 9px); }
  .mark.under.lift b::after { top: auto; bottom: calc(100% + 1px); transform: scaleY(-1); }
  .mark.off b { opacity: 0; }
  .mark.lift b::after {
    content: ""; position: absolute; left: 50%; top: calc(100% + 1px); width: 1.5px; margin-left: -.75px;
    height: calc(var(--lift, 9px) - 3px); border-radius: 1px;
    background: linear-gradient(color-mix(in srgb, var(--accent) 75%, transparent), color-mix(in srgb, var(--accent) 25%, transparent));
  }
  .beam { transition: none; }
  /* Bright at the place, fading towards the ring: it starts somewhere real and only leads the eye out. */
  .beam line { stroke-linecap: round; }
  .beam stop { stop-color: var(--accent); }
  .beam .glow { stroke-width: 5; stroke-opacity: .2; }
  .beam .core { stroke-width: 1.25; }
  .face {
    position: absolute; inset: 0;
    display: block; padding: 0; overflow: hidden;
    border: 2px solid color-mix(in srgb, var(--accent) 70%, transparent);
    border-radius: 50%;
    background: linear-gradient(162deg, color-mix(in srgb, var(--accent) 30%, #0a1017) 0%, #0a2735 60%, #06161f 100%);
    box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 24%, transparent), 0 2px 5px rgba(0, 0, 0, .6);
    transition: border-radius var(--move), box-shadow .3s ease, transform .2s ease;
  }
  .tok.dot .face:hover { transform: scale(1.06); }
  /* A set: every answer has a place, so the globe shows them all and the ring shows how many. */
  .tok.set .face { border-style: dashed; }
  .tok.set .cap strong { -webkit-line-clamp: 3; }
  .tok.set.count .init { font: 800 22px/1 "Manrope", sans-serif; color: color-mix(in srgb, var(--accent) 85%, white); }
  .tok.peeked .face { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 45%, transparent), 0 0 34px var(--accent); }
  .tok.centre .face {
    border-width: 3px;
    box-shadow: 0 0 0 6px rgba(85, 228, 209, .16), 0 0 46px rgba(85, 228, 209, .45), 0 3px 8px rgba(0, 0, 0, .6);
  }
  .face img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0; transition: opacity .4s ease;
  }
  .tok.has-photo .face img { opacity: 1; }
  .init {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: color-mix(in srgb, var(--accent) 80%, white);
    font: 700 20px/1 "Manrope", sans-serif; letter-spacing: .02em;
  }
  .tok.has-photo .init { display: none; }
  .tok.centre .init { font-size: 34px; }
  .cap {
    position: absolute; left: 50%; top: 100%;
    width: var(--capw, 150px); margin-top: 5px; transform: translateX(-50%);
    text-align: center; pointer-events: none;
  }
  .cap strong {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    font: 600 12.5px/1.25 "Manrope", sans-serif;
    text-shadow: 0 1px 8px #000, 0 0 14px #000;
  }
  .cap small { display: none; }
  .tok.centre .cap strong { font-size: 16px; }

  .q {
    position: absolute; left: 0; top: 0;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 0 2px 5px; text-align: center;
    color: color-mix(in srgb, var(--accent) 72%, white);
    font: 700 11.5px/1.2 "DM Sans", sans-serif;
    text-shadow: 0 1px 8px #000, 0 0 14px #000;
    pointer-events: none;
  }
  /* With a mouse, pointing at a question lights its answers (Owner, 2026-11-13). */
  @media (hover: hover) { .q { pointer-events: auto; cursor: default; } }
  /* A question on the ring: a line icon and one or two words (Owner's pick, 2026-11-14). */
  .q.short { gap: 5px; align-items: center; padding-bottom: 4px; font-size: 12.5px; letter-spacing: .01em; white-space: nowrap; }
  .q.short svg {
    flex: none; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9;
    stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 4px #000) drop-shadow(0 0 6px #000);
  }
  .more {
    position: absolute; left: 0; top: 0; z-index: 2;
    min-width: 30px; height: 24px; padding: 0 7px;
    border: 1px solid color-mix(in srgb, var(--accent) 70%, transparent); border-radius: 99px;
    background: #0a1c26; color: var(--ink);
    font: 700 11px/1 "DM Sans", sans-serif;
  }
  /* A bigger finger target than the chip looks. */
  .more::before { content: ""; position: absolute; inset: -10px; }

  /* The card. No card at rest: the Earth alone, at full size, in the middle (Owner, 2026-11-16). It opens on
     a tap of the topic in the middle or of a question, or a double tap on another topic; × shuts it. */
  .panel {
    position: absolute; top: 58px; right: 0; bottom: 0; width: var(--panel);
    z-index: 4;
    display: flex; flex-direction: column; min-height: 0;
    border-left: 1px solid var(--line);
    background: var(--glass-strong);
    transform: translateX(104%); visibility: hidden;
    transition: transform .35s cubic-bezier(.22, .8, .24, 1), visibility 0s .35s;
  }
  .panel.open { transform: none; visibility: visible; transition: transform .35s cubic-bezier(.22, .8, .24, 1); }
  .panel-grip { display: none; }
  .panel-body { flex: 1; min-height: 0; overflow: auto; padding: 18px 20px 22px; }
  .panel-kicker { margin: 0 0 8px; color: var(--ink-dim); font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
  .panel h2 { margin: 0 0 8px; font: 700 23px/1.15 "Manrope", sans-serif; letter-spacing: -.02em; }
  .panel p { margin: 0 0 12px; color: var(--ink-soft); }
  .panel .lead { color: var(--ink); font-size: 15.5px; line-height: 1.45; }
  .shot {
    position: relative; margin: 0 0 14px; aspect-ratio: 16 / 10; overflow: hidden;
    border: 1px solid var(--line); border-radius: 12px; background: #0a2735;
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot figcaption {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 10px 6px;
    background: linear-gradient(180deg, transparent, rgba(4, 12, 18, .92) 55%);
    color: var(--ink); font-size: 10.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .shot a { color: inherit; }
  /* Facts: sourced values about this one topic (ONE_GRAPH_DESIGN.md, "Facts on topics"). */
  .panel h2 .flag {
    height: .82em; width: auto; margin-right: .4em; vertical-align: -.06em;
    border-radius: 3px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .28);
  }
  .facts { clear: both; margin: 0 0 14px; padding: 2px 12px; border: 1px solid var(--line); border-radius: 10px; }
  .facts div { display: grid; grid-template-columns: 82px 1fr auto; gap: 8px; align-items: baseline; padding: 7px 0; }
  .facts div + div { border-top: 1px solid var(--line); }
  .facts dt { color: var(--gold); font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .facts dd { margin: 0; min-width: 0; color: var(--ink); font-size: 13.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .facts dd small { opacity: .62; font-size: 11px; white-space: nowrap; }
  .facts a { display: inline-block; padding: 6px 0 6px 6px; opacity: .62; font-size: 10.5px; }
  .flag-credit { margin: -8px 0 14px; opacity: .62; font-size: 10.5px; }
  .flag-credit a { color: inherit; }
  .fact { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
  .fact b { display: block; color: var(--gold); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 16px; }
  .btn {
    min-height: 44px; padding: 0 18px;
    border: 1px solid var(--line-strong); border-radius: 99px; background: rgba(255, 255, 255, .05);
    font-weight: 600;
  }

<script type="module">
import * as THREE from "./static/vendor/three.module.min.js";
import { SIDEREAL_DAY, fromRaDec, gmst, moonDir, moonLit, overhead, starColor, sunDir } from "./static/sky.js";

/* ---------- languages (Owner, 2026-11-17: English, Simplified Chinese, Polish) ----------
   The language is picked before anything is drawn: the link's ?lang=, else the reader's last pick, else the
   browser's own language. Switching reloads the page in the new language (the opening plays once per tab, so
   it does not play again). English is written in the code; the others come from ./api/lang/<code>.json:
   `words` (this app's own words, drafted by AI, keyed by the English), `names` (Wikidata labels), `facts`
   (word facts from Wikidata labels), `themes` / `subs` (that language's Wikipedia). Anything missing stays
   English and is tagged as English. */
const LANGS = {
  en: { label: "EN", name: "English", locale: "en" },
  zh: { label: "中文", name: "中文（简体）", locale: "zh-CN" },
  pl: { label: "PL", name: "Polski", locale: "pl" },
};
// Owner, 2026-11-17: the switch shows and the browser's language / a saved pick count ("bring back languages").
// false hides it again: English for everyone, other languages only by ?lang=.
const LANGS_READY = true;
const LANG = (() => {
  const asked = new URLSearchParams(location.search).get("lang");
  if (LANGS[asked]) return asked;
  if (!LANGS_READY) return "en";
  try {
    const saved = localStorage.getItem("kg-lang");
    if (LANGS[saved]) return saved;
  } catch { /* storage may be unavailable */ }
  for (const code of navigator.languages || [navigator.language || ""]) {
    const short = String(code).toLowerCase();
    if (short.startsWith("zh")) return /hant|tw|hk|mo/.test(short) ? "en" : "zh";
    if (short.startsWith("pl")) return "pl";
    if (short.startsWith("en")) return "en";
  }
  return "en";
})();
const LOCALE = LANGS[LANG].locale;
const DATE_LOCALE = LANG === "en" ? undefined : LOCALE;   // English keeps the reader's own date style
document.documentElement.lang = LOCALE;
const SPOKEN = { words: {}, names: {}, facts: {}, themes: {}, subs: {} };   // filled by loadLanguage()
const PLURAL = new Intl.PluralRules(LOCALE);
const NUMBER = new Intl.NumberFormat(LOCALE);
const AGO = new Intl.NumberFormat(LOCALE, { notation: "compact" });   // deep time: zh 45亿 / 7.5亿 / 6600万
// The app's own words in the chosen language: t("Go to {name}", { name }). A number in `vars` is written the
// language's way; `n` also picks the plural form when the translation has several ({ one, few, many, other }).
// A key may carry a context after "|" ("Languages|official": the official-languages fact, 官方语言, not the
// Languages door, 语言); the English shown is the part before it.
function t(english, vars) {
  let said = SPOKEN.words[english] ?? english.split("|")[0];
  if (said && typeof said === "object") said = said[PLURAL.select(vars?.count ?? vars?.n ?? 0)] ?? said.other ?? english;
  if (!vars) return said;
  return said.replace(/\{(\w+)\}/g, (all, key) => {
    const value = vars[key];
    if (value == null) return all;
    return typeof value === "number" ? NUMBER.format(value) : String(value);
  });
}
async function loadLanguage() {
  if (LANG === "en") return;
  try {
    const response = await fetch(`./api/lang/${LANG}.json`);
    if (response.ok) Object.assign(SPOKEN, await response.json());
  } catch { /* English stays: every t() falls back to it */ }
}
// Before anything else is set up: the labels below (question words, themes, door facts) read the words once.
await loadLanguage();
// The topic data in the chosen language. The English name stays as `en`, so search finds both.
function speakGraph(graph) {
  if (LANG === "en") return;
  const word = (text) => (text ? SPOKEN.words[text] ?? text : text);
  for (const sides of Object.values(graph.kinds)) {
    sides.out = word(sides.out);
    sides.back = word(sides.back);
  }
  for (const point of graph.points) {
    point.en = point.name;
    // Wikidata's label first; else a name drafted by AI (tagged on the card); else the English, as it is.
    point.nameDrafted = !SPOKEN.names[point.id] && Boolean(SPOKEN.words[point.name]);
    point.name = SPOKEN.names[point.id] || word(point.name);
    point.lineDrafted = Boolean(point.line && SPOKEN.words[point.line]);
    point.line = word(point.line);
    point.more = word(point.more);
    point.did_you_know = word(point.did_you_know);
    for (const fact of point.facts || []) {
      const said = SPOKEN.facts[point.id]?.[fact.key];
      if (said) fact.said = said;
    }
    // A door reads that language's own Wikipedia page where it has one (never a machine translation of the
    // English page); else it keeps the English words, tagged in themeDoor().
    for (const door of point.themes || []) speakDoor(door, SPOKEN.themes[point.id]?.[door.key]);
    for (const door of point.subs || []) speakDoor(door, SPOKEN.subs[point.id]?.[`${door.under}/${door.key}`]);
  }
  for (const link of graph.links) link.why = word(link.why);
}
function speakDoor(door, page) {
  if (!page) return;
  Object.assign(door, { title: page.title, text: page.text, source: page.source, spoken: true });
}
const WORKED_GDP ="everything made in the year, divided by the people";
// "Madrid, its capital" under a country card's photo, with the capital's name in the chosen language.
function capitalOf(visual) {
  const capital = visual.capital && state.points.get(visual.capital);
  return capital ? t("{name}, its capital", { name: capital.name }) : visual.of;
}
// A sentence written for this app, in another language: drafted by AI (tagged so), or still English (tagged
// and marked lang="en" so a screen reader reads it right).
function saidBy(el, drafted) {
  if (LANG === "en") return el;
  const english = !drafted;
  if (english) el.lang = "en";
  const tag = node("span", "lang-tag", english ? "English" : t("AI-translated"));
  tag.title = english ? t("Not translated yet") : t("Translated by AI; tell us if something reads wrong");
  el.append(tag);
  return el;
}
// Search finds a topic by its name in the chosen language or in English.
const named = (point, text) => point.name.toLowerCase().includes(text) || Boolean(point.en?.toLowerCase().includes(text));
// The static markup's labels: the same table, matched by their English words.
function speakPage() {
  if (LANG === "en") return;
  for (const el of document.querySelectorAll("[aria-label], [title], [placeholder], [data-t]")) {
    for (const attr of ["aria-label", "title", "placeholder"]) {
      if (el.hasAttribute(attr)) el.setAttribute(attr, t(el.getAttribute(attr)));
    }
    if (el.hasAttribute("data-t")) el.textContent = t(el.textContent.trim());
  }
}
// The switch in the bar: a short list of the three; picking one reloads the page in it (the link keeps it).
function bindLanguage() {
  const button = document.getElementById("lang");
  const list = document.getElementById("lang-list");
  if (!LANGS_READY && LANG === "en") { button.closest(".lang-wrap").hidden = true; return; }
  button.textContent = LANGS[LANG].label;
  button.setAttribute("aria-label", t("Language: {name}", { name: LANGS[LANG].name }));
  button.title = t("Language");
  for (const [code, one] of Object.entries(LANGS)) {
    const pick = document.createElement("button");
    pick.type = "button";
    pick.lang = one.locale;
    pick.textContent = one.name;
    pick.setAttribute("aria-pressed", String(code === LANG));
    pick.addEventListener("click", () => {
      try { localStorage.setItem("kg-lang", code); } catch { /* the link still carries it */ }
      if (code === LANG) { list.hidden = true; return; }
      const url = new URL(location.href);
      url.searchParams.set("lang", code);
      location.replace(url);
    });
    list.append(pick);
  }
  button.addEventListener("click", (event) => {
    event.stopPropagation();
    list.hidden = !list.hidden;
    button.setAttribute("aria-expanded", String(!list.hidden));
  });
  document.addEventListener("click", (event) => {
    if (!list.hidden && !list.contains(event.target)) {
      list.hidden = true;
      button.setAttribute("aria-expanded", "false");
    }
  });

async function boot() {

  state.kinds = graph.kinds;

  for (const point of graph.points) {
    state.points.set(point.id, point);
    state.answers.set(point.id, new Map());
    const where = point.where;
    if (where?.codes?.length === 1 && !state.byArea.has(where.codes[0])) state.byArea.set(where.codes[0], point.id);
    if (where?.ocean) state.byArea.set(300 + where.ocean, point.id);

    const map = state.answers.get(owner);
    if (!map.has(key)) map.set(key, []);
    if (!map.get(key).some((a) => a.id === other)) map.get(key).push({ id: other, why: link.why, mark: link.mark });
  };
  for (const link of graph.links) {
    const both = state.kinds[link.kind]?.out === state.kinds[link.kind]?.back;   // like, next: same both ways
    if (both) {
      put(link.from, `${link.kind}.out`, link.to, link);

      put(link.from, `${link.kind}.out`, link.to, link);

    // at its best size, wherever the reader had turned or zoomed the Earth.
    recentre();

  // leaves the globe where it is: it has no place to show.
  const at = state.points.get(id).at;

  el.className = "tok set";
  el.dataset.id = id;
  el.innerHTML = `<button class="face" type="button"><span class="init"></span><img alt="" decoding="async" referrerpolicy="no-referrer"></button>
    <span class="cap"><strong></strong></span>`;
  const words = setWords(list);
  el.querySelector(".cap strong").textContent = words;
  el.querySelector(".face").setAttribute("aria-label", `${question(slot)} ${words}. Show them all.`);
  el.querySelector(".face").addEventListener("click", () => showList(el.dataset.slot));
  if (list.length > 3) {
    el.querySelector(".init").textContent = String(list.length);
    el.classList.add("count");
  } else {
    const point = state.points.get(headline(list).id);
    el.querySelector(".init").textContent = initials(point.name);
    const img = el.querySelector("img");
    visualFor(point).then((visual) => {
      if (!visual) return;
      img.addEventListener("load", () => el.classList.add("has-photo"), { once: true });
      img.src = visual.src;
    });
  }
  el.style.opacity = "0";
  stage.append(el);
  pins.add(el);
  return el;
}

// Where an answer sits on the question ring: `az` is the screen direction
// from the globe's middle (0 = right, 90 = up).
function ringAt(az, frame) {
  const a = THREE.MathUtils.degToRad(az);
  return { x: frame.x + frame.rx * Math.cos(a), y: frame.y - frame.ry * Math.sin(a) };
}

// Neighbours on the ring are eased apart until no question label sits on
// another answer's name or picture.
const meter = document.createElement("canvas").getContext("2d");
function textBox(text, font, max, lineH) {
  meter.font = font;
  const w = meter.measureText(text).width;
  const lines = Math.min(2, Math.ceil(w / max));
  return { w: Math.min(w, max), h: lines * lineH };
}
function ease(spots, { phone, frame, answers }) {
  if (spots.length < 2) return;
  const W = stage.clientWidth;
  const { D, blockW } = frame;
  for (const spot of spots) {
    const name = state.points.get(headline(answers.get(spot.home.key)).id).name;
    spot.q = questionBox(spot.home.key, phone, blockW - 4);
    spot.cap = textBox(name, `600 ${phone ? 11.5 : 12.5}px Manrope`, blockW, phone ? 14.5 : 16);
  }
  const boxes = (spot) => {
    const at = ringAt(spot.az, frame);
    const qx = clamp(at.x, blockW / 2 + 4, W - blockW / 2 - 4);
    return [
      { x0: qx - spot.q.w / 2, x1: qx + spot.q.w / 2, y0: at.y - D / 2 - 5 - spot.q.h, y1: at.y - D / 2 - 3 },
      { x0: at.x - D / 2, x1: at.x + D / 2, y0: at.y - D / 2, y1: at.y + D / 2 },
      { x0: at.x - spot.cap.w / 2, x1: at.x + spot.cap.w / 2, y0: at.y + D / 2 + 4, y1: at.y + D / 2 + 6 + spot.cap.h },
    ];
  };
  const pad = 4; // breathing room between one answer's words and the next
  const hit = (a, b) => a.some((p) => b.some((q) => p.x0 < q.x1 + pad && q.x0 < p.x1 + pad && p.y0 < q.y1 + pad && q.y0 < p.y1 + pad));
  for (let pass = 0; pass < 60; pass += 1) {
    let moved = false;
    for (let i = 0; i < spots.length; i += 1) {
      const a = spots[i];
      const b = spots[(i + 1) % spots.length];
      if (a === b || !hit(boxes(a), boxes(b))) continue;
      a.az -= 1.5;
      b.az += 1.5;
      moved = true;
    }
    if (!moved) break;
  }
}

// Works out every answer's place on the question ring, its size and its
// label. The ring is flat on the screen and does not turn with the globe;
// only pins and beams ride the globe (place() moves them every frame).
function layout() {
  const W = stage.clientWidth;
  const H = stage.clientHeight;
  if (!W || !H || !state.centre || !state.restQ) return;
  const phone = W <= 680;
  const frame = globeFrame(0, view.sheetTo);
  const answers = state.answers.get(state.centre);
  const shown = HOMES.filter((home) => answers.has(home.key));
  const centre = state.points.get(state.centre);

  const cd = clamp(frame.r * (phone ? .5 : .42), 80, 190);
  const gap = phone ? 42 : 32; // degrees between neighbours on the ring

  // Each question's own direction first, then neighbours are eased apart
  // until their labels have room. The order around the globe never changes.
  const spots = [];
  for (const [side, { axis, turn: way }] of Object.entries(SIDES)) {
    const homes = shown.filter((home) => home.side === side);
    const step = homes.length > 1 ? Math.min(gap, 84 / (homes.length - 1)) : 0;
    homes.forEach((home, i) => {
      spots.push({ home, az: (axis + way * (i - (homes.length - 1) / 2) * step + 360) % 360 });
    });
  }
  spots.sort((a, b) => a.az - b.az);
  const room = Math.min(gap, 360 / Math.max(1, spots.length));
  for (let pass = 0; pass < 40 && spots.length > 1; pass += 1) {
    for (let i = 0; i < spots.length; i += 1) {
      const a = spots[i];
      const b = spots[(i + 1) % spots.length];
      const apart = (b.az - a.az + 360) % 360 || 360;
      if (apart < room) {
        a.az -= (room - apart) / 2;
        b.az += (room - apart) / 2;
      }
    }
  }

  ease(spots, { phone, frame, answers });

  const now = performance.now();
  // New answers wait until the globe has nearly finished turning.
  const delay = turn ? turn.duration * .45 : 0;
  // A topic with a real place IS its place: the globe turns to it and lights
  // it up, and no picture covers it. A topic without one (an idea) floats in
  // front of the globe as a picture, never as a pin.
  const want = centre.at ? [] : [{ slot: "centre", id: state.centre, size: cd, to: { x: frame.x, y: frame.y } }];
  const blocks = [];
  for (const { home, az } of spots) {
    const list = answers.get(home.key);
    const set = isSet(list);
    const id = set ? `set:${state.centre}:${home.key}` : headline(list).id;
    blocks.push({ slot: home.key, count: list.length, set, width: frame.blockW, born: now + delay });
    want.push({ slot: home.key, id, set: set ? list : null, width: frame.blockW, size: frame.D, to: ringAt(az, frame) });
  }

  // Reuse the picture already showing a topic: it glides round the ring to
  // its new place instead of popping out and back in.
  const spare = [...toks.values()];
  toks.clear();
  for (const item of want) {
    const at = spare.findIndex((el) => el.dataset.id === item.id);
    const el = at >= 0 ? spare.splice(at, 1)[0]
      : item.set ? makeSet(item.id, item.slot, item.set) : makeTok(state.points.get(item.id));
    if (!el.pos) {
      el.pos = { ...item.to };
      el.born = now + delay;
    } else if (!reduced) {
      el.move = { from: { ...el.pos }, started: now, duration: 650 };
    }
    el.target = { ...item.to };
    if (reduced) el.pos = { ...item.to };
    const isCentre = item.slot === "centre";
    el.dataset.slot = item.slot;
    el.classList.toggle("centre", isCentre);
    el.classList.toggle("dot", !isCentre);
    el.classList.remove("peeked");
    el.style.zIndex = isCentre ? "1" : "2";
    el.style.width = `${item.size}px`;
    el.style.height = `${item.size}px`;
    el.size = item.size;
    el.style.setProperty("--capw", `${item.width || 190}px`);
    el.style.setProperty("--accent", isCentre ? "#55e4d1" : KIND_COLOR[kindOf(item.slot)]);
    if (!item.set) {
      const point = state.points.get(item.id);
      el.querySelector(".face").setAttribute("aria-label", isCentre ? `${point.name}. Open its card.` : `${question(item.slot)} ${point.name}`);
    }
    toks.set(item.slot, el);
  }
  for (const el of spare) {
    el.dying = now;
    el.dataset.slot = "";
    el.style.zIndex = "0";
  }

  // Question labels and "+N" chips are rebuilt, then follow their answer.
  for (const block of state.blocks) {
    block.label.remove();
    block.more?.remove();
  }
  const labelH = phone ? 28 : 32;
  for (const block of blocks) {
    const color = KIND_COLOR[kindOf(block.slot)];
    block.labelH = labelH;
    block.label = questionLabel(block.slot);
    block.label.dataset.slot = block.slot;
    block.label.style.setProperty("--accent", color);
    Object.assign(block.label.style, { width: `${block.width}px`, height: `${labelH}px`, opacity: "0" });
    stage.append(block.label);
    if (block.count > 1 && !block.set) {
      block.more = node("button", "more", `+${block.count - 1}`);
      block.more.dataset.slot = block.slot;
      block.more.type = "button";
      block.more.style.setProperty("--accent", color);
      block.more.style.opacity = "0";
      block.more.setAttribute("aria-label", `${question(block.slot)} ${t("{n} answers. Show all.", { n: block.count })}`);
      block.more.addEventListener("click", () => showList(block.slot));
      stage.append(block.more);
    }
  }
  // How much room each answer's words really take, read once here: the current topic's name keeps clear
  // of them (place()).
  const inked = (el) => {
    if (!el) return null;
    const range = document.createRange();
    range.selectNodeContents(el);
    return range.getBoundingClientRect();
  };
  for (const block of blocks) {
    const cap = inked(toks.get(block.slot)?.querySelector(".cap strong"));
    const label = inked(block.label);
    Object.assign(block, { capW: cap?.width || block.width, capH: cap?.height || 30, labelW: label?.width || block.width });
  }
  state.blocks = blocks;
  drawMarks(now + delay);
  place(now);
}

// Pins and beams. The current topic's mark carries its name. Only an answer with no border to see gets
// a pin and a beam to its picture on the ring: a pin (a city, a pole) or an area too small to see. A
// country, a set, a line or half the Earth is drawn on the globe instead (applyLit): its lit border is
// the light, so it is never pointed at. Every pin of a set, and every tiny area of a set, gets a mark.
// Like the light, an answer's mark and beam show only while it is pointed at or looked at: on arrival
// only the current topic shows (Owner, 2026-11-13).
function pointable(point) {
  return point.shape === "pin" || (point.shape === "area" && !!point.tiny);
}
function peekColor() {
  return state.peek?.key ? KIND_COLOR[kindOf(state.peek.key)] : "#55e4d1";
}
// How far (radians) a name stands above its place: above one country, or above a tiny area's ring.
function liftOf(point) {
  return point.shape !== "area" ? 0 : point.tiny ? .052 : point.where?.codes?.length === 1 ? .07 : 0;
}

// With a mouse, the place under the pointer shows its name on the Earth, nothing more: it does not light,
// wake the Earth or open a card (Owner, 2026-11-15). Kept apart from the other marks so it comes and goes
// without the rest fading in again.
function setOver(id, again = false) {
  if (id === state.over && !again) return;
  state.over = id;
  state.overMark?.el.remove();
  state.overMark = null;
  const point = id && state.points.get(id);
  if (!point?.at || id === state.centre || id === state.peek?.id || state.themes) return;
  const lift = liftOf(point);
  const el = node("div", `mark${point.shape === "pin" ? " is-pin" : ""}${lift ? " lift" : ""}${pointable(point) ? "" : " nodot"}`);
  el.style.setProperty("--accent", "#55e4d1");
  el.append(node("i"), node("b", "", point.name));
  el.style.opacity = "0";
  stage.append(el);
  const mark = { el, id, born: performance.now() - 200, anchor: vecAt(point.at.lat, point.at.lon), show: 1,
    tag: true, tagW: el.lastChild.offsetWidth, tagH: el.lastChild.offsetHeight };
  if (lift) mark.above = vecAt(point.at.lat + lift * 180 / Math.PI, point.at.lon);
  state.overMark = mark;
}

function drawMarks(born = performance.now()) {
  lit.dirty = true;
  const svg = $("links");
  svg.setAttribute("viewBox", `0 0 ${stage.clientWidth} ${stage.clientHeight}`);
  svg.replaceChildren();
  for (const mark of state.marks) mark.el.remove();
  state.marks = [];
  const marked = new Set();
  const add = (point, { slot = null, of = null, color = "#55e4d1", here = false, soft = false, named = here } = {}) => {
    if (!point?.at || marked.has(point.id)) return;
    marked.add(point.id);
    // A name (the current topic's, or the one looked at) stands above one country (about 4 degrees up) or
    // above a tiny area's ring.
    const lift = named ? liftOf(point) : 0;
    const dot = here || pointable(point) ? "" : " nodot";   // a country looked at has its border lit, no dot
    const el = node("div", `mark${here ? " here" : ""}${slot ? " ringed" : ""}${soft ? " soft" : ""}${point.shape === "pin" ? " is-pin" : ""}${lift ? " lift" : ""}${named ? dot : ""}`);
    el.style.setProperty("--accent", color);
    el.append(node("i"));
    if (named) el.append(node("b", "", point.name));
    el.style.opacity = "0";
    stage.append(el);
    const mark = { el, slot, of, born, id: point.id, anchor: vecAt(point.at.lat, point.at.lon), show: of ? 0 : 1 };
    if (named) Object.assign(mark, { tag: true, tagW: el.lastChild.offsetWidth, tagH: el.lastChild.offsetHeight });
    if (lift) mark.above = vecAt(point.at.lat + lift * 180 / Math.PI, point.at.lon);
    if (slot) {
      mark.beam = document.createElementNS("http://www.w3.org/2000/svg", "g");
      mark.beam.setAttribute("class", "beam");
      mark.beam.style.setProperty("--accent", color);
      const fade = document.createElementNS("http://www.w3.org/2000/svg", "linearGradient");
      fade.id = `beam-${state.marks.length}`;
      fade.setAttribute("gradientUnits", "userSpaceOnUse");
      for (const [offset, opacity] of [[0, .95], [.55, .55], [1, .3]]) {
        const stop = document.createElementNS("http://www.w3.org/2000/svg", "stop");
        stop.setAttribute("offset", offset);
        stop.setAttribute("stop-opacity", opacity);
        fade.append(stop);
      }
      mark.beam.append(fade);
      for (const kind of ["glow", "core"]) {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("class", kind);
        line.setAttribute("stroke", `url(#${fade.id})`);
        mark.beam.append(line);
      }
      svg.append(mark.beam);
    }
    state.marks.push(mark);
  };
  const centre = state.points.get(state.centre);
  add(centre, { here: true });
  const answers = state.answers.get(state.centre);
  // The answer you are looking at: its name on the Earth, its pin, and its beam too when it is the one on
  // the ring. A country you look at lights up whole, so it gets its name and no pin.
  const look = state.peek?.id && state.points.get(state.peek.id);
  if (look) {
    const tok = toks.get(state.peek.key);
    const onRing = pointable(look) && tok && !tok.classList.contains("set") && tok.dataset.id === look.id;
    add(look, { slot: onRing ? state.peek.key : null, color: peekColor(), named: true });
  }
  for (const [slot, el] of toks) {
    if (slot === "centre") continue;
    const color = KIND_COLOR[kindOf(slot)];
    if (el.classList.contains("set")) {
      for (const answer of answers.get(slot) || []) {
        const point = state.points.get(answer.id);
        if (point.shape === "pin") add(point, { of: slot, color });
        else if (point.tiny) add(point, { of: slot, color, soft: true });
      }
    } else {
      const point = state.points.get(el.dataset.id);
      if (point && pointable(point)) add(point, { slot, of: slot, color });
    }
  }
  if (state.over) setOver(state.over, true);   // its name goes when that place is now the topic or the one looked at
}

// While you look at an answer with a place, the globe turns to show it (with
// the current topic too, when both fit on the front). Otherwise the globe
// rests on the current topic.
function aimGlobe() {
  if (!state.restQ) return;
  // A place tapped on the Earth itself is already in sight: the Earth stays as it is. Only going there
  // (a double tap) centres it (Owner, 2026-11-16).
  if (state.peek?.still) return;
  let want = state.restQ;
  const point = state.peek?.id && state.points.get(state.peek.id);
  // Once the reader has turned the globe by hand, it stays where they put it: it turns only to show an
  // answer that is out of sight.
  if (state.userTurned) {
    if (!point?.at) return;
    const there = vecAt(point.at.lat, point.at.lon);
    if (there.clone().applyQuaternion(globeQ).z > .35) return;
    want = restFor(there);
  } else if (point?.at) {
    const there = vecAt(point.at.lat, point.at.lon);
    const seen = there.clone().applyQuaternion(state.restQ).z;
    if (seen < .55) {
      const centre = state.points.get(state.centre);
      const here = centre.at && vecAt(centre.at.lat, centre.at.lon);
      want = restFor(here && here.angleTo(there) < 1.4 ? here.add(there).normalize() : there);
    }
  }
  if (state.aimQ && state.aimQ.equals(want)) return;
  state.aimQ = want;
  if (reduced) {
    globeQ.copy(want);
    turn = null;
    return;
  }
  const angle = globeQ.angleTo(want);
  if (angle < .002) return;
  turn = { from: globeQ.clone(), to: want.clone(), started: performance.now(), duration: clamp(500 + angle * 420, 600, 1400) };
}
/* ---------- the card: peek before go ---------- */

function setTall(tall) {
  $("panel").classList.toggle("tall", tall);
  $("panel-grip").setAttribute("aria-expanded", String(tall));
  $("panel-grip").setAttribute("aria-label", tall ? t("Make the card lower") : t("Make the card taller"));
  requestAnimationFrame(moreBelow);
}
function openPanel() {
  $("panel").classList.add("open");
  sheetMoved();
  setTall(false);
  requestAnimationFrame(moreBelow);
}
// A fade at the sheet's foot while there is more to scroll.
function moreBelow() {
  const body = $("panel-body");
  body.classList.toggle("more-below", body.scrollHeight - body.scrollTop - body.clientHeight > 6);
}
function closePanel() {
  $("panel").classList.remove("open");
  for (const el of toks.values()) el.classList.remove("peeked");
  const had = state.peek;
  state.peek = null;
  sheetMoved();
  if (had) {
    drawMarks();
    aimGlobe();
  }
}

function node(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined) el.textContent = text;
  return el;
}

function cardInto(body, point) {
  const figure = node("figure", "shot");
  figure.hidden = true;
  const img = node("img");
  img.alt = t("Photograph of {name}", { name: point.name });
  img.referrerPolicy = "no-referrer";
  const credit = node("figcaption");
  figure.append(img, credit);
  body.append(figure);
  visualFor(point).then((visual) => {
    if (!visual || !figure.isConnected) return;
    img.addEventListener("load", () => { figure.hidden = false; }, { once: true });
    img.src = visual.src;
    credit.append(`${t("Photo:")} ${visual.of ? `${capitalOf(visual)} · ` : ""}${visual.credit || visual.artist || t("source contributor")} · `);
    const link = node("a", "", visual.licence || t("source"));
    link.href = visual.page;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    credit.append(link);
  });
  const facts = new Map((point.facts || []).map((fact) => [fact.key, fact]));
  const flag = facts.get("flag");
  const title = node("h2", "", point.name);
  if (flag) {
    const badge = node("img", "flag");
    badge.alt = t("Flag of {name}", { name: point.name });
    badge.referrerPolicy = "no-referrer";
    badge.src = flag.src;
    title.prepend(badge);
  }
  body.append(point.nameDrafted ? saidBy(title, true) : title);
  if (point.line) body.append(saidBy(node("p", "lead", point.line), point.lineDrafted));
  factsInto(body, point);
  if (point.shape === "pin" && Number.isFinite(point.where?.lat)) {
    // Close up, in 3D and at street level: Google Earth, outside this app (Owner, 2026-11-13: tier A + link).
    const { lat, lon } = point.where;
    const out = node("a", "earth-link", t("See it close up in Google Earth ↗"));
    out.href = `https://earth.google.com/web/@${lat},${lon},0a,${Math.abs(lat) > 89 ? 3000000 : 20000}d,35y,0h,0t,0r`;
    out.target = "_blank";
    out.rel = "noopener noreferrer";
    body.append(out);
  }
  if (point.stub) body.append(node("p", "hint", t("Only a name so far. This point is waiting for its own answers.")));
}

// A topic's facts, one row each, each with the place it was read from. The flag is the badge by the name;
// its colours and shapes are not listed here (Owner, 2026-11-14) but search still finds them.
const FACT_ROWS = [["people", t("People")], ["size", t("Size")], ["languages", t("Languages|official")], ["money", t("Money")]];
const FACT_WORD = { languages: t("Languages|official"), money: t("Money"), "flag-colours": t("Flag"), "flag-shapes": t("Flag"), government: t("Government"), head: t("Head of state") };
// The facts follow the time machine as the doors do: a value through the years gives that year's, one known
// for today only says so.
function factsInto(body, point) {
  const list = node("dl", "facts");
  for (const [key, label] of FACT_ROWS) {
    const at = factAt(point, key, state.year);
    if (!at) continue;
    const { fact } = at;
    const row = node("div");
    const value = node("dd", "", at.gone ? t("Nothing yet for {year}", { year: String(state.year) }) : at.text);
    if (at.gone) value.style.color = "var(--ink-dim)";
    else if (at.as_of) value.append(" ", node("small", "", t("in {year}", { year: at.as_of })));
    const source = node("a", "", t("source"));
    source.href = fact.source;
    source.target = "_blank";
    source.rel = "noopener noreferrer";
    source.setAttribute("aria-label", t("Source for {what}: Wikidata", { what: label.toLowerCase() }));
    row.append(node("dt", "", label), value, source);
    list.append(row);
  }
  if (list.children.length) body.append(list);
  const flag = point.facts?.find((one) => one.key === "flag");
  if (flag) {
    const credit = node("p", "flag-credit", `${t("Flag picture:")} ${flag.credit} · `);
    const link = node("a", "", flag.licence || t("source"));
    link.href = flag.page;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    credit.append(link);
    body.append(credit);
  }
}

function showCard(id) {
  unhush();
  const point = state.points.get(id);
  const body = $("panel-body");
  body.replaceChildren(node("p", "panel-kicker", t("What is it?")));
  cardInto(body, point);
  if (point.did_you_know) {
    const fact = node("p", "fact");
    fact.append(node("b", "", t("Did you know")), point.did_you_know);
    body.append(fact);
  }
  if (point.more) body.append(node("p", "", point.more));
  const actions = node("div", "actions");
  if (hasThemes(point)) {
    const open = node("button", "btn go", t("Learn"));
    open.type = "button";
    open.setAttribute("aria-label", t("Learn about {name}: its themes", { name: point.name }));
    open.addEventListener("click", () => enterThemes([id]));
    actions.append(open);
  }
  if (state.home !== id) {
    const pin = node("button", "btn", t("Make this my topic"));
    pin.type = "button";
    pin.addEventListener("click", () => {
      state.home = id;
      state.trail = [id];
      drawTrail();
      showCard(id);
    });
    actions.append(pin);
  }
  if (actions.children.length) body.append(actions);
  if (point.sources?.length) {
    const list = node("ul", "sources");
    for (const source of point.sources) {
      const item = node("li");
      const link = node("a", "", source.title);
      link.href = source.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      item.append("Source: ", link);
      list.append(item);
    }
    body.append(list);
  }
  body.scrollTop = 0;
  for (const el of toks.values()) el.classList.remove("peeked");
  const had = state.peek;
  state.peek = null;
  if (had) {
    drawMarks();
    aimGlobe();
  }
  openPanel();
}

// One tap or click on a place, an answer on the ring or a row of a list LOOKS at it: it lights, and its name
// stands on the Earth. No card opens; going there (a double tap, or Go) brings its card (Owner, 2026-11-15).
// `key` is the question it answers; null when it was tapped on the globe and answers none. `still`: it was
// tapped on the Earth itself, so it is already in sight and the Earth stays as it is.
function lookAt(id, key = null, still = false) {
  awake();
  const list = state.peek?.list;
  const inList = !!list && (state.answers.get(state.centre).get(list) || []).some((a) => a.id === id);
  // An open list about something else would no longer match the lights: the card shuts.
  if (list && !inList) closePanel();
  state.peek = inList ? { list, id, key: list, still } : { id, key, still };
  for (const [slot, el] of toks) el.classList.toggle("peeked", slot === state.peek.key);
  for (const row of $("panel-body").querySelectorAll(".rows li")) row.classList.toggle("chosen", inList && row.dataset.hid === id);
  drawMarks();
  aimGlobe();
}

function showList(key) {
  awake();
  const centre = state.points.get(state.centre);
  const list = state.answers.get(state.centre).get(key) || [];
  const color = KIND_COLOR[kindOf(key)];
  const body = $("panel-body");
  body.replaceChildren(
    node("p", "panel-kicker", centre.name),
    node("h2", "", question(key)),
    node("p", "hint", t("{n} answers. Tap one to look at it without leaving {name}, or Go to move there.", { n: list.length, name: centre.name })),
  );
  const rows = node("ul", "rows");
  for (const answer of list) {
    const point = state.points.get(answer.id);
    const item = node("li");
    item.dataset.slot = key;
    item.dataset.hid = answer.id;
    const button = node("button", "row");
    button.type = "button";
    const disc = node("span", "disc", initials(point.name));
    disc.style.setProperty("--accent", color);
    const text = node("span");
    text.append(node("strong", "", point.name));
    if (answer.why || point.line) text.append(node("small", "", answer.why || point.line));
    button.append(disc, text);
    button.addEventListener("click", () => lookAt(answer.id, key));
    button.addEventListener("dblclick", () => go(answer.id, { card: true }));
    const goRow = node("button", "row-go", "Go");
    goRow.type = "button";
    goRow.setAttribute("aria-label", t("Go to {name}", { name: point.name }));
    goRow.addEventListener("click", () => go(answer.id, { card: true }));
    item.append(button, goRow);
    rows.append(item);
  }
  body.append(rows);
  body.scrollTop = 0;
  for (const [slot, el] of toks) el.classList.toggle("peeked", slot === key);
  state.peek = { list: key };
  drawMarks();
  aimGlobe();
  openPanel();
}

// No topic button in the bar (Owner, 2026-11-16): the logo starts again from the very first view (a plain
// link, Owner 2026-11-16), and search, opened empty, lists where you have been: the topic you are on first,
// then newest first.
function drawTrail() {
  drawModes();
}

function beenTo() {
  return [state.centre, ...new Set([...state.trail].reverse())].filter((id, i, all) => all.indexOf(id) === i);
}

// The bar's Learn button went (Owner, 2026-11-17: deep time takes its place); Learn opens from the card and the
// Themes view's own "Globe" button goes back. Kept as the hook the views call when they change.
function drawModes() {}

function drawResults(term) {
  const box = $("results");
  const text = term.trim().toLowerCase();
  let title = t("Good places to start");
  let ids = state.starts;
  const been = text ? [] : beenTo().slice(0, 9);
  if (!text) ids = ids.filter((id) => !been.includes(id) && id !== state.centre);
  if (text) {
    title = t("Points");
    ids = [...state.points.values()]
      .filter((point) => named(point, text))
      .sort((a, b) => a.name.toLowerCase().indexOf(text) - b.name.toLowerCase().indexOf(text) || a.name.localeCompare(b.name))
      .slice(0, 12)
      .map((point) => point.id);
  }
  // Facts answer too: "red" finds flags with red, "euro" who pays in it, "portuguese" where it is spoken.
  const hits = text.length < 3 ? [] : [...state.points.values()].flatMap((point) => {
    const fact = (point.facts || []).find((one) => Array.isArray(one.value)
      && one.value.some((word) => word.toLowerCase().split(/[ -]+/).some((part) => part.startsWith(text))));
    return fact && !ids.includes(point.id) ? [{ id: point.id, why: `${FACT_WORD[fact.key]}: ${fact.text}` }] : [];
  }).sort((a, b) => state.points.get(a.id).name.localeCompare(state.points.get(b.id).name));
  const row = ({ id, why, mark }) => {
    const point = state.points.get(id);
    const button = node("button", mark || "");
    button.type = "button";
    button.append(point.name);
    if (why || point.line) button.append(node("small", "", why || point.line));
    button.addEventListener("click", () => {
      $("search").value = "";
      box.classList.remove("open");
      $("top").classList.remove("finding");
      closePanel();
      go(id);
    });
    return button;
  };
  const parts = [];
  if (been.length) {
    parts.push(node("h4", "", t("Where you've been")));
    parts.push(...been.map((id) => (id === state.centre
      ? row({ id, why: t("You are here"), mark: "been here" }) : row({ id, mark: "been" }))));
  }
  if (ids.length || !hits.length) parts.push(node("h4", "", ids.length ? title : t("Nothing by that name yet")));
  parts.push(...ids.map((id) => row({ id })));
  if (hits.length) {
    parts.push(node("h4", "", `${t("Facts")} · ${hits.length === 1 ? t("1 topic") : t("{n} topics", { n: hits.length })}`));
    parts.push(...hits.slice(0, 60).map(row));
  }
  box.replaceChildren(...parts);
  box.classList.add("open");
}

function enterThemes(rows, key = "facts") {

// The link follows the view. It is written a moment later and at most a few times a second: the time machine's
// handle asks for it on every step, and Safari throws once a page writes its history 100 times in 30 seconds.
let hashTimer = 0;
function themesHash() {
  clearTimeout(hashTimer);
  hashTimer = setTimeout(() => {
    if (!state.themes) return;
    const { rows } = state.themes;
    const { year } = state;
    const key = state.themes.inside ? `${state.themes.key}.${state.themes.sub}` : state.themes.key;
    const others = rows.slice(1).map(encodeURIComponent).join(",");

    } catch (error) { /* the link is a convenience; the view goes on without it */ }
