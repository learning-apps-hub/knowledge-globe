<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07131b">
<meta name="description" content="Explore big ideas as a living, zoomable world of connected knowledge.">
<title>Knowledge Globe — See how everything connects</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap");

  :root {
    color-scheme: dark;
    --night: #061017;
    --night-2: #091820;
    --glass: rgba(9, 23, 31, .78);
    --glass-strong: rgba(10, 25, 34, .94);
    --line: rgba(190, 225, 235, .14);
    --line-strong: rgba(190, 225, 235, .28);
    --ink: #f3f7f7;
    --ink-soft: #b7c9ce;
    --ink-dim: #789098;
    --aqua: #55e4d1;
    --aqua-2: #1daea6;
    --gold: #ffd57a;
    --panel-width: 390px;
    --rail-width: 274px;
    --top-height: 72px;
    --shadow: 0 22px 70px rgba(0, 0, 0, .38);
  }

  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--ink);
    font: 14px/1.55 "DM Sans", system-ui, sans-serif;
  }
  button, select, input { font: inherit; }
  button, select { color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--aqua); outline-offset: 3px; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .app {
    height: 100%;
    display: grid;
    grid-template-rows: var(--top-height) minmax(0, 1fr);
    background:
      radial-gradient(circle at 52% 45%, rgba(13, 78, 94, .18), transparent 36%),
      linear-gradient(145deg, #061017 0%, #07151d 54%, #050c12 100%);
  }

  .topbar {
    position: relative;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 22px;
    border-bottom: 1px solid var(--line);
    background: rgba(5, 15, 21, .8);
    backdrop-filter: blur(20px);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    min-width: max-content;
  }
  .brand-mark {
    width: 34px;
    height: 34px;
    border: 1px solid rgba(85, 228, 209, .42);
    border-radius: 50%;
    position: relative;
    box-shadow: inset 0 0 16px rgba(85, 228, 209, .18), 0 0 24px rgba(85, 228, 209, .08);
  }
  .brand-mark::before,
  .brand-mark::after {
    content: "";
    position: absolute;
    inset: 6px 3px;
    border: 1px solid rgba(85, 228, 209, .66);
    border-radius: 50%;
  }
  .brand-mark::after { inset: 3px 11px; }
  .brand-title {
    font: 700 15px/1 "Manrope", sans-serif;
    letter-spacing: -.02em;
  }
  .brand-kicker {
    display: block;
    margin-top: 4px;
    color: var(--ink-dim);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  .subject-wrap {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 18px;
    border-left: 1px solid var(--line);
  }
  .subject-wrap label {
    color: var(--ink-dim);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  #subject-picker {
    appearance: none;
    border: 0;
    background: transparent;
    padding: 7px 24px 7px 4px;
    font-weight: 600;
    cursor: pointer;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%),
      linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
    background-position: calc(100% - 8px) 50%, calc(100% - 4px) 50%;
    background-size: 4px 4px, 4px 4px;
    background-repeat: no-repeat;
  }

  .search {
    position: relative;
    width: min(390px, 34vw);
    margin-left: auto;
  }
  .search::before {
    content: "";
    position: absolute;
    left: 14px;
    top: 50%;
    width: 9px;
    height: 9px;
    border: 1.5px solid var(--ink-dim);
    border-radius: 50%;
    transform: translateY(-58%);
  }
  .search::after {
    content: "";
    position: absolute;
    left: 24px;
    top: 53%;
    width: 6px;
    height: 1.5px;
    background: var(--ink-dim);
    transform: rotate(45deg);
    transform-origin: left center;
  }
  #search-input {
    width: 100%;
    height: 40px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: rgba(255, 255, 255, .045);
    color: var(--ink);
    padding: 0 42px;
    transition: border-color .2s, background .2s;
  }
  #search-input::placeholder { color: var(--ink-dim); }
  #search-input:focus {
    outline: none;
    border-color: rgba(85, 228, 209, .48);
    background: rgba(255, 255, 255, .07);
  }
  .search-key {
    position: absolute;
    right: 11px;
    top: 9px;
    padding: 2px 6px;
    color: var(--ink-dim);
    border: 1px solid var(--line);
    border-radius: 5px;
    font-size: 10px;
  }
  .search-results {
    position: absolute;
    top: 48px;
    left: 0;
    right: 0;
    display: none;
    max-height: 350px;
    overflow: auto;
    padding: 7px;
    border: 1px solid var(--line-strong);
    border-radius: 13px;
    background: var(--glass-strong);
    box-shadow: var(--shadow);
    backdrop-filter: blur(20px);
  }
  .search-results.open { display: block; }
  .search-result {
    display: block;
    width: 100%;
    padding: 10px 11px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    text-align: left;
    cursor: pointer;
  }
  .search-result:hover,
  .search-result.active { background: rgba(255, 255, 255, .07); }
  .search-result strong { display: block; font-size: 13px; }
  .search-result span { color: var(--ink-dim); font-size: 11px; }

  .top-action {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(255, 255, 255, .035);
    padding: 9px 12px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .top-action:hover { border-color: var(--line-strong); color: var(--ink); }

  .workspace {
    min-height: 0;
    display: grid;
    grid-template-columns: var(--rail-width) minmax(340px, 1fr) var(--panel-width);
  }

  .rail {
    position: relative;
    z-index: 12;
    overflow-y: auto;
    padding: 24px 18px 20px;
    border-right: 1px solid var(--line);
    background: linear-gradient(90deg, rgba(6, 17, 23, .94), rgba(6, 17, 23, .72));
    scrollbar-width: thin;
  }
  .section-label {
    margin: 0 0 11px;
    color: var(--ink-dim);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .15em;
    text-transform: uppercase;
  }
  .overview-card {
    margin-bottom: 24px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background:
      radial-gradient(circle at 100% 0, rgba(85, 228, 209, .11), transparent 52%),
      rgba(255, 255, 255, .028);
  }
  .overview-card h2 {
    margin: 0 0 7px;
    font: 700 23px/1.1 "Manrope", sans-serif;
    letter-spacing: -.035em;
  }
  .overview-card p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 12px;
    line-height: 1.5;
  }
  .overview-stats {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }
  .overview-stats div { flex: 1; }
  .overview-stats strong {
    display: block;
    font: 700 16px/1 "Manrope", sans-serif;
  }
  .overview-stats span { color: var(--ink-dim); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; }

  .angle-list {
    display: grid;
    gap: 5px;
    margin-bottom: 24px;
  }
  .angle {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 38px;
    padding: 7px 9px;
    border: 1px solid transparent;
    border-radius: 9px;
    background: transparent;
    color: var(--ink-soft);
    text-align: left;
    cursor: pointer;
  }
  .angle:hover { background: rgba(255, 255, 255, .04); }
  .angle[aria-pressed="true"] {
    border-color: color-mix(in srgb, var(--angle-color) 46%, transparent);
    background: color-mix(in srgb, var(--angle-color) 11%, transparent);
    color: var(--ink);
  }
  .angle-dot {
    width: 7px;
    height: 7px;
    margin-right: 10px;
    border-radius: 50%;
    background: var(--angle-color);
    box-shadow: 0 0 10px var(--angle-color);
  }
  .angle-count {
    margin-left: auto;
    color: var(--ink-dim);
    font-size: 10px;
  }

  .place-list { display: grid; gap: 5px; }
  .place {
    position: relative;
    width: 100%;
    padding: 10px 10px 10px 27px;
    border: 1px solid transparent;
    border-radius: 9px;
    background: transparent;
    color: var(--ink-soft);
    text-align: left;
    cursor: pointer;
  }
  .place::before {
    content: "";
    position: absolute;
    left: 10px;
    top: 15px;
    width: 6px;
    height: 6px;
    border: 1px solid var(--place-color, var(--aqua));
    border-radius: 50%;
  }
  .place:hover { background: rgba(255, 255, 255, .04); color: var(--ink); }
  .place.selected {
    border-color: var(--line);
    background: rgba(255, 255, 255, .06);
    color: var(--ink);
  }
  .place strong { display: block; font-size: 12px; font-weight: 600; }
  .place small { display: block; margin-top: 2px; color: var(--ink-dim); font-size: 10px; }

  .globe-stage {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    isolation: isolate;
  }
  .globe-stage.dragging { cursor: grabbing; }
  .globe-stage::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(circle at 50% 50%, rgba(26, 121, 134, .12), transparent 42%),
      radial-gradient(circle at 20% 80%, rgba(39, 72, 100, .1), transparent 34%);
  }
  #globe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .globe-fallback {
    position: absolute;
    inset: 30% 18%;
    display: none;
    place-items: center;
    color: var(--ink-soft);
    text-align: center;
  }

  .crumbs {
    position: absolute;
    z-index: 8;
    top: 19px;
    left: 22px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    pointer-events: none;
  }
  .crumbs button {
    overflow: hidden;
    max-width: 190px;
    padding: 5px 8px;
    border: 0;
    border-radius: 7px;
    background: rgba(6, 17, 23, .46);
    color: var(--ink-soft);
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
    pointer-events: auto;
    backdrop-filter: blur(8px);
  }
  .crumbs button:last-of-type { color: var(--ink); }
  .crumb-sep { color: var(--ink-dim); font-size: 11px; }

  .level-readout {
    position: absolute;
    z-index: 7;
    top: 58px;
    left: 29px;
    color: var(--ink-dim);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    pointer-events: none;
  }
  .level-readout strong { color: var(--aqua); }

  .node-pins {
    position: absolute;
    inset: 0;
    z-index: 6;
    pointer-events: none;
  }
  .pin {
    --pin-color: var(--aqua);
    position: absolute;
    left: 0;
    top: 0;
    display: flex;
    align-items: center;
    gap: 7px;
    max-width: 170px;
    padding: 7px 10px 7px 8px;
    border: 1px solid rgba(221, 248, 246, .3);
    border-radius: 999px;
    background: rgba(6, 18, 24, .84);
    color: var(--ink);
    box-shadow: 0 8px 22px rgba(0, 0, 0, .3);
    opacity: 0;
    transform: translate(-50%, -50%);
    transition: opacity .18s, border-color .18s, filter .18s;
    pointer-events: auto;
    cursor: pointer;
    backdrop-filter: blur(8px);
  }
  .pin.visible { opacity: 1; }
  .pin.dimmed { opacity: .17; filter: grayscale(.8); }
  .pin.selected {
    border-color: var(--pin-color);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--pin-color) 18%, transparent), 0 10px 30px rgba(0, 0, 0, .42);
  }
  .pin-orb {
    width: 9px;
    height: 9px;
    flex: none;
    border: 2px solid rgba(255, 255, 255, .75);
    border-radius: 50%;
    background: var(--pin-color);
    box-shadow: 0 0 12px var(--pin-color);
  }
  .pin-label {
    overflow: hidden;
    font-size: 11px;
    font-weight: 600;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .globe-toolbar {
    position: absolute;
    z-index: 9;
    right: 18px;
    top: 20px;
    display: grid;
    gap: 7px;
  }
  .tool-button {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(7, 19, 26, .74);
    color: var(--ink-soft);
    font-size: 18px;
    cursor: pointer;
    backdrop-filter: blur(10px);
  }
  .tool-button:hover { border-color: var(--line-strong); color: var(--ink); }
  .tool-button.reset { font-size: 12px; }

  .globe-hint {
    position: absolute;
    z-index: 7;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 8px 13px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(6, 17, 23, .66);
    color: var(--ink-dim);
    font-size: 10px;
    white-space: nowrap;
    pointer-events: none;
    backdrop-filter: blur(10px);
  }
  .globe-hint span { color: var(--ink-soft); }

  .detail {
    position: relative;
    z-index: 15;
    overflow-y: auto;
    border-left: 1px solid var(--line);
    background:
      linear-gradient(180deg, rgba(13, 32, 41, .98), rgba(7, 20, 27, .98));
    scrollbar-width: thin;
  }
  .detail-inner { min-height: 100%; padding: 27px 28px 38px; }
  .detail-topline {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }
  .detail-kicker {
    color: var(--aqua);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  .verified {
    margin-left: auto;
    color: var(--ink-dim);
    font-size: 9px;
  }
  .detail h1 {
    margin: 0;
    font: 700 clamp(25px, 2.4vw, 34px)/1.08 "Manrope", sans-serif;
    letter-spacing: -.045em;
  }
  .angle-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 12px;
  }
  .angle-tag {
    padding: 3px 7px;
    border: 1px solid color-mix(in srgb, var(--tag-color) 38%, transparent);
    border-radius: 999px;
    background: color-mix(in srgb, var(--tag-color) 9%, transparent);
    color: color-mix(in srgb, var(--tag-color) 82%, white);
    font-size: 9px;
    font-weight: 600;
  }
  .lede {
    margin: 17px 0 0;
    color: #d9e7e8;
    font-size: 16px;
    line-height: 1.52;
  }
  .node-visual {
    position: relative;
    min-height: 190px;
    margin: 20px 0 2px;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 14px;
    background:
      radial-gradient(circle at 72% 18%, rgba(85, 228, 209, .18), transparent 34%),
      linear-gradient(145deg, rgba(13, 55, 68, .95), rgba(5, 19, 27, .98));
  }
  .node-visual img {
    display: block;
    width: 100%;
    height: clamp(190px, 24vw, 290px);
    object-fit: cover;
    opacity: 0;
    transition: opacity .3s ease;
  }
  .node-visual.ready img { opacity: 1; }
  .visual-loading {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    color: var(--ink-dim);
    font-size: 10px;
    letter-spacing: .08em;
    text-align: center;
    text-transform: uppercase;
  }
  .node-visual.ready .visual-loading { display: none; }
  .visual-caption {
    position: absolute;
    inset: auto 0 0;
    padding: 34px 12px 10px;
    background: linear-gradient(transparent, rgba(2, 10, 15, .9));
    color: #dbe8e9;
    font-size: 10px;
    line-height: 1.4;
    opacity: 0;
    transition: opacity .3s ease;
  }
  .node-visual.ready .visual-caption { opacity: 1; }
  .visual-credit {
    display: block;
    margin-top: 4px;
    color: #a8bcbe;
  }
  .visual-credit a { color: #8cece0; text-decoration: none; }
  .node-visual.failed { min-height: 86px; }
  .node-visual.failed .visual-loading { color: var(--ink-dim); text-transform: none; }
  .fact-card {
    margin: 22px 0;
    padding: 16px 17px;
    border: 1px solid rgba(85, 228, 209, .23);
    border-radius: 13px;
    background:
      linear-gradient(130deg, rgba(85, 228, 209, .11), rgba(85, 228, 209, .025));
  }
  .fact-card span,
  .story-section h2,
  .sources h2 {
    display: block;
    margin: 0 0 6px;
    color: var(--ink-dim);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  .fact-card strong {
    display: block;
    color: var(--gold);
    font: 600 16px/1.35 "Manrope", sans-serif;
  }
  .story-section {
    padding: 18px 0;
    border-top: 1px solid var(--line);
  }
  .story-section p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 13px;
    line-height: 1.68;
  }
  .story-section.wonder p {
    padding-left: 14px;
    border-left: 2px solid var(--aqua-2);
    color: #d7e3e5;
    font-style: italic;
  }
  .glossary { display: grid; gap: 6px; }
  .glossary details {
    border: 1px solid var(--line);
    border-radius: 9px;
    background: rgba(255, 255, 255, .025);
  }
  .glossary summary {
    padding: 9px 11px;
    color: var(--ink-soft);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .glossary details p { padding: 0 11px 10px; font-size: 11px; }
  .zoom-deeper {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 6px 0 20px;
    padding: 13px 14px;
    border: 1px solid rgba(85, 228, 209, .33);
    border-radius: 11px;
    background: rgba(85, 228, 209, .09);
    color: #c9fffa;
    font-weight: 600;
    cursor: pointer;
  }
  .zoom-deeper:hover { background: rgba(85, 228, 209, .14); }
  .zoom-deeper span { font-size: 17px; }
  .relations { display: grid; gap: 7px; }
  .relation {
    width: 100%;
    padding: 10px 11px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: rgba(255, 255, 255, .025);
    color: var(--ink-soft);
    text-align: left;
    cursor: pointer;
  }
  .relation:hover { border-color: var(--line-strong); }
  .relation-type { display: block; margin-bottom: 2px; color: var(--rel-color); font-size: 9px; text-transform: uppercase; }
  .relation strong { font-size: 11px; }
  .relation small { display: block; margin-top: 3px; color: var(--ink-dim); font-size: 10px; }
  .sources {
    margin-top: 10px;
    padding-top: 19px;
    border-top: 1px solid var(--line);
  }
  .sources a {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 8px 0;
    color: var(--ink-soft);
    font-size: 11px;
    text-decoration: none;
  }
  .sources a:hover { color: var(--aqua); }
  .source-index {
    width: 19px;
    height: 19px;
    flex: none;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 50%;
    color: var(--ink-dim);
    font-size: 8px;
  }
  .empty { color: var(--ink-dim); font-size: 11px; }

  .mobile-explore { display: none; }

  .loading {
    position: fixed;
    z-index: 100;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--night);
    transition: opacity .5s, visibility .5s;
  }
  .loading.done { opacity: 0; visibility: hidden; }
  .loading-globe {
    width: 64px;
    height: 64px;
    border: 1px solid rgba(85, 228, 209, .34);
    border-radius: 50%;
    position: relative;
    animation: breathe 1.7s ease-in-out infinite;
    box-shadow: inset 0 0 24px rgba(85, 228, 209, .16);
  }
  .loading-globe::before {
    content: "";
    position: absolute;
    inset: 8px 3px;
    border: 1px solid rgba(85, 228, 209, .46);
    border-radius: 50%;
  }
  .loading p {
    margin: 15px 0 0;
    color: var(--ink-dim);
    font-size: 10px;
    letter-spacing: .13em;
    text-align: center;
    text-transform: uppercase;
  }
  .loading button {
    display: none;
    margin: 15px auto 0;
    padding: 8px 13px;
    border: 1px solid var(--line-strong);
    border-radius: 9px;
    background: rgba(255, 255, 255, .06);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .loading.failed button { display: block; }
  .loading.failed .loading-globe { animation: none; opacity: .45; }
  @keyframes breathe { 50% { transform: scale(1.07); opacity: .7; } }

  @media (max-width: 1120px) {
    :root { --rail-width: 236px; --panel-width: 350px; }
    .overview-card { padding: 13px; }
    .detail-inner { padding-inline: 22px; }
  }

  @media (max-width: 900px) {
    :root { --top-height: 64px; }
    .workspace { grid-template-columns: minmax(0, 1fr) 350px; }
    .rail { display: none; }
    .brand-kicker, .subject-wrap label, .search-key { display: none; }
    .brand-title { font-size: 13px; }
    .topbar { gap: 12px; padding-inline: 14px; }
    .subject-wrap { padding-left: 12px; }
    .search { width: auto; flex: 1; }
    .mobile-explore {
      position: absolute;
      z-index: 9;
      left: 18px;
      bottom: 18px;
      display: block;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(7, 19, 26, .82);
      padding: 9px 12px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }
    .globe-hint { bottom: 18px; }
  }

  @media (max-width: 680px) {
    :root { --top-height: 60px; }
    .app { height: 100dvh; }
    .workspace { display: block; position: relative; }
    .globe-stage { height: 100%; }
    .detail {
      position: absolute;
      inset: auto 0 0;
      max-height: 62%;
      border-top: 1px solid var(--line-strong);
      border-left: 0;
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -25px 60px rgba(0, 0, 0, .35);
      transform: translateY(calc(100% - 104px));
      transition: transform .34s ease;
    }
    .detail.open { transform: translateY(0); }
    .detail::before {
      content: "";
      position: sticky;
      z-index: 2;
      top: 9px;
      display: block;
      width: 38px;
      height: 4px;
      margin: 9px auto -8px;
      border-radius: 999px;
      background: var(--line-strong);
    }
    .detail-inner { padding: 25px 21px 35px; }
    .detail h1 { font-size: 24px; }
    .lede { display: -webkit-box; font-size: 13px; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .detail.open .lede { display: block; }
    .top-action, .brand-title, .subject-wrap { display: none; }
    .brand { width: 36px; }
    .search { margin-left: 0; }
    .search-results { position: fixed; top: 55px; left: 10px; right: 10px; }
    .crumbs { left: 12px; top: 12px; right: 54px; }
    .crumbs button { max-width: 110px; font-size: 11px; }
    .level-readout { left: 19px; top: 49px; }
    .globe-toolbar { right: 12px; top: 12px; }
    .tool-button { width: 34px; height: 34px; }
    .globe-hint { display: none; }
    .mobile-explore { display: none; }
    .pin { max-width: 125px; padding: 6px 8px 6px 7px; }
    .pin-label { font-size: 9px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="loading" id="loading" role="status" aria-live="polite">
  <div>

<script>
window.__kgBootWatch = setTimeout(function () {
  const loading = document.getElementById("loading");
  if (!loading || loading.classList.contains("done")) return;
  loading.classList.add("failed");
  loading.querySelector("p").textContent = "The 3D world could not start";
}, 8000);
</script>
<script type="module">
import * as THREE from "/static/vendor/three.module.min.js";

const EDGE_STYLE = {
  "causes":          { color: "#ff746c", label: "causes" },
  "enables":         { color: "#65e696", label: "makes possible" },
  "depends-on":      { color: "#64a8ff", label: "depends on" },
  "conflicts-with":  { color: "#ffad5d", label: "competes with" },
  "precedes":        { color: "#bd86ff", label: "comes before" },
  "correlates-with": { color: "#8da4af", label: "changes alongside" },
};

const state = {
  subject: null,
  byId: new Map(),
  childrenOf: new Map(),
  focusId: null,
  selectedId: null,
  activeAngle: null,
  markerVectors: new Map(),
  pointer: null,
  moved: false,
  cameraDistance: 4.25,
  cameraTarget: 4.25,
  autoRotate: true,
  reducedMotion: matchMedia("(prefers-reduced-motion: reduce)").matches,
};

const visualCache = new Map();

const $ = (id) => document.getElementById(id);
const stage = $("globe-stage");
let scene, camera, renderer, globeGroup, planet, atmosphere, starfield, arcGroup;
let lastFrame = performance.now();

function angle(id) {
  return state.subject?.angles.find((item) => item.id === id);
}

function nodeColor(node) {
  return angle((node.angle_tags || [])[0])?.color || "#55e4d1";
}

function isDimmed(node) {
  return state.activeAngle && !(node.angle_tags || []).includes(state.activeAngle);
}

function currentNodes() {
  return state.childrenOf.get(state.focusId) || [];
}

async function boot() {
  const list = await fetchJSON("/api/subjects");
  const picker = $("subject-picker");
  picker.replaceChildren(...list.map((subject) => {
    const option = document.createElement("option");
    option.value = subject.id;
    option.textContent = subject.title;
    return option;
  }));
  picker.addEventListener("change", () => loadSubject(picker.value));
  bindUI();
  initGlobe();
  if (list.length) await loadSubject(list[0].id);
  clearTimeout(window.__kgBootWatch);
  $("loading").classList.add("done");
}

async function fetchJSON(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error(`Could not load ${url}`);
  return response.json();
}

async function loadSubject(id) {
  state.subject = await fetchJSON("/api/subjects/" + encodeURIComponent(id));
  state.byId = new Map(state.subject.nodes.map((node) => [node.id, node]));
  state.childrenOf = new Map();
  for (const node of state.subject.nodes) {
    if (node.parent === null) continue;
    if (!state.childrenOf.has(node.parent)) state.childrenOf.set(node.parent, []);
    state.childrenOf.get(node.parent).push(node);
  }
  const root = state.subject.nodes.find((node) => node.parent === null);
  state.focusId = root.id;
  state.selectedId = root.id;
  state.activeAngle = null;
  state.cameraTarget = 4.25;
  drawStaticUI();
  rebuildLevel();
  selectNode(root.id, false);
}

function bindUI() {
  $("zoom-in").addEventListener("click", () => changeZoom(-.42));
  $("zoom-out").addEventListener("click", () => changeZoom(.42));
  $("reset-view").addEventListener("click", resetView);
  $("surprise-button").addEventListener("click", surpriseMe);
  $("mobile-explore").addEventListener("click", () => {
    const nodes = currentNodes();
    if (nodes.length) selectNode(nodes[0].id);
  });

  stage.addEventListener("wheel", (event) => {
    event.preventDefault();
    state.autoRotate = false;
    changeZoom(event.deltaY * .0028);
  }, { passive: false });

  stage.addEventListener("pointerdown", (event) => {
    if (event.target.closest("button")) return;
    state.pointer = { x: event.clientX, y: event.clientY };
    state.moved = false;
    state.autoRotate = false;
    stage.classList.add("dragging");
    stage.setPointerCapture(event.pointerId);
  });
  stage.addEventListener("pointermove", (event) => {
    if (!state.pointer) return;
    const dx = event.clientX - state.pointer.x;
    const dy = event.clientY - state.pointer.y;
    if (Math.abs(dx) + Math.abs(dy) > 2) state.moved = true;
    globeGroup.rotation.y += dx * .006;
    globeGroup.rotation.x = THREE.MathUtils.clamp(globeGroup.rotation.x + dy * .004, -.65, .65);
    state.pointer = { x: event.clientX, y: event.clientY };
  });
  const endDrag = () => {
    state.pointer = null;
    stage.classList.remove("dragging");
  };
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);

  const detail = $("detail");
  detail.addEventListener("click", (event) => {
    if (innerWidth <= 680 && event.target === detail) detail.classList.toggle("open");
  });

  setupSearch();
  addEventListener("resize", resizeGlobe);
  addEventListener("keydown", (event) => {
    if (event.key === "/" && document.activeElement !== $("search-input")) {
      event.preventDefault();
      $("search-input").focus();
    }
    if (event.key === "Escape") closeSearch();
  });
}

function initGlobe() {
  try {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(37, 1, .1, 100);
    camera.position.z = state.cameraDistance;
    renderer = new THREE.WebGLRenderer({
      canvas: $("globe"),
      antialias: true,
      alpha: true,
      powerPreference: "high-performance",
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    globeGroup = new THREE.Group();
    scene.add(globeGroup);

    const planetMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uDeep: { value: new THREE.Color("#052f46") },
        uShallow: { value: new THREE.Color("#0b7f8e") },
        uGlow: { value: new THREE.Color("#55e4d1") },
      },
      vertexShader: `
        varying vec3 vNormal;
        varying vec3 vWorld;
        varying vec2 vUv;
        void main() {
          vUv = uv;
          vNormal = normalize(normalMatrix * normal);
          vec4 world = modelMatrix * vec4(position, 1.0);
          vWorld = world.xyz;
          gl_Position = projectionMatrix * viewMatrix * world;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec3 uDeep;
        uniform vec3 uShallow;
        uniform vec3 uGlow;
        varying vec3 vNormal;
        varying vec3 vWorld;
        varying vec2 vUv;

        float lines(float value, float count, float width) {
          float wave = abs(sin(value * 3.14159265 * count));
          return 1.0 - smoothstep(0.0, width, wave);
        }

        void main() {
          vec3 lightDir = normalize(vec3(-0.7, 0.65, 1.1));
          float light = max(dot(vNormal, lightDir), 0.0);
          float fresnel = pow(1.0 - max(dot(vNormal, vec3(0.0, 0.0, 1.0)), 0.0), 2.5);
          float current = sin(vUv.y * 50.0 + sin(vUv.x * 19.0 + uTime * 0.08) * 2.2) * .5 + .5;
          float meridian = lines(vUv.x, 18.0, .055);
          float parallel = lines(vUv.y, 9.0, .055);
          float grid = max(meridian, parallel) * .09;
          vec3 color = mix(uDeep, uShallow, light * .72 + current * .09);
          color += uGlow * (fresnel * .25 + grid);
          color *= .44 + light * .76;
          gl_FragColor = vec4(color, 1.0);
        }
      `,
    });
    planet = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 96), planetMaterial);
    globeGroup.add(planet);

    const wire = new THREE.Mesh(
      new THREE.SphereGeometry(1.006, 36, 18),
      new THREE.MeshBasicMaterial({
        color: "#8cece0",
        transparent: true,
        opacity: .045,
        wireframe: true,
      })
    );
    globeGroup.add(wire);

    atmosphere = new THREE.Mesh(
      new THREE.SphereGeometry(1.09, 64, 64),
      new THREE.ShaderMaterial({
        transparent: true,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexShader: `
          varying vec3 vNormal;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vNormal;
          void main() {
            float intensity = pow(0.72 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 3.0);
            gl_FragColor = vec4(0.22, 0.87, 0.86, 1.0) * intensity;
          }
        `,
      })
    );
    scene.add(atmosphere);

    starfield = createStars();
    scene.add(starfield);
    arcGroup = new THREE.Group();
    globeGroup.add(arcGroup);
    resizeGlobe();
    renderer.setAnimationLoop(animate);
  } catch (error) {
    console.error(error);
    $("globe-fallback").style.display = "grid";
  }
}

function createStars() {
  const count = 950;
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i += 1) {
    const radius = 9 + Math.random() * 20;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = radius * Math.cos(phi);
    positions[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  return new THREE.Points(
    geometry,
    new THREE.PointsMaterial({ color: "#d7f2f2", size: .018, transparent: true, opacity: .7 })
  );
}

function resizeGlobe() {
  if (!renderer) return;
  const rect = stage.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  renderer.setSize(rect.width, rect.height, false);
  camera.aspect = rect.width / rect.height;
  camera.updateProjectionMatrix();
}

function animate(now) {
  const dt = Math.min((now - lastFrame) / 1000, .05);
  lastFrame = now;
  if (state.autoRotate && !state.reducedMotion) globeGroup.rotation.y += dt * .055;
  state.cameraDistance += (state.cameraTarget - state.cameraDistance) * Math.min(1, dt * 7);
  camera.position.z = state.cameraDistance;
  planet.material.uniforms.uTime.value = now / 1000;
  starfield.rotation.y += dt * .002;
  updatePins();
  renderer.render(scene, camera);
}

function changeZoom(delta) {
  state.cameraTarget = THREE.MathUtils.clamp(state.cameraTarget + delta, 2.45, 5.8);
}

function resetView() {
  state.autoRotate = !state.reducedMotion;
  state.cameraTarget = state.byId.get(state.focusId)?.zoom_level ? 3.1 : 4.25;
  globeGroup.rotation.set(.12, -.35, 0);
}

function markerVector(index, total) {
  if (total === 1) return new THREE.Vector3(0, .2, 1).normalize();
  const golden = Math.PI * (3 - Math.sqrt(5));
  const y = 1 - (index / Math.max(1, total - 1)) * 1.65;
  const radius = Math.sqrt(Math.max(0, 1 - y * y));
  const theta = golden * index - .5;
  return new THREE.Vector3(Math.cos(theta) * radius, y, Math.sin(theta) * radius).normalize();
}

function rebuildLevel() {
  if (!globeGroup) return;
  const nodes = currentNodes();
  state.markerVectors.clear();
  nodes.forEach((node, index) => state.markerVectors.set(node.id, markerVector(index, nodes.length)));
  drawPins(nodes);
  drawPlaces(nodes);
  drawArcs(nodes);
  drawCrumbs();
  const focus = state.byId.get(state.focusId);
  $("level-readout").innerHTML = `Depth <strong>${focus.zoom_level + 1}</strong> · ${nodes.length || "final"} ${nodes.length === 1 ? "path" : "paths"}`;
}

function drawPins(nodes) {
  const box = $("node-pins");
  box.replaceChildren(...nodes.map((node) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "pin";
    button.dataset.id = node.id;
    button.style.setProperty("--pin-color", nodeColor(node));
    button.setAttribute("aria-label", `Open ${node.keyword}`);
    button.innerHTML = `<span class="pin-orb"></span><span class="pin-label"></span>`;
    button.querySelector(".pin-label").textContent = node.keyword;
    button.addEventListener("click", () => selectNode(node.id));
    return button;
  }));
  updatePinStates();
}

function updatePins() {
  if (!renderer || !state.markerVectors.size) return;
  const rect = renderer.domElement.getBoundingClientRect();
  globeGroup.updateMatrixWorld();
  for (const pin of $("node-pins").children) {
    const local = state.markerVectors.get(pin.dataset.id);
    if (!local) continue;
    const world = local.clone().multiplyScalar(1.08).applyMatrix4(globeGroup.matrixWorld);
    const visible = world.z > .08;
    const screen = world.clone().project(camera);
    const x = (screen.x * .5 + .5) * rect.width;
    const y = (-screen.y * .5 + .5) * rect.height;
    pin.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) scale(${THREE.MathUtils.clamp(5 / state.cameraDistance, .86, 1.2)})`;
    pin.classList.toggle("visible", visible);
    pin.tabIndex = visible ? 0 : -1;
  }
}

function drawArcs(nodes) {
  while (arcGroup.children.length) {
    const child = arcGroup.children.pop();
    child.geometry.dispose();
    child.material.dispose();
  }
  const ids = new Set(nodes.map((node) => node.id));
  const edges = state.subject.edges.filter((edge) => ids.has(edge.from) && ids.has(edge.to));
  for (const edge of edges) {
    const from = state.markerVectors.get(edge.from).clone().multiplyScalar(1.02);
    const to = state.markerVectors.get(edge.to).clone().multiplyScalar(1.02);
    const middle = from.clone().add(to).normalize().multiplyScalar(1.28);
    const curve = new THREE.QuadraticBezierCurve3(from, middle, to);
    const geometry = new THREE.BufferGeometry().setFromPoints(curve.getPoints(45));
    const material = new THREE.LineBasicMaterial({
      color: EDGE_STYLE[edge.type]?.color || "#8da4af",
      transparent: true,
      opacity: .42,
    });
    arcGroup.add(new THREE.Line(geometry, material));
  }
}

function drawStaticUI() {
  const subject = state.subject;
  $("overview-card").innerHTML = `
    <h2></h2>
    <p></p>
    <div class="overview-stats">
      <div><strong>${subject.nodes.length}</strong><span>discoveries</span></div>
      <div><strong>${Math.max(...subject.nodes.map((node) => node.zoom_level)) + 1}</strong><span>depths</span></div>
      <div><strong>${subject.edges.length}</strong><span>links</span></div>
    </div>`;
  $("overview-card").querySelector("h2").textContent = subject.title;
  $("overview-card").querySelector("p").textContent = subject.summary;

  const angleList = $("angle-list");
  angleList.replaceChildren(...subject.angles.map((item) => {
    const count = subject.nodes.filter((node) => node.angle_tags.includes(item.id)).length;
    const button = document.createElement("button");
    button.type = "button";
    button.className = "angle";
    button.dataset.angle = item.id;
    button.style.setProperty("--angle-color", item.color);
    button.setAttribute("aria-pressed", "false");
    button.innerHTML = `<span class="angle-dot"></span><span></span><span class="angle-count">${count}</span>`;
    button.children[1].textContent = item.label;
    button.addEventListener("click", () => {
      state.activeAngle = state.activeAngle === item.id ? null : item.id;
      updateAngleStates();
      updatePinStates();
      drawPlaces(currentNodes());
    });
    return button;
  }));
}

function updateAngleStates() {
  for (const button of $("angle-list").children) {
    button.setAttribute("aria-pressed", String(button.dataset.angle === state.activeAngle));
  }
}

function updatePinStates() {
  for (const pin of $("node-pins").children) {
    const node = state.byId.get(pin.dataset.id);
    pin.classList.toggle("selected", pin.dataset.id === state.selectedId);
    pin.classList.toggle("dimmed", Boolean(isDimmed(node)));
  }
}

function drawPlaces(nodes) {
  const sorted = [...nodes].sort((a, b) => Number(isDimmed(a)) - Number(isDimmed(b)));
  $("place-list").replaceChildren(...sorted.map((node) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "place" + (node.id === state.selectedId ? " selected" : "");
    button.style.setProperty("--place-color", nodeColor(node));
    const childCount = (state.childrenOf.get(node.id) || []).length;
    button.innerHTML = `<strong></strong><small>${childCount ? `${childCount} paths inside` : "A closer look"}</small>`;
    button.querySelector("strong").textContent = node.keyword;
    button.addEventListener("click", () => selectNode(node.id));
    return button;
  }));
}

function ancestry(id) {
  const chain = [];
  let cursor = state.byId.get(id);
  while (cursor) {
    chain.unshift(cursor);
    cursor = cursor.parent === null ? null : state.byId.get(cursor.parent);
  }
  return chain;
}

function drawCrumbs() {
  const box = $("crumbs");
  const chain = ancestry(state.focusId);
  box.replaceChildren();
  chain.forEach((node, index) => {
    if (index) {
      const separator = document.createElement("span");
      separator.className = "crumb-sep";
      separator.textContent = "›";
      box.append(separator);
    }
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = node.keyword;
    button.addEventListener("click", () => enterNode(node.id));
    box.append(button);
  });
}

function selectNode(id, openMobile = true) {
  state.selectedId = id;
  updatePinStates();
  drawPlaces(currentNodes());
  drawDetail(state.byId.get(id));
  if (openMobile && innerWidth <= 680) $("detail").classList.add("open");
}

function enterNode(id) {
  const node = state.byId.get(id);
  if (!node) return;
  state.focusId = id;
  state.selectedId = id;
  state.activeAngle = null;
  state.cameraTarget = node.zoom_level === 0 ? 4.25 : 3.05;
  updateAngleStates();
  if (!state.reducedMotion) {
    globeGroup.rotation.set(.1, -.45, 0);
    state.autoRotate = true;
  }
  rebuildLevel();
  drawDetail(node);
}

function drawDetail(node) {
  const kids = state.childrenOf.get(node.id) || [];
  const tags = (node.angle_tags || []).map((id) => angle(id)).filter(Boolean);
  const relations = state.subject.edges
    .filter((edge) => edge.from === node.id || edge.to === node.id)
    .slice(0, 4)
    .map((edge) => {
      const otherId = edge.from === node.id ? edge.to : edge.from;
      return { edge, other: state.byId.get(otherId), outgoing: edge.from === node.id };
    });
  const glossary = node.glossary || [];
  const sources = node.sources || [];
  const box = $("detail");
  box.dataset.nodeId = node.id;
  box.innerHTML = `
    <div class="detail-inner">
      <div class="detail-topline">
        <span class="detail-kicker">${node.zoom_level === 0 ? "The big picture" : `Depth ${node.zoom_level + 1}`}</span>
        <span class="verified">${sources.length ? "Source-checked" : "Overview"}</span>
      </div>
      <h1></h1>
      <div class="angle-tags"></div>
      <p class="lede"></p>
      <figure class="node-visual" aria-live="polite">
        <img loading="lazy" decoding="async">
        <div class="visual-loading">Finding an openly licensed visual…</div>
        <figcaption class="visual-caption"></figcaption>
      </figure>
      ${node.key_fact ? `<div class="fact-card"><span>One remarkable fact</span><strong></strong></div>` : ""}
      ${node.explainer ? `<section class="story-section"><h2>Look closer</h2><p class="explainer"></p></section>` : ""}
      ${node.why_it_matters ? `<section class="story-section"><h2>Why it matters</h2><p class="why"></p></section>` : ""}
      ${node.wonder ? `<section class="story-section wonder"><h2>Keep wondering</h2><p class="wonder-text"></p></section>` : ""}
      ${glossary.length ? `<section class="story-section"><h2>Words worth knowing</h2><div class="glossary"></div></section>` : ""}
      ${kids.length && node.id !== state.focusId ? `<button class="zoom-deeper" type="button">Zoom into ${kids.length} ${kids.length === 1 ? "path" : "paths"} <span>→</span></button>` : ""}
      ${relations.length ? `<section class="story-section"><h2>Connections</h2><div class="relations"></div></section>` : ""}
      <section class="sources"><h2>Sources & further reading</h2><div class="source-list"></div></section>
    </div>`;
  box.querySelector("h1").textContent = node.keyword;
  box.querySelector(".lede").textContent = node.summary || "";
  if (node.key_fact) box.querySelector(".fact-card strong").textContent = node.key_fact;
  if (node.explainer) box.querySelector(".explainer").textContent = node.explainer;
  if (node.why_it_matters) box.querySelector(".why").textContent = node.why_it_matters;
  if (node.wonder) box.querySelector(".wonder-text").textContent = node.wonder;
  loadVisual(node, box);

  const tagBox = box.querySelector(".angle-tags");
  tagBox.replaceChildren(...tags.map((item) => {
    const tag = document.createElement("span");
    tag.className = "angle-tag";
    tag.style.setProperty("--tag-color", item.color);
    tag.textContent = item.label;
    return tag;
  }));

  if (kids.length && node.id !== state.focusId) {
    box.querySelector(".zoom-deeper").addEventListener("click", () => enterNode(node.id));
  }

  if (glossary.length) {
    const glossaryBox = box.querySelector(".glossary");
    glossaryBox.replaceChildren(...glossary.map((item) => {
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      const p = document.createElement("p");
      summary.textContent = item.term;
      p.textContent = item.definition;
      details.append(summary, p);
      return details;
    }));
  }

  if (relations.length) {
    const relBox = box.querySelector(".relations");
    relBox.replaceChildren(...relations.map(({ edge, other, outgoing }) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "relation";
      button.style.setProperty("--rel-color", EDGE_STYLE[edge.type]?.color || "#8da4af");
      const relationLabel = outgoing ? EDGE_STYLE[edge.type]?.label : `is ${EDGE_STYLE[edge.type]?.label || edge.type} by`;
      button.innerHTML = `<span class="relation-type"></span><strong></strong>${edge.label ? "<small></small>" : ""}`;
      button.querySelector(".relation-type").textContent = relationLabel;
      button.querySelector("strong").textContent = other.keyword;
      if (edge.label) button.querySelector("small").textContent = edge.label;
      button.addEventListener("click", () => revealNode(other.id));
      return button;
    }));
  }

  const sourceList = box.querySelector(".source-list");
  if (sources.length) {
    sourceList.replaceChildren(...sources.map((source, index) => {
      const link = document.createElement("a");
      link.href = source.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.innerHTML = `<span class="source-index">${index + 1}</span><span></span>`;
      link.lastElementChild.textContent = source.title;
      return link;
    }));
  } else {
    sourceList.innerHTML = `<p class="empty">This overview gathers the sourced paths below it.</p>`;
  }
}

function plainText(value) {
  const doc = new DOMParser().parseFromString(value || "", "text/html");
  return (doc.body.textContent || "").replace(/\s+/g, " ").trim();
}

function visualSearchTerm(node) {
  if (node.visual_query) return node.visual_query;
  const hasChildren = (state.childrenOf.get(node.id) || []).length > 0;
  if (hasChildren) return `${node.keyword} ${state.subject.title}`;
  const suffix = state.subject.visual_query_suffix || state.subject.title;
  return `${node.keyword} ${suffix}`;
}

async function findCommonsVisual(node) {
  const query = visualSearchTerm(node);
  if (visualCache.has(query)) return visualCache.get(query);
  const task = (async () => {
    const params = new URLSearchParams({
      action: "query",
      generator: "search",
      gsrsearch: `${query} filetype:bitmap`,
      gsrnamespace: "6",
      gsrlimit: "3",
      gsrsort: "relevance",
      prop: "imageinfo",
      iiprop: "url|extmetadata",
      iiurlwidth: "1200",
      format: "json",
      origin: "*",
    });
    const response = await fetch(`https://commons.wikimedia.org/w/api.php?${params}`);
    if (!response.ok) throw new Error("Commons search failed");
    const payload = await response.json();
    const pages = Object.values(payload.query?.pages || {}).sort((a, b) => (a.index || 99) - (b.index || 99));
    const page = pages.find((item) => item.imageinfo?.[0]?.thumburl);
    if (!page) return null;
    const info = page.imageinfo[0];
    const meta = info.extmetadata || {};
    return {
      src: info.thumburl,
      page: info.descriptionurl,
      title: plainText(meta.ObjectName?.value) || page.title.replace(/^File:/, ""),
      description: plainText(meta.ImageDescription?.value),
      artist: plainText(meta.Artist?.value) || "Wikimedia Commons contributor",
      licence: plainText(meta.LicenseShortName?.value) || plainText(meta.UsageTerms?.value) || "See source for licence",
      licenceUrl: meta.LicenseUrl?.value || info.descriptionurl,
    };
  })();
  visualCache.set(query, task);
  return task;
}

async function loadVisual(node, box) {
  const figure = box.querySelector(".node-visual");
  if (!figure || node.visual === false) {
    figure?.remove();
    return;
  }
  try {
    const visual = await findCommonsVisual(node);
    if (box.dataset.nodeId !== node.id || !figure.isConnected) return;
    if (!visual) throw new Error("No visual found");
    const img = figure.querySelector("img");
    img.alt = node.visual_alt || visual.description || `Openly licensed visual related to ${node.keyword}`;
    img.referrerPolicy = "no-referrer";
    img.addEventListener("load", () => figure.classList.add("ready"), { once: true });
    img.addEventListener("error", () => {
      figure.classList.add("failed");
      figure.querySelector(".visual-loading").textContent = "The visual could not be loaded. The learning content is still available below.";
    }, { once: true });
    img.src = visual.src;
    const caption = figure.querySelector(".visual-caption");
    const description = node.visual_caption || visual.description || visual.title;
    caption.replaceChildren(document.createTextNode(description));
    const credit = document.createElement("span");
    credit.className = "visual-credit";
    credit.append("Photo: ", visual.artist, " · ");
    const source = document.createElement("a");
    source.href = visual.page;
    source.target = "_blank";
    source.rel = "noopener noreferrer";
    source.textContent = visual.licence;
    source.setAttribute("aria-label", `${visual.licence}; open source and licence details`);
    credit.append(source);
    caption.append(credit);
  } catch (error) {
    if (box.dataset.nodeId !== node.id || !figure.isConnected) return;
    figure.classList.add("failed");
    figure.querySelector(".visual-loading").textContent = "No trustworthy open visual was found for this topic. The sourced learning content continues below.";
  }
}

function revealNode(id) {
  const node = state.byId.get(id);
  const parent = node.parent === null ? node.id : node.parent;
  state.focusId = parent;
  rebuildLevel();
  selectNode(id);
}

function surpriseMe() {
  const candidates = state.subject.nodes.filter((node) => node.parent !== null && (node.sources || []).length);
  const node = candidates[Math.floor(Math.random() * candidates.length)];
  revealNode(node.id);
  state.cameraTarget = 2.85;
  globeGroup.rotation.y += 1.7;
}

function setupSearch() {
  const input = $("search-input");
  const results = $("search-results");
  input.addEventListener("input", () => {
    const query = input.value.trim().toLowerCase();
    if (!query || !state.subject) return closeSearch();
    const matches = state.subject.nodes.filter((node) =>
      `${node.keyword} ${node.summary} ${node.explainer || ""}`.toLowerCase().includes(query)
    ).slice(0, 8);
    results.replaceChildren(...matches.map((node) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "search-result";
      button.setAttribute("role", "option");
      button.innerHTML = "<strong></strong><span></span>";
      button.querySelector("strong").textContent = node.keyword;
      button.querySelector("span").textContent = node.summary;
      button.addEventListener("click", () => {
        revealNode(node.id);
        input.value = "";
        closeSearch();
      });
      return button;
    }));
    results.classList.add("open");
    input.setAttribute("aria-expanded", "true");
  });
  input.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closeSearch();
  });
  document.addEventListener("pointerdown", (event) => {
    if (!event.target.closest(".search")) closeSearch();
  });
}

function closeSearch() {
  $("search-results").classList.remove("open");
  $("search-input").setAttribute("aria-expanded", "false");
}

boot().catch((error) => {
  console.error(error);
  clearTimeout(window.__kgBootWatch);
  $("loading").classList.add("failed");
  $("loading").querySelector("p").textContent = "This world could not be loaded";
});
</script>
</body>
