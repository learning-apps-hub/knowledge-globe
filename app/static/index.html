<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Globe</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #171e26;
    --line: #2a3441;
    --ink: #e6edf3;
    --ink-dim: #8b98a5;
    --focus-ring: #4b5b6e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  select {
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px; font: inherit;
  }

  #angles { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .chip {
    border: 1px solid var(--line); background: transparent; color: var(--ink-dim);
    border-radius: 999px; padding: 4px 11px; font-size: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 6px; font-family: inherit;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .chip[aria-pressed="true"] { color: var(--ink); border-color: currentColor; }

  #crumbs {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 12px;
    color: var(--ink-dim); min-height: 33px;
  }
  #crumbs button {
    background: none; border: none; color: var(--ink-dim); cursor: pointer;
    font: inherit; padding: 2px 4px; border-radius: 4px;
  }
  #crumbs button:hover { color: var(--ink); background: var(--panel); }
  #crumbs .sep { opacity: .5; }

  main { flex: 1; display: flex; min-height: 0; }
  #canvas-wrap { flex: 1; min-width: 0; position: relative; }
  svg { width: 100%; height: 100%; display: block; }

  .node-card {
    height: 100%; padding: 8px 10px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line);
    cursor: pointer; overflow: hidden;
    transition: opacity .18s, border-color .18s, transform .18s;
  }
  .node-card:hover { transform: translateY(-1px); }
  .node-card.focus { border-color: var(--focus-ring); background: #1d2732; }
  .node-card.dimmed { opacity: .22; }
  .node-card.selected { outline: 2px solid var(--ink); outline-offset: 1px; }
  .node-kw {
    font-weight: 600; font-size: 13px; line-height: 1.25; margin-bottom: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .node-sum {
    font-size: 11px; color: var(--ink-dim); line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .angle-bar { display: flex; gap: 3px; margin-bottom: 5px; }
  .angle-bar i { width: 16px; height: 3px; border-radius: 2px; }
  .kids-badge {
    position: absolute; font-size: 10px; color: var(--ink-dim);
  }

  .edge { fill: none; stroke-width: 1.4; opacity: .55; }
  .edge.faded { opacity: .12; }
  .edge-label {
    font-size: 10px; fill: var(--ink); paint-order: stroke;
    stroke: var(--bg); stroke-width: 3px; opacity: 0; pointer-events: none;
  }
  .edge-hit { stroke: transparent; stroke-width: 14px; fill: none; cursor: help; }
  .edge-hit:hover + .edge-label { opacity: 1; }

  aside {
    width: 330px; flex: none; border-left: 1px solid var(--line);
    background: var(--panel); padding: 16px; overflow-y: auto;
  }
  aside h2 { font-size: 15px; margin: 0 0 6px; line-height: 1.3; }
  aside .meta { font-size: 11px; color: var(--ink-dim); margin-bottom: 12px; }
  aside p.summary { font-size: 13px; margin: 0 0 16px; }
  aside h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--ink-dim); margin: 16px 0 7px; font-weight: 600;
  }
  aside ul { list-style: none; padding: 0; margin: 0; }
  aside li { margin-bottom: 7px; font-size: 12px; }
  aside a { color: #7cb3ff; }
  .rel-type {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--ink-dim); margin-right: 5px;
  }
  .rel-target {
    background: none; border: none; color: var(--ink); cursor: pointer;
    font: inherit; padding: 0; text-align: left; text-decoration: underline;
    text-decoration-color: var(--line);
  }
  .empty { color: var(--ink-dim); font-size: 12px; }

  #legend {
    position: absolute; left: 14px; bottom: 14px; background: rgba(23,30,38,.92);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-size: 11px;
  }
  #legend div { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; color: var(--ink-dim); }
  #legend div:last-child { margin-bottom: 0; }
  #legend svg { width: 26px; height: 8px; }
</style>
</head>
<body>

<header>
  <h1>Knowledge Globe</h1>
  <select id="subject-picker" aria-label="Subject"></select>
  <div id="angles" role="group" aria-label="Angles"></div>
</header>

<nav id="crumbs" aria-label="Breadcrumb"></nav>

<main>
  <div id="canvas-wrap">
    <svg id="canvas" role="img" aria-label="Subject map"></svg>
    <div id="legend"></div>
  </div>
  <aside id="detail"></aside>
</main>

<script>
const EDGE_STYLE = {
  "causes":          { color: "#EF4444", dash: "" },
  "enables":         { color: "#22C55E", dash: "" },
  "depends-on":      { color: "#3B82F6", dash: "5 3" },
  "conflicts-with":  { color: "#F97316", dash: "2 3" },
  "precedes":        { color: "#A855F7", dash: "8 4" },
  "correlates-with": { color: "#64748B", dash: "1 4" },
};
const CARD_W = 168, CARD_H = 92;

const state = {
  subject: null,
  byId: new Map(),
  childrenOf: new Map(),
  focusId: null,
  selectedId: null,
  activeAngle: null,
};

const $ = (id) => document.getElementById(id);
const svgEl = (tag, attrs) => {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  return el;
};

async function boot() {
  const list = await (await fetch("/api/subjects")).json();
  const picker = $("subject-picker");
  picker.innerHTML = "";
  for (const s of list) {
    const opt = document.createElement("option");
    opt.value = s.id;
    opt.textContent = s.title;
    picker.append(opt);
  }
  picker.onchange = () => loadSubject(picker.value);
  drawLegend();
  if (list.length) await loadSubject(list[0].id);
  addEventListener("resize", render);
}

async function loadSubject(id) {
  state.subject = await (await fetch("/api/subjects/" + encodeURIComponent(id))).json();
  state.byId = new Map(state.subject.nodes.map((n) => [n.id, n]));
  state.childrenOf = new Map();
  for (const n of state.subject.nodes) {
    if (n.parent === null) continue;
    if (!state.childrenOf.has(n.parent)) state.childrenOf.set(n.parent, []);
    state.childrenOf.get(n.parent).push(n);
  }
  const root = state.subject.nodes.find((n) => n.parent === null);
  state.focusId = root.id;
  state.selectedId = root.id;
  state.activeAngle = null;
  drawAngles();
  render();
}

function drawAngles() {
  const box = $("angles");
  box.innerHTML = "";
  for (const angle of state.subject.angles) {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.style.color = angle.color;
    chip.setAttribute("aria-pressed", "false");
    chip.innerHTML = `<span class="dot"></span>${angle.label}`;
    chip.onclick = () => {
      state.activeAngle = state.activeAngle === angle.id ? null : angle.id;
      drawAngleStates();
      render();
    };
    chip.dataset.angle = angle.id;
    box.append(chip);
  }
}

function drawAngleStates() {
  for (const chip of $("angles").children) {
    chip.setAttribute("aria-pressed", String(chip.dataset.angle === state.activeAngle));
  }
}

function drawLegend() {
  $("legend").innerHTML = Object.entries(EDGE_STYLE).map(([type, s]) => `
    <div><svg viewBox="0 0 26 8"><line x1="1" y1="4" x2="25" y2="4"
      stroke="${s.color}" stroke-width="2" stroke-dasharray="${s.dash}"/></svg>${type}</div>`).join("");
}

const angleColor = (id) => (state.subject.angles.find((a) => a.id === id) || {}).color || "#666";
const isDimmed = (node) =>
  state.activeAngle !== null && !(node.angle_tags || []).includes(state.activeAngle);

function ancestry(id) {
  const chain = [];
  let cursor = state.byId.get(id);
  while (cursor) {
    chain.unshift(cursor);
    cursor = cursor.parent === null ? null : state.byId.get(cursor.parent);
  }
  return chain;
}

function render() {
  drawCrumbs();
  drawCanvas();
  drawDetail();
}

function drawCrumbs() {
  const box = $("crumbs");
  box.innerHTML = "";
  const chain = ancestry(state.focusId);
  chain.forEach((node, i) => {
    if (i) {
      const sep = document.createElement("span");
      sep.className = "sep";
      sep.textContent = "›";
      box.append(sep);
    }
    const btn = document.createElement("button");
    btn.textContent = node.keyword;
    if (i === chain.length - 1) btn.style.color = "var(--ink)";
    btn.onclick = () => { state.focusId = node.id; state.selectedId = node.id; render(); };
    box.append(btn);
  });
}

function drawCanvas() {
  const svg = $("canvas");
  const wrap = $("canvas-wrap");
  const W = wrap.clientWidth, H = wrap.clientHeight;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = "";

  const focus = state.byId.get(state.focusId);
  const kids = state.childrenOf.get(focus.id) || [];
  const cx = W / 2, cy = H / 2;
  const rx = Math.max(140, W / 2 - CARD_W / 2 - 24);
  const ry = Math.max(110, H / 2 - CARD_H / 2 - 24);

  const positions = new Map([[focus.id, { x: cx, y: cy }]]);
  kids.forEach((kid, i) => {
    const angle = (i / kids.length) * Math.PI * 2 - Math.PI / 2;
    positions.set(kid.id, {
      x: cx + Math.cos(angle) * rx,
      y: cy + Math.sin(angle) * ry,
    });
  });

  const edgeLayer = svgEl("g");
  const nodeLayer = svgEl("g");
  svg.append(edgeLayer, nodeLayer);

  for (const edge of state.subject.edges) {
    const a = positions.get(edge.from), b = positions.get(edge.to);
    if (!a || !b) continue;
    const style = EDGE_STYLE[edge.type] || { color: "#666", dash: "" };
    const faded =
      state.activeAngle !== null &&
      (isDimmed(state.byId.get(edge.from)) || isDimmed(state.byId.get(edge.to)));
    const attrs = { x1: a.x, y1: a.y, x2: b.x, y2: b.y };
    edgeLayer.append(svgEl("line", {
      ...attrs, class: "edge" + (faded ? " faded" : ""),
      stroke: style.color, "stroke-dasharray": style.dash,
    }));
    const hit = svgEl("line", { ...attrs, class: "edge-hit" });
    const tip = svgEl("title");
    tip.textContent = edge.label ? `${edge.type}: ${edge.label}` : edge.type;
    hit.append(tip);
    const label = svgEl("text", {
      class: "edge-label", x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 - 5,
      "text-anchor": "middle",
    });
    label.textContent = edge.label || edge.type;
    edgeLayer.append(hit, label);
  }

  for (const [id, pos] of positions) {
    nodeLayer.append(nodeCard(state.byId.get(id), pos, id === focus.id));
  }
}

function nodeCard(node, pos, isFocus) {
  const w = isFocus ? CARD_W + 26 : CARD_W;
  const fo = svgEl("foreignObject", {
    x: pos.x - w / 2, y: pos.y - CARD_H / 2, width: w, height: CARD_H,
  });
  const card = document.createElement("div");
  card.className = "node-card"
    + (isFocus ? " focus" : "")
    + (isDimmed(node) ? " dimmed" : "")
    + (node.id === state.selectedId ? " selected" : "");
  card.innerHTML = `
    <div class="angle-bar">${(node.angle_tags || [])
      .map((t) => `<i style="background:${angleColor(t)}"></i>`).join("")}</div>
    <div class="node-kw"></div>
    <div class="node-sum"></div>`;
  card.querySelector(".node-kw").textContent = node.keyword;
  card.querySelector(".node-sum").textContent = node.summary || "";
  card.onclick = () => {
    state.selectedId = node.id;
    if ((state.childrenOf.get(node.id) || []).length && node.id !== state.focusId) {
      state.focusId = node.id;
    }
    render();
  };
  fo.append(card);
  return fo;
}

function drawDetail() {
  const node = state.byId.get(state.selectedId);
  const kids = state.childrenOf.get(node.id) || [];
  const rels = state.subject.edges
    .filter((e) => e.from === node.id || e.to === node.id)
    .map((e) => {
      const otherId = e.from === node.id ? e.to : e.from;
      return { type: e.type, label: e.label, outgoing: e.from === node.id, other: state.byId.get(otherId) };
    });
  const angles = (node.angle_tags || [])
    .map((t) => (state.subject.angles.find((a) => a.id === t) || {}).label)
    .filter(Boolean);

  const box = $("detail");
  box.innerHTML = "";
  const h2 = document.createElement("h2");
  h2.textContent = node.keyword;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = `zoom level ${node.zoom_level}`
    + (angles.length ? " · " + angles.join(" · ") : "");
  const summary = document.createElement("p");
  summary.className = "summary";
  summary.textContent = node.summary || "";
  box.append(h2, meta, summary);

  if (kids.length) {
    box.append(sectionTitle("Zoom into"));
    const ul = document.createElement("ul");
    for (const kid of kids) {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.className = "rel-target";
      btn.textContent = kid.keyword;
      btn.onclick = () => { state.focusId = kid.id; state.selectedId = kid.id; render(); };
      li.append(btn);
      ul.append(li);
    }
    box.append(ul);
  }

  box.append(sectionTitle("Relations"));
  if (rels.length) {
    const ul = document.createElement("ul");
    for (const rel of rels) {
      const li = document.createElement("li");
      const tag = document.createElement("span");
      tag.className = "rel-type";
      tag.textContent = rel.outgoing ? rel.type : "← " + rel.type;
      tag.style.color = (EDGE_STYLE[rel.type] || {}).color || "";
      const btn = document.createElement("button");
      btn.className = "rel-target";
      btn.textContent = rel.other.keyword;
      btn.onclick = () => {
        state.selectedId = rel.other.id;
        state.focusId = rel.other.parent === null ? rel.other.id : rel.other.parent;
        render();
      };
      li.append(tag, btn);
      if (rel.label) {
        const note = document.createElement("div");
        note.className = "empty";
        note.textContent = rel.label;
        li.append(note);
      }
      ul.append(li);
    }
    box.append(ul);
  } else {
    box.append(emptyNote("No typed relations on this node."));
  }

  box.append(sectionTitle("Sources"));
  if ((node.sources || []).length) {
    const ul = document.createElement("ul");
    for (const src of node.sources) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = src.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = src.title;
      li.append(a);
      ul.append(li);
    }
    box.append(ul);
  } else {
    box.append(emptyNote("No sources — organizational node."));
  }
}

function sectionTitle(text) {
  const h3 = document.createElement("h3");
  h3.textContent = text;
  return h3;
}

function emptyNote(text) {
  const p = document.createElement("p");
  p.className = "empty";
  p.textContent = text;
  return p;
}

boot();
</script>
</body>
</html>
